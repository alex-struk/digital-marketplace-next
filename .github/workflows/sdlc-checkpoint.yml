name: sdlc checkpoint
on: { pull_request: {} }
permissions: { contents: read, pull-requests: write }
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      # Pinned by `sdlc init` to the commit recorded in .sdlc/lock.json.
      # Configured ref: main
      - run: npx --yes github:alex-struk/agentic-sdlc#2e6f380c68ff802ea2eddcff9b32b0edbc2118a9 checks --json
