  # One message the service sent, read back from the mail catcher rather than from the
  # service. Served by the catcher at ${SDLC_MAIL_API} (spec/contract/observables.yaml,
  # email.read_one_message), not at the target's base URL, which is what "origin" says.
  #
  # A criterion about what a message says, who else it reached, who it came from or where
  # its links lead needs one message's headers and bodies, and the catcher's listing and
  # search carry neither the blind copies, the sender nor either body. :messageId is the
  # catcher's own identifier for the message: the ID of a result of mail.messagesTo, or one
  # of caught-message-list.message_identifiers.
  - id: caught-message
    domain: notifications
    origin: mail-catcher
    route: /api/v1/message/:messageId
    title: "A message the service sent"
    actions:
      # Opens, in the browser, the link in the formatted body whose label is given — the
      # accept and decline choices of an invitation, an unsubscribe offer, a sign-in link.
      # The browser lands wherever the service sends it, which the landing page's own
      # observations then read.
      follow_link_in_body: { test_id: null }
    observations:
      visible_recipients: { test_id: null }
      copied_recipients: { test_id: null }
      sender: { test_id: null }
      reply_to: { test_id: null }
      subject: { test_id: null }
      html_body: { test_id: null }
      plain_text_body: { test_id: null }
      # The address of the image at the top of the formatted body, which is where the
      # service's logo, or its test variant, is shown.
      logo_address: { test_id: null }
      # Every link in the formatted body, each as its label and where it leads.
      links_in_body: { test_id: null }

  # Every message in the mail catcher, newest first. The mail fixture searches by one
  # visible recipient, and a message addressed to nobody visibly, or to a person with no
  # address, is found only by listing. Read the three observations together: the nth
  # identifier, subject and visible recipient belong to the same message.
  - id: caught-message-list
    domain: notifications
    origin: mail-catcher
    route: /api/v1/messages
    title: "Every message the service sent"
    actions: {}
    observations:
      message_identifiers: { test_id: null }
      message_subjects: { test_id: null }
      message_visible_recipients: { test_id: null }
      message_count: { test_id: null }

  # A mail server that will not take delivery, for the criteria whose given is a message
  # that cannot be delivered. Served by the catcher at ${SDLC_MAIL_API}
  # (spec/contract/observables.yaml, email.delivery_fault), not by the target: the catcher
  # answers every attempt to send with a refusal while the fault is in force, which is
  # what the service meets when its mail server cannot deliver. The target itself is not
  # reconfigured, so its own mail settings, and everything it does besides sending, are
  # exactly as in every other test.
  #
  # The fault outlives the test that set it unless it is lifted, and the harness does not
  # lift it when it puts the data back to the seed. A test that uses refuse_delivery must
  # call restore_delivery when it ends, pass or fail.
  - id: mail-delivery-fault
    domain: notifications
    origin: mail-catcher
    route: /api/v1/chaos
    title: "A mail server that refuses delivery"
    actions:
      # Every message the service tries to send from now on is refused by the mail server
      # at the start of the attempt, so nothing reaches the catcher.
      refuse_delivery: { test_id: null }
      # Delivery is accepted again. Messages refused earlier stay refused: the catcher keeps
      # nothing of them, so one that turns up afterwards was sent again by the service.
      restore_delivery: { test_id: null }
    observations:
      delivery_refused: { test_id: null }

  # A mail server that is slow to answer, for the criteria about the order of an answer
  # and the messages behind it — an action reported as done while its messages are still
  # being sent. Served beside the catcher at ${SDLC_MAIL_API}/hold (observables.yaml,
  # email.delivery_delay), not by the target. While the delay is in force every reply the
  # mail server makes reaches the service three seconds late, so each message takes
  # several of those delays to reach the catcher and none can arrive sooner than nine
  # seconds after the service starts sending it. Nothing is refused or lost: when the
  # delay is lifted, messages already on their way arrive.
  #
  # The delay outlives the test that set it, and putting the data back to the seed does
  # not lift it. A test that uses slow_delivery must call restore_delivery_speed when it
  # ends, pass or fail.
  - id: mail-delivery-delay
    domain: notifications
    origin: mail-catcher
    route: /hold/proxies/smtp/toxics
    title: "A mail server that is slow to answer"
    actions:
      slow_delivery: { test_id: null }
      restore_delivery_speed: { test_id: null }
    observations:
      delivery_slowed: { test_id: null }

  # Requests the screens never make. The entries below are addresses of the service's own
  # interface (spec/contract/openapi.yaml), listed because criteria describe the service's
  # answer to a request that no screen sends — a membership type the team page never
  # offers, a draft the form would not let through, a single evaluation submitted on its
  # own — or the form a refusal takes, which a screen reports only as prose. The file
  # upload entries above are the same kind of page. Each action is made as the signed-in
  # person, carrying their session, and each observation reads the service's answer.

  # Watching an opportunity, as a request that never toggles. The screens offer only
  # toggle_watch, which stops a watch when pressed a second time, so they never send a
  # second watch of the same opportunity; this does. :program is code-with-us,
  # sprint-with-us or team-with-us. watch_by_request addresses the collection and takes the
  # opportunity's identifier as input; stop_watching_by_request addresses the same
  # opportunity's identifier (not a subscription's), which is how the service finds the
  # signed-in person's watch.
  #
  # The service answers an accepted watch with the subscription it created. It refuses a
  # watch of an opportunity the person already watches with the reason conflict ("This
  # user is already subscribed to this opportunity."), a watch of the person's own
  # opportunity with the reason opportunity ("You cannot subscribe to your own
  # opportunity."), an identifier naming no opportunity the person can see with notFound,
  # and a request with no session with permissions. A refused watch records nothing.
  #
  # The starting point is seed.opportunities.publishedCodeWithUs (created by
  # users.staffOne, watched by nobody), watched as users.vendorOne. An accepted watch
  # outlasts the request, so a test that watches calls stop_watching_by_request when it
  # ends, leaving the opportunity watched by nobody for the next one.
  - id: opportunity-watch-request
    domain: opportunities
    route: /api/subscribers/:program
    title: "Watch an opportunity, by request"
    actions:
      # Input: the opportunity's identifier. Always asks to start watching.
      watch_by_request: { test_id: opportunity-watch-request-watch }
      # Input: the opportunity's identifier. Asks to stop watching it.
      stop_watching_by_request: { test_id: opportunity-watch-request-stop }
    observations:
      # The service accepted the last request (the subscription it answers with).
      request_accepted: { test_id: opportunity-watch-request-accepted }
      refusal_status: { test_id: opportunity-watch-request-refusal-status }
      # The name the refusal is filed under: conflict for a duplicate watch, opportunity
      # for one's own opportunity, notFound, or permissions. Absent when accepted.
      refusal_reason: { test_id: opportunity-watch-request-refusal-reason }
      # The refusal's messages, in the order the service gives them. Empty when accepted.
      refusal_messages: { test_id: opportunity-watch-request-refusal-messages }
      # Whether the signed-in person watches the opportunity, as the service reports it on
      # the opportunity itself (/api/opportunities/:program/<identifier>, its subscribed
      # flag) — independent of the answer to the watch request.
      watching: { test_id: opportunity-watch-request-watching }

  # The organizations the signed-in person may act on behalf of, as the service answers
  # when asked for them — the list a proposal's organization is chosen from.
  - id: organization-acting-for-list
    domain: organizations
    route: /api/ownedOrganizations
    title: "Organizations one may act for"
    actions: {}
    observations:
      organizations_offered: { test_id: organization-acting-for-list-organizations }
      # Answered as not permitted, as distinct from an empty list.
      refused_when_not_permitted: { test_id: organization-acting-for-list-refused }

  # An invitation to join an organization, made as a request so that it can name any
  # membership type.
  - id: affiliation-invitation-request
    domain: organizations
    route: /api/affiliations
    title: "Invite somebody to an organization"
    actions:
      # Input: the inviting organization (a seed.organizations handle), the invited
      # person's email address, and the membership type to name.
      invite_with_membership_type: { test_id: affiliation-invitation-request-invite }
    observations:
      invitation_created: { test_id: affiliation-invitation-request-created }
      invalid_membership_type_error: { test_id: affiliation-invitation-request-invalid-membership-type }
      # The identifier of the membership the invitation created, from the service's answer,
      # for affiliation-approval-request.
      membership_identifier: { test_id: affiliation-invitation-request-membership-id }

  # Accepting a membership, as a request, so that an acceptance the screens never send can
  # be sent and its answer read. The organizations tab offers accepting only on a pending
  # invitation, to the invited person, and reports a failure as a general notice; the
  # service's reason — "Membership is not pending." for a membership already active, or
  # its permission message for somebody who may not accept — is read here. :affiliationId
  # is a seed.affiliations handle (affiliations.pendingInvitation is users.invitedVendor's
  # unanswered invitation to organizations.withPendingInvitation, owned by
  # users.organizationOwner; affiliations.qualifiedMember is an active membership), or the
  # membership_identifier of an invitation a test made through
  # affiliation-invitation-request. The request is made as whoever is signed in.
  - id: affiliation-approval-request
    domain: organizations
    route: /api/affiliations/:affiliationId
    title: "Accept a membership, by request"
    actions:
      accept_membership_by_request: { test_id: affiliation-approval-request-accept }
    observations:
      request_accepted: { test_id: affiliation-approval-request-accepted }
      # The membership's status as the service answers an accepted request (ACTIVE).
      membership_status: { test_id: affiliation-approval-request-membership-status }
      # The refusal's messages, in the order the service gives them. Empty when the
      # request was accepted.
      refusal_messages: { test_id: affiliation-approval-request-refusal-messages }
      refusal_status: { test_id: affiliation-approval-request-refusal-status }

  # The list of everyone registered with the service, as the service answers the request
  # for it, whatever the screen shows.
  - id: user-list-request
    domain: users
    route: /api/users
    title: "Everyone registered with the service"
    actions: {}
    observations:
      accounts_answered: { test_id: user-list-request-accounts }
      refused_when_not_permitted: { test_id: user-list-request-refused }
      refusal_status: { test_id: user-list-request-refusal-status }

  # Requests to read, create, change, rename or remove a page, as the service answers
  # them. :slug is the page's address; reading the list and creating a page address the
  # collection rather than one page and ignore it.
  #
  # A request is sent from the signed-in person's session without moving the browser, so
  # whatever screen is open stays open, holding what it read. That is how a page changed
  # "by another administrator since it was opened" is reached: open content-edit, start
  # editing, change the same page here, then publish from the screen, which still holds
  # the wording it read before. On the oracle the change made here comes from the same
  # administrator account as the screen (administrator-other has no sign-in there); the
  # service carries no record of the version a change was based on, so which account
  # sent it does not decide whether the stale publish is accepted.
  - id: content-request
    domain: content
    route: /api/content/:slug
    title: "Requests about a page"
    actions:
      read_page_list_by_request: { test_id: content-request-read-list }
      read_page_by_request: { test_id: content-request-read-page }
      create_page_by_request: { test_id: content-request-create }
      change_page_by_request: { test_id: content-request-change }
      rename_page_by_request: { test_id: content-request-rename }
      remove_page_by_request: { test_id: content-request-remove }
    observations:
      request_accepted: { test_id: content-request-accepted }
      refusal_status: { test_id: content-request-refusal-status }
      # The form of the refused answer — which fields it carries and how the reason is
      # named — so that two refusals can be compared (observables.yaml, refusals.shape).
      refusal_shape: { test_id: content-request-refusal-shape }

  # One panel member's individual evaluation of one proponent, as a request. :userId is
  # the panel member, as on evaluation-individual-edit-swu.
  #
  # Starting an evaluation addresses the proponent's collection of evaluations rather than
  # one panel member's, so create_evaluation_by_request ignores :userId: the service takes
  # the evaluator from the session. It sends what the create screen sends — the proponent,
  # the status DRAFT and the four scores and notes. The starting point for a second attempt
  # is seed.opportunities.swuEvaluationAlreadyBegun (twuEvaluationAlreadyBegun), where
  # users.staffOne already holds a draft of the first proponent; stored_scores read with
  # :userId users.staffOne then still answers that draft's 3, 3, 3, 3, which is how a test
  # sees that nothing else was written.
  - id: evaluation-individual-request-swu
    domain: evaluation
    route: /api/proposal/sprint-with-us/:proposalId/team-questions/evaluations/:userId
    title: "A Sprint With Us individual evaluation, by request"
    actions:
      # Input: the four scores and notes exactly as given, including a score above the
      # question's maximum or an empty note, which the form refuses as it is typed.
      save_draft_as_entered: { test_id: evaluation-individual-request-save-draft }
      # Asks for this one evaluation to be submitted by itself, rather than the whole set.
      submit_this_evaluation_alone: { test_id: evaluation-individual-request-submit-alone }
      # Input: the four scores and notes. Starts the signed-in evaluator's evaluation of
      # the proponent.
      create_evaluation_by_request: { test_id: evaluation-individual-request-create }
    observations:
      stored_scores: { test_id: evaluation-individual-request-stored-scores }
      stored_notes: { test_id: evaluation-individual-request-stored-notes }
      evaluation_status: { test_id: evaluation-individual-request-status }
      refused_as_unrecognised: { test_id: evaluation-individual-request-refused-unrecognised }
      refused_at_submission: { test_id: evaluation-individual-request-refused-at-submission }
      # Whether the service accepted create_evaluation_by_request (the evaluation it
      # answers with), as distinct from refusing it.
      evaluation_created: { test_id: evaluation-individual-request-created }
      # The message the service answers a refused create_evaluation_by_request with, as
      # text, absent when the start was accepted. On the oracle an evaluator who already
      # holds an evaluation of the proponent is answered "You already have a team question
      # evaluation for this proposal." (Team With Us: "resource question" in place of
      # "team question"); spec/contract/openapi.yaml gives the answer's form.
      creation_refusal_message: { test_id: evaluation-individual-request-creation-refusal-message }

  - id: evaluation-individual-request-twu
    domain: evaluation
    route: /api/proposal/team-with-us/:proposalId/resource-questions/evaluations/:userId
    title: "A Team With Us individual evaluation, by request"
    actions:
      save_draft_as_entered: { test_id: evaluation-individual-request-save-draft }
      submit_this_evaluation_alone: { test_id: evaluation-individual-request-submit-alone }
      create_evaluation_by_request: { test_id: evaluation-individual-request-create }
    observations:
      stored_scores: { test_id: evaluation-individual-request-stored-scores }
      stored_notes: { test_id: evaluation-individual-request-stored-notes }
      evaluation_status: { test_id: evaluation-individual-request-status }
      refused_as_unrecognised: { test_id: evaluation-individual-request-refused-unrecognised }
      refused_at_submission: { test_id: evaluation-individual-request-refused-at-submission }
      evaluation_created: { test_id: evaluation-individual-request-created }
      creation_refusal_message: { test_id: evaluation-individual-request-creation-refusal-message }

  # One consensus — the chair's agreed scores and notes for one proponent — as a request.
  # :userId is the panel member whose consensus it is, which is the chair: on the seeded
  # panels users.administratorOne. The screens show the panel members' own scores beside
  # the form but not the consensus as it stands, so this is where a test reads what a
  # consensus holds, and where it sends a change that no screen offers the person making
  # it (an evaluator who is not the chair changing the chair's consensus, or anybody
  # changing one after the opportunity has moved past consensus).
  #
  # The service lets an administrator read a consensus at any stage, and a public sector
  # employee on the panel read it during consensus or once the question stages are past, so
  # a test reads the result as the administrator. The starting points are
  # seed.opportunities.swuConsensusAllAgreed and swuPastConsensus, whose proposals'
  # agreed_scores the manifest gives.
  - id: evaluation-consensus-request-swu
    domain: evaluation
    route: /api/proposal/sprint-with-us/:proposalId/team-questions/consensus/:userId
    title: "A Sprint With Us consensus, by request"
    actions:
      # Input: an agreed score and note for each of the four questions, by question order.
      # Replaces what the consensus holds, as the edit screen's save does.
      change_consensus_by_request: { test_id: evaluation-consensus-request-change }
    observations:
      # The agreed score for each question, by question order, as stored.
      stored_scores: { test_id: evaluation-consensus-request-stored-scores }
      # The note for each question, by question order, as stored.
      stored_notes: { test_id: evaluation-consensus-request-stored-notes }
      consensus_status: { test_id: evaluation-consensus-request-status }
      # The service accepted the change (a successful answer carrying the consensus).
      request_accepted: { test_id: evaluation-consensus-request-accepted }
      # The service refused the change or the read (an answer naming a permission or
      # not-found error), as distinct from one it accepted.
      refused_when_not_permitted: { test_id: evaluation-consensus-request-refused }

  - id: evaluation-consensus-request-twu
    domain: evaluation
    route: /api/proposal/team-with-us/:proposalId/resource-questions/consensus/:userId
    title: "A Team With Us consensus, by request"
    actions:
      change_consensus_by_request: { test_id: evaluation-consensus-request-change }
    observations:
      stored_scores: { test_id: evaluation-consensus-request-stored-scores }
      stored_notes: { test_id: evaluation-consensus-request-stored-notes }
      consensus_status: { test_id: evaluation-consensus-request-status }
      request_accepted: { test_id: evaluation-consensus-request-accepted }
      refused_when_not_permitted: { test_id: evaluation-consensus-request-refused }

  # An opportunity's evaluation panel submitted as a request, so that it can hold a
  # panel none of the panel screen's controls can compose: a member who is neither an
  # evaluator nor the chair, or no chair at all. :program is sprint-with-us or
  # team-with-us, and :opportunityId an opportunity whose panel may still be changed — one
  # the test has just created (opportunity_identifier on the page it lands on) or a seeded
  # one still before its deadline.
  - id: evaluation-panel-request
    domain: evaluation
    route: /api/opportunities/:program/:opportunityId
    title: "An evaluation panel, by request"
    actions:
      submit_panel_with_member_holding_no_role: { test_id: evaluation-panel-request-member-no-role }
      # Input: two public sector members (seed users handles), both evaluators and
      # neither marked as chair. The browser form will not send this panel; the request
      # carries it to the service as given.
      submit_panel_with_no_chair: { test_id: evaluation-panel-request-no-chair }
    observations:
      member_without_role_error: { test_id: evaluation-panel-request-member-without-role-error }
      # The service's refusal of a panel that names no chair, read from its answer. Absent
      # when the service accepts the panel, which panel_as_stored then shows.
      missing_chair_error: { test_id: evaluation-panel-request-missing-chair-error }
      panel_as_stored: { test_id: evaluation-panel-request-panel-as-stored }

  # A stored file named as an attachment by its identifier, on something the signed-in
  # person may edit. :recordKind is opportunities or proposals, :program one of
  # code-with-us, sprint-with-us and team-with-us, and :recordId the opportunity or
  # proposal. The identifier comes from file-upload.stored_file_identifier, from
  # file-attachment-control.attachment_address, or from seed.stored_files.
  - id: file-attach-by-identifier
    domain: files
    route: /api/:recordKind/:program/:recordId
    title: "Attach a stored file by its identifier"
    actions:
      # Input: the stored file's identifier. Saves the record as it stands with that file
      # added to its attachments.
      attach_stored_file: { test_id: file-attach-request }
    observations:
      attachment_accepted: { test_id: file-attach-accepted }
      attachment_refused: { test_id: file-attach-refused }
      attached_file_identifiers: { test_id: file-attach-identifiers }

  # A Code With Us proposal made and submitted in one request, as the signed-in vendor,
  # with its proponent given exactly as stated. The screen's organization choice lists only
  # the vendor's own organizations; this carries any organization identifier to the
  # service, including seed.unassigned_identifiers.organizationNeverCreated (which names no
  # organization) and an organization the vendor has no membership of (for persona.vendor,
  # seed.organizations.qualified). The opportunity is seed.opportunities.publishedCodeWithUs
  # or one the test publishes (opportunity_identifier on the page it lands on).
  #
  # The service refuses a second proposal by the same person on the same opportunity
  # ("You already have a proposal for this opportunity."), and an accepted request leaves a
  # proposal behind, so each accepted request in a test needs its own opportunity or its
  # own vendor. A refused request leaves nothing behind.
  #
  # The old service reads an organization proponent before validating anything else, and
  # when the identifier names no organization it puts a blank individual proponent in its
  # place; the refusal then comes back against the individual's fields rather than against
  # "organization". refusal_by_field reports each message where the service puts it.
  - id: proposal-cwu-request
    domain: proposals
    route: /api/proposals/code-with-us
    title: "A Code With Us proposal, by request"
    actions:
      # Input: the opportunity identifier, the organization identifier, proposal text and
      # additional comments. Sent as a submission, not a draft.
      submit_with_organization_proponent: { test_id: proposal-cwu-request-submit-organization }
      # Input: the opportunity identifier, proposal text, additional comments, and the
      # individual's legal name, email address, phone, street address, second address
      # line, city, province, postal code and country, each exactly as given — blank or
      # malformed included. Sent as a submission, not a draft.
      submit_with_individual_proponent: { test_id: proposal-cwu-request-submit-individual }
    observations:
      # The service accepted the proposal (a successful answer carrying it).
      request_accepted: { test_id: proposal-cwu-request-accepted }
      # The accepted proposal's identifier, for proposal-cwu-edit and proposal-cwu-view.
      proposal_identifier: { test_id: proposal-cwu-request-proposal-id }
      proposal_status: { test_id: proposal-cwu-request-status }
      # Every message in a refusal, each with the field it is reported against — the
      # proponent's own fields by name (legal name, email address, phone, street address,
      # city, province, postal code, country), "organization" for an organization
      # proponent, and the proposal's own fields. Empty when the request was accepted.
      refusal_by_field: { test_id: proposal-cwu-request-refusal-by-field }
      # The refusal's messages alone, in the order the service gives them.
      refusal_messages: { test_id: proposal-cwu-request-refusal-messages }
      refusal_status: { test_id: proposal-cwu-request-refusal-status }

  # A Sprint With Us or Team With Us proposal made and submitted in one request, as the
  # signed-in vendor, with its team given by account. :program is sprint-with-us or
  # team-with-us. The proposal screens offer only the chosen organization's active members
  # and do not offer a person twice; this carries any seed.users handle to the service,
  # including users.teamCandidatePending (an unanswered invitation to
  # organizations.qualified), users.teamCandidateFormer (a membership of it that has
  # ended), users.teamCandidateOutsider (a member of no organization), and one person named
  # twice.
  #
  # The opportunity is one the test publishes (opportunity_identifier on the page it lands
  # on), since both programs' seeded opportunities have closed. The organization is a
  # seed.organizations handle; organizations.qualified is qualified for both programs and
  # users.organizationOwner and users.organizationAdmin may submit for it. As on
  # proposal-cwu-request, one person has one proposal per opportunity and an accepted
  # request leaves it behind.
  #
  # A request can fail after validation as well as at it: the old service stores a Sprint
  # With Us phase's team keyed by person, so a phase naming one person twice passes
  # validation and is then answered with the service's storage error. refusal_status tells
  # a validation refusal (400) from a failure to store (503), and refusal_messages carries
  # whichever message came back.
  - id: proposal-team-request
    domain: proposals
    route: /api/proposals/:program
    title: "A team proposal, by request"
    actions:
      # Input for team-with-us: the opportunity identifier, the organization, the team as a
      # list of { member: a seed.users handle, resource: the resource's service area as the
      # opportunity lists it, hourly rate }, and an answer to each resource question by
      # order. The request finds each resource's identifier by reading the opportunity as
      # the service answers it.
      #
      # Input for sprint-with-us: the opportunity identifier, the organization, and for
      # each phase given — Inception, Prototype or Implementation — a list of { member: a
      # seed.users handle, scrum master: yes or no } and a proposed cost; an answer to each
      # team question by order; and any references. Members are sent in the order given,
      # repeats included. The phases sent are exactly the ones given, whatever the
      # opportunity has: a phase the opportunity lacks is sent as a team like any other,
      # and a phase left out is sent as absent. The service refuses the first against
      # that phase with "This opportunity does not require this phase." and the second
      # with "This opportunity requires this phase."
      #
      # The organization may be left out, and the request then names none. The Sprint With
      # Us service answers a submission naming no organization with "An organization must
      # be specified before submitting." against organization, before it looks at the
      # team. The screens always send one.
      #
      # Either way, sent as a submission, not a draft.
      submit_team_proposal: { test_id: proposal-team-request-submit }
    observations:
      request_accepted: { test_id: proposal-team-request-accepted }
      proposal_identifier: { test_id: proposal-team-request-proposal-id }
      proposal_status: { test_id: proposal-team-request-status }
      # Every message in a refusal, each with where it is reported: the team (for
      # team-with-us, by position in the team list, or the team as a whole), the phase and
      # position (for sprint-with-us), the organization, one answer to an opportunity
      # question, or the proposal's other fields. Empty when the request was accepted.
      #
      # For sprint-with-us a message about a phase names the phase (Inception, Prototype,
      # Implementation) and which part of it: the phase itself (required or not
      # required), its members ("Please select at least one team member.", "You may only
      # specify a single scrum master."), or its proposed cost ("Please enter a Proposed
      # Cost less than or equal to N."). A total proposed cost over the opportunity's total
      # maximum budget is reported against the total cost. Capabilities are not reported
      # by phase: the service compares every capability the members of all phases hold
      # with every capability any phase requires, and reports a shortfall against the team
      # as a whole. proposal-swu-create's phase_requirements checks each phase on its own.
      #
      # An answer is located by the question order it was sent against, and by whether the
      # message concerns its wording or its numbering. The service checks each answer on
      # its own: an answer numbered against a question the opportunity does not ask is
      # refused against its numbering with "No matching opportunity question.", and one
      # that is empty or longer than its question's word limit is refused against its
      # wording with "Response must be between 1 and N words long.", N being that
      # question's limit.
      refusal_by_field: { test_id: proposal-team-request-refusal-by-field }
      # The refusal's messages alone, in the order the service gives them — where "User is
      # not an active member of the organization." or "Please select unique team members."
      # is read.
      refusal_messages: { test_id: proposal-team-request-refusal-messages }
      refusal_status: { test_id: proposal-team-request-refusal-status }

  # A stage score for one Sprint With Us or Team With Us proposal, sent to the service as a
  # request rather than through proposal-swu-view or proposal-twu-view, which offer a stage's
  # score only once the opportunity has reached that stage. :program is sprint-with-us or
  # team-with-us; :proposalId a seed.proposals handle. Made as whoever is signed in; the
  # administrator may score any stage the opportunity stands at.
  #
  # The service checks the proposal before the opportunity. A proposal that has not been
  # carried into the stage the score belongs to is refused with the service's general
  # permission message; only one that has, on an opportunity that stands at a different
  # stage, is refused with "The opportunity is not in the correct stage of evaluation to
  # perform that action." Carrying a proposal into the team scenario happens while the
  # opportunity is still at the code challenge, so that state arises in the ordinary course
  # of evaluation. Starting point for R-2.28:
  # seed.proposals.swuScreenedIntoScenarioEarly, screened into the team scenario on
  # seed.opportunities.swuCodeChallengeWithScenarioScreenedIn, which is still at the code
  # challenge; and, for score_challenge_by_request, seed.proposals.twuScreenedIntoChallengeEarly,
  # carried into the challenge on seed.opportunities.twuConsensusWithChallengeScreenedIn,
  # which is still at the questions consensus (seed.proposals.twuStillAtQuestions on the same
  # opportunity draws the general permission message instead).
  - id: proposal-evaluation-request
    domain: proposals
    route: /api/proposals/:program/:proposalId
    title: "A stage score, by request"
    actions:
      # Input: a score out of 100. Sprint With Us only.
      score_team_scenario_by_request: { test_id: proposal-evaluation-request-score-team-scenario }
      # Input: a score out of 100. Sprint With Us only.
      score_code_challenge_by_request: { test_id: proposal-evaluation-request-score-code-challenge }
      # Input: a score out of 100. Team With Us only.
      score_challenge_by_request: { test_id: proposal-evaluation-request-score-challenge }
    observations:
      # The service accepted the score (a successful answer carrying the proposal).
      request_accepted: { test_id: proposal-evaluation-request-accepted }
      # The proposal's status as the service answers an accepted request.
      proposal_status: { test_id: proposal-evaluation-request-status }
      # The refusal's messages, in the order the service gives them. Empty when the
      # request was accepted.
      refusal_messages: { test_id: proposal-evaluation-request-refusal-messages }
      refusal_status: { test_id: proposal-evaluation-request-refusal-status }

  # The signed-in person's own account record, as the service holds it. The profile screens
  # show whether new-opportunity notices are on, not when they were turned on; the account
  # record carries the moment, and this is where it is read. A test acting as itself needs
  # no identifier.
  - id: user-account-self-request
    domain: users
    route: /api/sessions/current
    title: "One's own account record, by request"
    actions: {}
    observations:
      user_identifier: { test_id: user-account-self-id }
      # The date and time new-opportunity notices were turned on, as an ISO 8601 instant,
      # or empty when they are off. Turning them off clears it rather than recording when.
      # When nobody is signed in the service answers with no account at all, and
      # user_identifier is empty too.
      new_opportunity_notices_since: { test_id: user-account-self-notices-since }

  # Somebody's account record by identifier, as the service answers it. :userId is a
  # seed.users handle or a user_identifier read elsewhere. The service answers the person
  # themselves and an administrator, and refuses anybody else.
  - id: user-account-request
    domain: users
    route: /api/users/:userId
    title: "An account record, by request"
    actions: {}
    observations:
      new_opportunity_notices_since: { test_id: user-account-notices-since }
      refused_when_not_permitted: { test_id: user-account-refused }
      refusal_status: { test_id: user-account-refusal-status }

  # How many times an opportunity has been opened, as the service counts it. :program is
  # code-with-us, sprint-with-us or team-with-us; :opportunityId a seed.opportunities
  # handle or an opportunity_identifier read where the opportunity landed. The counter's
  # name is opportunity.<program>.<opportunityId>.views (observables.counters).
  #
  # The service answers this only to an administrator or public sector staff; a vendor or
  # a request with no session is refused as not permitted. A test that checks views reads
  # the count as persona.administrator, opens the opportunity's public page as whoever the
  # criterion names (signed out included), and reads the count again as the administrator.
  #
  # The public page asks for its own view to be counted as it loads and does not wait for
  # the answer, so the count may change a moment after the page appears. A test reads it
  # again every 500 milliseconds until it differs from the earlier reading or five seconds
  # pass, then compares. Every test that opens the same opportunity's public page moves
  # the same counter, so a test that checks an exact increase either runs alone against
  # that opportunity or uses one it has just published itself.
  - id: opportunity-counters
    domain: opportunities
    route: /api/counters?counters=opportunity.:program.:opportunityId.views
    title: "An opportunity's view count, by request"
    actions: {}
    observations:
      # The count as a whole number. An opportunity never opened has no counter yet, and
      # the service leaves it out of its answer; that reads as 0.
      view_count: { test_id: opportunity-counters-view-count }
      refused_when_not_permitted: { test_id: opportunity-counters-refused }

  # An opportunity's history as the service answers a request to read the opportunity, as
  # whoever is signed in (or nobody). :program is code-with-us or sprint-with-us;
  # :opportunityId a seed.opportunities handle or an opportunity_identifier read where the
  # opportunity landed. opportunity-cwu-edit and opportunity-swu-edit show the history on
  # their History tab but offer no way to add a note, so a note is reached here or through
  # the seed.
  #
  # The service means to include the history only for an administrator or the
  # opportunity's author; a signed-in reader who is neither is answered with the
  # opportunity and no history at all. The old service also answers the history, notes and
  # attachments included, to a request with no session: it strips the author from the
  # record for such a reader before comparing the author with the (absent) signed-in
  # person, and the two empty values compare equal (src/back-end/lib/db/opportunity/
  # code-with-us.ts, processForRole and readOneCWUOpportunity). That was read off the
  # running oracle, so a signed-out reading of this page is where R-1.33 separates the old
  # target from the criterion.
  #
  # Starting point for R-1.33: seed.opportunities.cwuWithPrivateNote, published, whose
  # history already holds a note by its author with
  # seed.stored_files.opportunityNoteAttachment attached. Read it as persona.administrator
  # and as the author (persona.staff under session-route) for the note; as a vendor and
  # signed out for its absence.
  - id: opportunity-history-request
    domain: opportunities
    route: /api/opportunities/:program/:opportunityId
    title: "An opportunity's history, by request"
    actions:
      # Input: the note's text and a list of stored file identifiers to attach (from
      # file-upload.stored_file_identifier or seed.stored_files). Sends the service's
      # update operation asking to add a note, as the signed-in person. Accepted from an
      # administrator or the opportunity's author in any status; the text may be up to
      # 1,000 characters.
      add_note_by_request: { test_id: opportunity-history-request-add-note }
    observations:
      # Whether the answer carries a history at all. False for a reader the service does
      # not show it to; the answer is otherwise the opportunity as usual.
      history_shown: { test_id: opportunity-history-request-history-shown }
      # The history, newest first, one entry per row: its kind (a status, or an event —
      # NOTE_ADDED for a note), its text, who made it (by name) and when, and the names
      # and identifiers of the files attached to it. Empty when history_shown is false.
      history_entries: { test_id: opportunity-history-request-entries }
      # Whether the service accepted add_note_by_request, and the refusal when it did not.
      request_accepted: { test_id: opportunity-history-request-accepted }
      refusal_messages: { test_id: opportunity-history-request-refusal-messages }
      refusal_status: { test_id: opportunity-history-request-refusal-status }

  # A request to move an opportunity to a named status, sent to the service's update
  # operation as whoever is signed in, so that a change no screen offers — out of an
  # awarded or cancelled opportunity, or from a draft straight to an evaluation stage — can
  # be asked for. :program is code-with-us, sprint-with-us or team-with-us; :opportunityId
  # a seed.opportunities handle or an opportunity_identifier read where the opportunity
  # landed.
  #
  # The service has no "set status" operation: each change is its own named operation,
  # and the request sends the one that leads to the status asked for —
  #   UNDER_REVIEW: submit for review (every program)
  #   PUBLISHED: publish (every program)
  #   CANCELED: cancel (every program)
  #   EVAL_CC: start the code challenge (sprint-with-us)
  #   EVAL_SCENARIO: start the team scenario (sprint-with-us)
  #   EVAL_C: start the challenge (team-with-us)
  # Each operation checks the change against the program's permitted path and refuses one
  # off it with the service's general permission message. Code With Us offers no
  # operation that leads to an evaluation stage at all (its opportunity moves to
  # EVALUATION only when its deadline passes), so "draft straight to an evaluation stage"
  # is asked of Sprint With Us or Team With Us.
  #
  # Starting points for R-1.20: seed.opportunities.cwuAwarded and
  # seed.opportunities.swuAwarded asked to go back to PUBLISHED; seed.opportunities
  # .cwuCancelled asked to go to PUBLISHED; a draft the test creates
  # (opportunity-swu-create or opportunity-twu-create, then opportunity_identifier) asked
  # to go to EVAL_CC or EVAL_C. Made as persona.administrator, who may make every change on
  # the permitted path, so that a refusal is about the path and not about who asked.
  - id: opportunity-status-request
    domain: opportunities
    route: /api/opportunities/:program/:opportunityId
    title: "An opportunity status change, by request"
    actions:
      # Input: { status } — one of the statuses above.
      request_status_change: { test_id: opportunity-status-request-change }
    observations:
      # Whether the service accepted the request (a successful answer carrying the
      # opportunity).
      request_accepted: { test_id: opportunity-status-request-accepted }
      # The status code of a refused request; empty when accepted.
      refusal_status: { test_id: opportunity-status-request-refusal-status }
      # The refusal's messages, in the order the service gives them. Empty when accepted.
      refusal_messages: { test_id: opportunity-status-request-refusal-messages }
      # The opportunity's status as the service holds it, read afresh after the request
      # (as the signed-in person) rather than taken from the request's answer.
      stored_status: { test_id: opportunity-status-request-stored-status }
