# Pages, and the actions and observations each offers. Test IDs are filled at the design gate.
pages:
  - id: opportunity-list
    domain: opportunities
    route: /opportunities
    title: "Opportunities"
    actions:
      filter_by_program: { test_id: null }
      filter_by_status: { test_id: null }
      filter_remote_only: { test_id: null }
      search: { test_id: null }
      toggle_watch: { test_id: null }
    observations:
      unpublished_group: { test_id: null }
      open_group: { test_id: null }
      closed_group: { test_id: null }
      opportunity_status: { test_id: null }
      proposal_deadline: { test_id: null }

  - id: opportunity-program-select
    domain: opportunities
    route: /opportunities/create
    title: "Create an opportunity"
    actions:
      choose_code_with_us: { test_id: null }
      choose_sprint_with_us: { test_id: null }
      choose_team_with_us: { test_id: null }
    observations:
      program_card: { test_id: null }
      max_budget: { test_id: null }

  - id: opportunity-cwu-create
    domain: opportunities
    route: /opportunities/code-with-us/create
    title: "Create a Code With Us opportunity"
    actions:
      save_draft: { test_id: null }
      submit_for_review: { test_id: null }
      publish: { test_id: null }
      add_attachment: { test_id: null }
    observations:
      field_error: { test_id: null }

  - id: opportunity-cwu-view
    domain: opportunities
    route: /opportunities/code-with-us/:opportunityId
    title: "Code With Us opportunity"
    actions:
      toggle_watch: { test_id: null }
      start_proposal: { test_id: null }
    observations:
      status: { test_id: null }
      proposal_deadline: { test_id: null }
      reward: { test_id: null }
      addenda: { test_id: null }
      successful_proponent: { test_id: null }

  - id: opportunity-cwu-edit
