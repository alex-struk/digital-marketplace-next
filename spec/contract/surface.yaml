  # Files. This domain has no screen of its own — a stored file is reached by its own
  # address, and everything a person does to a file they do through a control that
  # sits on a page another domain owns. The first three entries below are those
  # addresses: storing a file, reading its bytes and reading its description. The three
  # after them are the shared controls, listed once each rather than repeated on every
  # host page, with the routes they appear on named in the entry.
  #
  # The addresses are here rather than left to the controls because a great many of this
  # domain's criteria are about what the service does with a submission the controls
  # never make — one that overstates or withholds its size, carries no file, or names a
  # kind of read access the service does not know — and about what it stores, which is
  # readable only as a description and never on a screen.
  - id: file-upload
    domain: files
    route: /api/files
    title: "Storing a file"
    actions:
      upload_file: { test_id: file-upload-request }
      upload_file_stating_its_read_access: { test_id: file-upload-request }
      upload_file_without_declaring_its_size: { test_id: file-upload-request }
      upload_file_with_no_file_part: { test_id: file-upload-request }
      upload_file_with_unrecognised_read_access: { test_id: file-upload-request }
      upload_file_with_malformed_read_access: { test_id: file-upload-request }
    observations:
      stored_file_identifier: { test_id: file-upload-stored-id }
      refused_for_size: { test_id: file-upload-refused-size }
      size_limit_named_in_refusal: { test_id: file-upload-size-limit }
      refused_for_file_name_length: { test_id: file-upload-refused-name }
      refused_for_read_access: { test_id: file-upload-refused-read-access }
      refused_when_signed_out: { test_id: file-upload-refused-signed-out }
      service_fault: { test_id: file-upload-service-fault }

  # The same address as file-download without the request for its content. The service
  # answers with a description of the stored file under the same permission rules as the
  # bytes. stored_content_identifier is what two uploads of identical content share and
  # what tells storing once from storing twice.
  - id: file-description
    domain: files
    route: /api/files/:fileId
    title: "A stored file's description"
    actions: {}
    observations:
      file_identifier: { test_id: file-description-id }
      file_name: { test_id: file-description-name }
      stored_date: { test_id: file-description-stored-date }
      stored_content_identifier: { test_id: file-description-content-id }
      refused_when_not_permitted: { test_id: file-refused }
      refused_for_unknown_file: { test_id: file-refused }
      not_found_for_administrator: { test_id: file-not-found }

  - id: file-download
    domain: files
    route: /api/files/:fileId?type=blob
    title: "A stored file"
    actions:
      download_file: { test_id: file-download-request }
    observations:
      file_contents: { test_id: file-download-body }
      file_name_on_save: { test_id: file-download-filename }
      offered_as_download_not_displayed: { test_id: file-download-disposition }
      content_type_from_name: { test_id: file-download-content-type }
      readable_when_signed_out_if_public: { test_id: file-download-response }
      refused_when_not_permitted: { test_id: file-refused }
      refused_for_unknown_file: { test_id: file-refused }
      not_found_for_administrator: { test_id: file-not-found }

  # The attachment control, shared by the three opportunity forms and the Code With
  # Us proposal form. Appears at /opportunities/code-with-us/create and .../edit and
  # the Sprint With Us and Team With Us equivalents, and at
  # /opportunities/code-with-us/:opportunityId/proposals/create and .../edit.
  #
  # The route names the one place a test can always reach the control after the fact:
  # attachments are a step inside the opportunity form rather than a tab of their own, so
  # the address is the opportunity tab of an opportunity's management screen and the
  # control is a step within it.
  #
  # :program names which of those forms the control sits on and is one of code-with-us,
  # sprint-with-us and team-with-us. It is not an identifier and nothing needs to look
  # it up. attachment_address returns the address the application stores an attachment
  # at, which is how a test reaches file-download for a file it has just uploaded.
  - id: file-attachment-control
    domain: files
    route: /opportunities/:program/:opportunityId/edit?tab=opportunity
    title: "Attachments"
    actions:
      add_attachment: { test_id: attachment-add-button }
      rename_new_attachment: { test_id: attachment-name-field }
      remove_new_attachment: { test_id: attachment-remove-button }
      remove_existing_attachment: { test_id: attachment-remove-button }
      download_attachment: { test_id: attachment-download-link }
    observations:
      attachment_address: { test_id: attachment-download-link }
      size_limit_stated_before_choosing: { test_id: attachment-size-limit }
      upload_refused_for_size: { test_id: attachment-size-error }
      new_attachment_row: { test_id: attachment-new-row }
      existing_attachment_row: { test_id: attachment-existing-row }
      existing_attachment_name_read_only: { test_id: attachment-existing-name }
      original_extension_restored: { test_id: attachment-resulting-name }
      file_name_error: { test_id: attachment-name-field }
      remove_control_hidden_when_not_removable: { test_id: attachment-remove-button }
      attachment_list_on_public_view: { test_id: attachment-list }

