      size_limit_stated_before_choosing: { test_id: null }
      upload_refused_for_size: { test_id: null }
      new_attachment_row: { test_id: null }
      existing_attachment_row: { test_id: null }
      existing_attachment_name_read_only: { test_id: null }
      original_extension_restored: { test_id: null }
      file_name_error: { test_id: null }
