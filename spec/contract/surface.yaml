  - id: proposal-swu-view
    domain: proposals
    route: /opportunities/sprint-with-us/:opportunityId/proposals/:proposalId
    title: "Sprint With Us proposal"
    actions:
      score_code_challenge: { test_id: proposal-score-code-challenge }
      screen_in_to_team_scenario: { test_id: proposal-screen-in }
      screen_out_from_team_scenario: { test_id: proposal-screen-out }
      score_team_scenario: { test_id: proposal-score-team-scenario }
      award_proposal: { test_id: proposal-award-button }
      disqualify_proposal: { test_id: proposal-disqualify-button }
    observations:
      proposal_identifier: { test_id: proposal-identifier }
      proposal_tab: { test_id: proposal-tab-proposal }
      team_questions_tab: { test_id: proposal-tab-team-questions }
      code_challenge_tab: { test_id: proposal-tab-code-challenge }
      team_scenario_tab: { test_id: proposal-tab-team-scenario }
      history_tab: { test_id: proposal-tab-history }
      # The proposal's history, one entry per row of the history tab, newest first. Each
      # entry is the entry's kind (a status the proposal entered, or an event such as team
      # question scores being entered), its note as text, who made it and when. Finalising
      # the question consensus writes one entry per proponent whose note gives the agreed
      # score of each question in order — on the oracle "Team question scores were
      # entered. Q1: 5; Q2: 5; Q3: 5; Q4: 5." — for every proponent, including one below
      # a minimum that is not screened in. That entry and the status a screened-in
      # proponent enters carry the same moment, so their order relative to each other is
      # not fixed; find the entry by its kind. The service shows history to an
      # administrator and to the opportunity's owner; the seeded evaluation opportunities
      # belong to users.staffOne. Starting point for R-5.32:
      # seed.opportunities.swuConsensusSixProponentsForHistory.
      history_entries: { test_id: null }
      wrong_stage_error: { test_id: proposal-wrong-stage-error }
      questions_score: { test_id: proposal-questions-score }
      challenge_score: { test_id: proposal-challenge-score }
      scenario_score: { test_id: proposal-scenario-score }
      price_score: { test_id: proposal-price-score }
      total_score: { test_id: proposal-total-score }
      # The proposal's place among the opportunity's fully evaluated proposals, highest total
      # first ("1st", "2nd"), or empty when it holds none. Only a proposal with every stage
      # score holds one — on Sprint With Us one scored on the team scenario, awarded or not
      # awarded — so beside a ranked proposal, one still waiting for a stage score, or left
      # behind at an earlier stage, reads empty. Shown on the proposal tab to the
      # administrator and to the opportunity's owner once the opportunity has reached the
      # code challenge, while it is still being evaluated. Starting point for R-2.31:
      # seed.opportunities.swuTeamScenarioLastToScoreB, where swuScenarioBLowerBid is ranked,
      # swuScenarioBHigherBid is not until its scenario score is entered, and the third
      # proposal was left behind at the questions.
      rank: { test_id: null }
      # The score actions the page offers the signed-in person for this proposal, as a list
      # of this page's own action names — score_code_challenge, score_team_scenario — read
      # across the stage tabs; empty when it offers none. A stage's score is offered on its
      # tab (entering or editing it) only once the opportunity has reached that stage and
      # the proposal is in it; before then the tab says the proposal "can be scored once" the
      # opportunity has reached the stage, and offers no score. A proposal carried past a
      # stage is no longer offered that stage's score. On
      # seed.opportunities.swuCodeChallengeWithScenarioScreenedIn, as the administrator,
      # seed.proposals.swuScreenedIntoScenarioEarly offers none (it is in the team scenario,
      # which the opportunity has not reached) and seed.proposals.swuScreenedIntoCodeChallenge
      # offers score_code_challenge.
      offered_score_actions: { test_id: null }

