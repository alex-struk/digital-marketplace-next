  # Not a screen, and here because a test can reach nothing else that does this. The
  # application has no scheduler: a published opportunity whose proposal deadline has
  # passed is moved on by a hook that runs in front of this address and in front of the
  # resource routes under /api, and nowhere else. Requesting it is how a test brings a
  # closure about deliberately instead of waiting for a clock, and the oracle sets the
  # hook's throttle to zero so one request is enough. Without an entry here the criteria
  # that begin "when the proposal deadline passes" have no "when" a test can perform.
  - id: scheduled-transition-trigger
    domain: opportunities
    route: /status
    title: "Service status"
    actions:
      run_pending_transitions: { test_id: service-status-page }
    observations:
      service_is_up: { test_id: service-status-message }

