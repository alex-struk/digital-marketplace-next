      chosen_image_preview: { test_id: profile-image-preview }
      only_jpeg_and_png_offered: { test_id: image-file-rule }
      rejected_image_error: { test_id: image-rejected-error }
      image_readable_when_signed_out: { test_id: profile-image }
      # The size the image was stored at, read back from the stored image itself. Two
      # criteria turn on a large picture being narrowed or shortened to 500 pixels while
      # keeping its proportions, and on an unreadable one being kept at its own size.
      stored_image_width: { test_id: profile-image }
      stored_image_height: { test_id: profile-image }

  # The image control inside the formatted-text editor, shared by every page that
  # embeds one — /content/create, /content/:slug/edit, the three opportunity forms
  # and the addendum control.
  - id: file-embedded-image
    domain: files
    route: /content/:slug/edit
    title: "Image in formatted text"
    actions:
      upload_body_image: { test_id: content-body-image-button }
    observations:
      image_address: { test_id: content-body-image }
      image_inserted_into_text: { test_id: content-body-field }
      only_jpeg_and_png_offered: { test_id: image-file-rule }
      uploading_indicator: { test_id: embedded-image-uploading }
      image_rendered_in_published_text: { test_id: content-body-image }
      upload_failure_leaves_text_unchanged: { test_id: content-body-field }
