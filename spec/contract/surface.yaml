    observations:
      # What the screen reports after submit_proposal or save_changes_and_submit is refused:
      # the notice it raises and any message it shows against a field, as text. Absent
      # when the submission went through. The old application's notice is a general one
      # that does not repeat the service's reason; proposal-team-request reads the reason.
      submission_refusal: { test_id: null }
      # Each message the form shows against one of its fields after save_changes is
      # refused, with the field it stands against (organization, a phase's team or cost,
      # a team question response, a reference). The screen puts the service's own wording
      # there: a submitted proposal whose organization was changed shows "Organization
      # cannot be changed once the proposal has been submitted" against organization.
      # Empty when the save went through, which the form closing and status show.
      field_error: { test_id: null }
      # The organization the proposal names, by legal name, as the screen shows it once
