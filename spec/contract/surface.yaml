# Pages, and the actions and observations each offers. Test IDs are filled at the design gate.
#
# Actions and observations are named in the vocabulary the criteria use. A route with a
# query string in it (".../edit?tab=consensus") names a tab of a page rather than a
# separate address; the tab is part of how a test reaches the surface, not a selector.
# Several routes appear twice under different ids where two domains own different parts
# of the same screen; each such entry says so in a comment above it.
#
# Where a route parameter comes from
# ----------------------------------
# A test can only open a route whose parameters it can fill, so every parameter used
# below has a named source and there are only four kinds:
#
#   From the seed. Every record tests/seed/manifest.yaml names carries its identifier
#   there, so :userId, :orgId, the :slug of the one administrator-made page, the
#   :opportunityId of the two seeded Code With Us opportunities and of the seeded Sprint
#   With Us and Team With Us opportunities that have already closed, and the :proposalId
#   of the six proposals against those two, are all handles. The closed pair is what the
#   evaluation screens below are reached through: an opportunity closes only when its
#   proposal deadline passes, and no form will accept a deadline that has already gone by,
#   so the starting point for every criterion behind a closure is seeded rather than built.
#
#   From the page the record lands on. Creating a record sends the browser to that
#   record's own screen, and every such screen carries an observation returning the
#   identifier its own address holds — opportunity_identifier, proposal_identifier,
#   organization_identifier, user_identifier, page_address, attachment_address. A test
#   that builds an opportunity, a proposal, an organization or an attachment reads the
#   identifier off the screen it arrives on and passes it to any other route that needs
#   it. Without these observations a record a test creates cannot be addressed again,
#   which is why they are here rather than left to the design gate.
#
#   By following the service's own link. The evaluation and consensus screens for one
#   proponent are reached by open_proponent_evaluation and open_proponent_consensus on
#   the list that precedes them, which is also how a person reaches them. A test that
#   follows the link needs no identifier at all.
#
#   From a fixed set the application itself defines. :program is one of code-with-us,
#   sprint-with-us and team-with-us. :recordKind is opportunities or proposals.
#   :noticeId is one of deactivatedOwnAccount and authFailure, and any other value is
#   answered as not found. :userId on an evaluation or consensus screen is the panel
#   member's own account, which the seed names. The :slug of each page the service needs
#   for itself is fixed by the service and named in the manifest's content group.
#
#   From the mail catcher. :messageId on caught-message is the catcher's identifier for a
#   message, returned by mail.messagesTo and by caught-message-list.
#
# The seed also carries opportunities already standing at each stage of evaluation, one
# per criterion that moves one on, so a criterion about consensus, the code challenge,
# the team scenario, processing or an award starts from its own record rather than from
# walking the one lapsed opportunity of its program through every stage before it. Their
# handles are in the manifest's opportunities group, each naming the criteria it serves.
#
# A screen that is also reachable as the signed-in person's own carries a second entry
# with no parameter in its route: the application resolves "me" in place of an account
# identifier, and a test acting as itself has no identifier to pass.
pages:
  - id: home
    domain: opportunities
    route: /
    title: "Digital Marketplace"
    actions:
      browse_opportunities: { test_id: home-browse-opportunities }
      sign_in: { test_id: home-sign-in }
      sign_up: { test_id: home-sign-up }
    observations:
      total_awarded_opportunity_count: { test_id: home-awarded-count }
      total_awarded_opportunity_value: { test_id: home-awarded-value }
      readable_when_signed_out: { test_id: home-page }

  # The dashboard as public sector staff and administrators see it. The same route is
  # listed again as proposal-vendor-dashboard, which is what a vendor sees there, and as
  # evaluation-panel-dashboard, which is the panel tab.
  - id: opportunity-dashboard
    domain: opportunities
    route: /dashboard
    title: "Dashboard"
    actions:
      create_opportunity: { test_id: dashboard-create-opportunity }
      open_opportunity: { test_id: dashboard-opportunity-link }
    observations:
      my_opportunities_table: { test_id: dashboard-opportunities-table }
      opportunity_status: { test_id: opportunity-status }
      own_opportunities_only: { test_id: dashboard-opportunity-row }
      all_opportunities_for_administrator: { test_id: dashboard-opportunity-row }
      empty_my_opportunities_message: { test_id: dashboard-empty-message }

  - id: opportunity-list
    domain: opportunities
    route: /opportunities
    title: "Opportunities"
    actions:
      filter_by_program: { test_id: opportunity-filter-program }
      filter_by_status: { test_id: opportunity-filter-status }
      filter_remote_only: { test_id: opportunity-filter-remote }
      search: { test_id: opportunity-search }
      toggle_watch: { test_id: opportunity-watch-toggle }
    observations:
      unpublished_group: { test_id: opportunity-group-unpublished }
      open_group: { test_id: opportunity-group-open }
      closed_group: { test_id: opportunity-group-closed }
      opportunity_status: { test_id: opportunity-status }
      proposal_deadline: { test_id: opportunity-proposal-deadline }

  - id: opportunity-program-select
    domain: opportunities
    route: /opportunities/create
    title: "Create an opportunity"
    actions:
      choose_code_with_us: { test_id: program-choose-code-with-us }
      choose_sprint_with_us: { test_id: program-choose-sprint-with-us }
      choose_team_with_us: { test_id: program-choose-team-with-us }
    observations:
      program_card: { test_id: program-card }
      max_budget: { test_id: program-max-budget }

  - id: opportunity-cwu-create
    domain: opportunities
    route: /opportunities/code-with-us/create
    title: "Create a Code With Us opportunity"
    actions:
      # Input: any of title, proposal_deadline, assignment_date, start_date and
      # completion_date, each entered exactly as given and every one optional; a key left
      # out leaves its field blank. A date is a calendar day written YYYY-MM-DD. "Save
      # Draft" is offered whatever the form holds, so a date the application treats as
      # invalid is sent as it is. The date fields take only real calendar days, so an
      # invalid date here is one earlier than its minimum: a proposal deadline before
      # today, an assignment date before the proposal deadline, a start date before the
      # assignment date, a completion date before the start date. A day long past such as
      # 2000-01-01 is invalid for all four whatever else is entered.
      save_draft: { test_id: opportunity-save-draft }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      add_attachment: { test_id: attachment-add-button }
    observations:
      field_error: { test_id: field-error }

  - id: opportunity-cwu-view
    domain: opportunities
    route: /opportunities/code-with-us/:opportunityId
    title: "Code With Us opportunity"
    actions:
      toggle_watch: { test_id: opportunity-watch-toggle }
      start_proposal: { test_id: opportunity-start-proposal }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      status: { test_id: opportunity-status }
      published_date: { test_id: opportunity-published-date }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      proposal_deadline: { test_id: opportunity-proposal-deadline }
      # The assignment date and the work start date as this screen shows them. It shows no
      # completion date; that is read on opportunity-cwu-edit.
      assignment_date: { test_id: null }
      start_date: { test_id: null }
      reward: { test_id: opportunity-reward }
      addenda: { test_id: opportunity-addenda }
      successful_proponent: { test_id: opportunity-successful-proponent }
      # What an awarded opportunity shows about its winner beyond the name: the contact
      # details and the score, which only a reader permitted to see proposal scores is
      # shown. Empty for anybody else, and for an opportunity not yet awarded.
      successful_proponent_contact_details: { test_id: null }
      successful_proponent_score: { test_id: null }

  - id: opportunity-cwu-edit
    domain: opportunities
    route: /opportunities/code-with-us/:opportunityId/edit
    title: "Manage a Code With Us opportunity"
    actions:
      edit_details: { test_id: opportunity-edit-button }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      cancel_opportunity: { test_id: opportunity-cancel-button }
      delete_opportunity: { test_id: opportunity-delete-button }
      add_addendum: { test_id: addendum-add-button }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      summary_tab: { test_id: opportunity-tab-summary }
      opportunity_tab: { test_id: opportunity-tab-opportunity }
      addenda_tab: { test_id: opportunity-tab-addenda }
      history_tab: { test_id: opportunity-tab-history }
      proposals_tab: { test_id: opportunity-tab-proposals }
      reporting_views: { test_id: reporting-views }
      reporting_watchers: { test_id: reporting-watchers }
      reporting_proposals: { test_id: reporting-proposals }
      # The dates the opportunity holds, as its opportunity tab (?tab=opportunity) shows
      # them in its form, each a calendar day; empty when the opportunity has none. This is
      # the one screen where all four, the completion date included, can be read.
      proposal_deadline: { test_id: null }
      assignment_date: { test_id: null }
      start_date: { test_id: null }
      completion_date: { test_id: null }

  - id: opportunity-cwu-complete
    domain: opportunities
    route: /opportunities/code-with-us/:opportunityId/complete
    title: "Code With Us opportunity report"
    actions: {}
    observations:
      full_report: { test_id: opportunity-full-report }

  - id: opportunity-swu-create
    domain: opportunities
    route: /opportunities/sprint-with-us/create
    title: "Create a Sprint With Us opportunity"
    actions:
      # Input: as on opportunity-cwu-create, with title, proposal_deadline and
      # assignment_date. A Sprint With Us opportunity has no start or completion date of
      # its own; those belong to its phases, entered through add_phase.
      save_draft: { test_id: opportunity-save-draft }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      add_phase: { test_id: add-phase-button }
      add_team_question: { test_id: add-team-question-button }
      set_evaluation_panel: { test_id: evaluation-panel-editor }
    observations:
      field_error: { test_id: field-error }
      score_weight_error: { test_id: score-weight-error }
      # The fields one evaluation (team) question offers the person for entry, named in the
      # criteria's words, for the question at a given place in the list (the first is 1).
      # The application offers five: question, guideline, response_word_limit,
      # maximum_score and minimum_score. No position or order field is offered; a
      # question's position is its place in the list. Empty when the list holds no
      # question at that place.
      evaluation_question_fields: { test_id: null }

  - id: opportunity-swu-view
    domain: opportunities
    route: /opportunities/sprint-with-us/:opportunityId
    title: "Sprint With Us opportunity"
    actions:
      toggle_watch: { test_id: opportunity-watch-toggle }
      start_proposal: { test_id: opportunity-start-proposal }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      status: { test_id: opportunity-status }
      published_date: { test_id: opportunity-published-date }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      proposal_deadline: { test_id: opportunity-proposal-deadline }
      # The assignment date as this screen shows it. Start and completion dates are each
      # phase's own and stand in phases.
      assignment_date: { test_id: null }
      total_max_budget: { test_id: opportunity-total-max-budget }
      phases: { test_id: opportunity-phases }
      # The body of the page at "sprint-with-us-opportunity-scope" (seed.content
      # .servicePageSprintWithUsOpportunityScope) as this screen embeds it, rendered. Empty
      # when that page cannot be read. That page is one the service needs: no screen and
      # no request removes it or changes its address, its body cannot be saved empty, and
      # reading it needs no sign-in. It can therefore be unreadable only if its database
      # row is absent, which the application never produces. The seed does not remove it,
      # because every Sprint With Us opportunity reads the same page at the same address,
      # so removing it would empty this section for every test.
      scope_section: { test_id: null }
      addenda: { test_id: opportunity-addenda }
      successful_proponent: { test_id: opportunity-successful-proponent }
      # What an awarded opportunity shows about its winner beyond the name: the contact
      # details and the score, which only a reader permitted to see proposal scores is
      # shown. Empty for anybody else, and for an opportunity not yet awarded.
      successful_proponent_contact_details: { test_id: null }
      successful_proponent_score: { test_id: null }

  - id: opportunity-swu-edit
    domain: opportunities
    route: /opportunities/sprint-with-us/:opportunityId/edit
    title: "Manage a Sprint With Us opportunity"
    actions:
      edit_details: { test_id: opportunity-edit-button }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      cancel_opportunity: { test_id: opportunity-cancel-button }
      delete_opportunity: { test_id: opportunity-delete-button }
      add_addendum: { test_id: addendum-add-button }
      edit_evaluation_panel: { test_id: opportunity-tab-evaluation-panel }
      finalize_question_consensuses: { test_id: finalize-consensus-button }
      start_team_scenario: { test_id: start-team-scenario-button }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      summary_tab: { test_id: opportunity-tab-summary }
      opportunity_tab: { test_id: opportunity-tab-opportunity }
      addenda_tab: { test_id: opportunity-tab-addenda }
      history_tab: { test_id: opportunity-tab-history }
      proposals_tab: { test_id: opportunity-tab-proposals }
      team_questions_tab: { test_id: opportunity-tab-team-questions }
      code_challenge_tab: { test_id: opportunity-tab-code-challenge }
      team_scenario_tab: { test_id: opportunity-tab-team-scenario }
      evaluation_panel_tab: { test_id: opportunity-tab-evaluation-panel }
      consensus_tab: { test_id: opportunity-tab-consensus }
      # The two evaluation tabs offered only to an evaluator: the program's evaluation
      # instructions and the evaluator's own list of individual evaluations. With
      # evaluation_panel_tab and consensus_tab these are the four an evaluation's tools
      # are split into, each present or absent for the signed-in person.
      instructions_tab: { test_id: null }
      evaluation_tab: { test_id: null }
      # As on opportunity-cwu-edit, for the two dates a Sprint With Us opportunity holds
      # itself; its start and completion dates are its phases'.
      proposal_deadline: { test_id: null }
      assignment_date: { test_id: null }
      # As on opportunity-swu-create, read on the team questions tab while editing.
      evaluation_question_fields: { test_id: null }

  - id: opportunity-swu-complete
    domain: opportunities
    route: /opportunities/sprint-with-us/:opportunityId/complete
    title: "Sprint With Us opportunity report"
    actions: {}
    observations:
      full_report: { test_id: opportunity-full-report }

  - id: opportunity-twu-create
    domain: opportunities
    route: /opportunities/team-with-us/create
    title: "Create a Team With Us opportunity"
    actions:
      # Input: as on opportunity-cwu-create, with title, proposal_deadline,
      # assignment_date, start_date and completion_date.
      save_draft: { test_id: opportunity-save-draft }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      add_resource: { test_id: add-resource-button }
      add_resource_question: { test_id: add-resource-question-button }
      set_evaluation_panel: { test_id: evaluation-panel-editor }
    observations:
      field_error: { test_id: field-error }
      score_weight_error: { test_id: score-weight-error }
      # As on opportunity-swu-create, for one resource question: question, guideline,
      # response_word_limit, maximum_score and minimum_score, and no position or order
      # field.
      evaluation_question_fields: { test_id: null }

  - id: opportunity-twu-view
    domain: opportunities
    route: /opportunities/team-with-us/:opportunityId
    title: "Team With Us opportunity"
    actions:
      toggle_watch: { test_id: opportunity-watch-toggle }
      start_proposal: { test_id: opportunity-start-proposal }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      status: { test_id: opportunity-status }
      published_date: { test_id: opportunity-published-date }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      proposal_deadline: { test_id: opportunity-proposal-deadline }
      # The contract award (assignment) date, the contract start date and the contract
      # completion date as this screen shows them; empty when the opportunity has none.
      assignment_date: { test_id: null }
      start_date: { test_id: null }
      completion_date: { test_id: null }
      max_budget: { test_id: opportunity-max-budget }
      resources: { test_id: opportunity-resources }
      # The body of the page at "team-with-us-terms-and-conditions" (seed.content
      # .servicePageTeamWithUsTerms) as this screen embeds it, rendered.
      terms_section: { test_id: null }
      addenda: { test_id: opportunity-addenda }
      successful_proponent: { test_id: opportunity-successful-proponent }
      # What an awarded opportunity shows about its winner beyond the name: the contact
      # details and the score, which only a reader permitted to see proposal scores is
      # shown. Empty for anybody else, and for an opportunity not yet awarded.
      successful_proponent_contact_details: { test_id: null }
      successful_proponent_score: { test_id: null }

  - id: opportunity-twu-edit
    domain: opportunities
    route: /opportunities/team-with-us/:opportunityId/edit
    title: "Manage a Team With Us opportunity"
    actions:
      edit_details: { test_id: opportunity-edit-button }
      submit_for_review: { test_id: opportunity-submit-for-review }
      publish: { test_id: opportunity-publish }
      cancel_opportunity: { test_id: opportunity-cancel-button }
      delete_opportunity: { test_id: opportunity-delete-button }
      add_addendum: { test_id: addendum-add-button }
      edit_evaluation_panel: { test_id: opportunity-tab-evaluation-panel }
      finalize_question_consensuses: { test_id: finalize-consensus-button }
    observations:
      opportunity_identifier: { test_id: opportunity-identifier }
      created_by_name: { test_id: opportunity-created-by }
      last_changed_by_name: { test_id: opportunity-last-changed-by }
      summary_tab: { test_id: opportunity-tab-summary }
      opportunity_tab: { test_id: opportunity-tab-opportunity }
      addenda_tab: { test_id: opportunity-tab-addenda }
      history_tab: { test_id: opportunity-tab-history }
      proposals_tab: { test_id: opportunity-tab-proposals }
      resource_questions_tab: { test_id: opportunity-tab-resource-questions }
      challenge_tab: { test_id: opportunity-tab-challenge }
      evaluation_panel_tab: { test_id: opportunity-tab-evaluation-panel }
      consensus_tab: { test_id: opportunity-tab-consensus }
      # As on opportunity-swu-edit: offered only to an evaluator.
      instructions_tab: { test_id: null }
      evaluation_tab: { test_id: null }
      # The changes of state this screen offers the signed-in person from the state the
      # opportunity is in now — award, cancel, move to the next stage — named in the
      # criteria's words. A criterion turns on which changes a Team With Us opportunity in
      # processing permits, and "offered here" is how that set reaches a reader.
      offered_state_changes: { test_id: null }
      # As on opportunity-cwu-edit.
      proposal_deadline: { test_id: null }
      assignment_date: { test_id: null }
      start_date: { test_id: null }
      completion_date: { test_id: null }
      # As on opportunity-twu-create, read on the resource questions tab while editing.
      evaluation_question_fields: { test_id: null }

  - id: opportunity-twu-complete
    domain: opportunities
    route: /opportunities/team-with-us/:opportunityId/complete
    title: "Team With Us opportunity report"
    actions: {}
    observations:
      full_report: { test_id: opportunity-full-report }

  # Not a screen, and here because a test can reach nothing else that does this. The
  # application has no scheduler: a published opportunity whose proposal deadline has
  # passed is moved on by a hook that runs in front of this address and in front of the
  # resource routes under /api, and nowhere else. Requesting it is how a test brings a
  # closure about deliberately instead of waiting for a clock, and the oracle sets the
  # hook's throttle to two seconds. The request starts the closing work without waiting
  # for it, so a test reads the result through the bounded polling procedure in
  # spec/contract/observables.yaml (scheduled_transitions). Without an entry here the criteria
  # that begin "when the proposal deadline passes" have no "when" a test can perform.
  - id: scheduled-transition-trigger
    domain: opportunities
    route: /status
    title: "Service status"
    actions:
      run_pending_transitions: { test_id: service-status-page }
    observations:
      service_is_up: { test_id: service-status-message }

  - id: proposal-cwu-create
    domain: proposals
    route: /opportunities/code-with-us/:opportunityId/proposals/create
    title: "Create a Code With Us proposal"
    actions:
      choose_proponent_individual: { test_id: proposal-proponent-individual }
      choose_proponent_organization: { test_id: proposal-proponent-organization }
      add_attachment: { test_id: attachment-add-button }
      save_draft: { test_id: proposal-save-draft }
      submit_proposal: { test_id: proposal-submit }
      accept_program_terms: { test_id: proposal-accept-program-terms }
      accept_app_terms: { test_id: proposal-accept-app-terms }
      cancel: { test_id: proposal-cancel }
    observations:
      field_error: { test_id: field-error }
      # Every refusal the screen reports against a field, each as the field it names (legal
      # name, email address, phone, street address, city, province, postal code, country,
      # proposal text, additional comments) together with its message, so that a test can
      # tell which fields a refused submission was refused for.
      field_errors_by_field: { test_id: null }
      opportunity_summary: { test_id: proposal-opportunity-summary }
      terms_modal: { test_id: proposal-terms-dialog }
      submit_disabled_until_terms_accepted: { test_id: proposal-submit-confirm }

  - id: proposal-cwu-edit
    domain: proposals
    route: /opportunities/code-with-us/:opportunityId/proposals/:proposalId/edit
    title: "Manage a Code With Us proposal"
    actions:
      start_editing: { test_id: proposal-edit-button }
      save_changes: { test_id: proposal-save-changes }
      save_changes_and_submit: { test_id: proposal-save-and-submit }
      submit_proposal: { test_id: proposal-submit }
      withdraw_proposal: { test_id: proposal-withdraw-button }
      delete_proposal: { test_id: proposal-delete-button }
      add_attachment: { test_id: attachment-add-button }
      remove_attachment: { test_id: attachment-remove-button }
    observations:
      proposal_identifier: { test_id: proposal-identifier }
      opportunity_identifier: { test_id: opportunity-identifier }
      proposal_tab: { test_id: proposal-tab-proposal }
      status: { test_id: proposal-status }
      submitted_at: { test_id: proposal-submitted-at }
      score: { test_id: proposal-score }
      rank: { test_id: proposal-rank }
      available_actions: { test_id: proposal-actions }

  - id: proposal-cwu-view
    domain: proposals
    route: /opportunities/code-with-us/:opportunityId/proposals/:proposalId
    title: "Code With Us proposal"
    actions:
      enter_score: { test_id: proposal-enter-score }
      award_proposal: { test_id: proposal-award-button }
      disqualify_proposal: { test_id: proposal-disqualify-button }
    observations:
      proposal_identifier: { test_id: proposal-identifier }
      proposal_tab: { test_id: proposal-tab-proposal }
      history_tab: { test_id: proposal-tab-history }
      proponent: { test_id: proposal-proponent-name }
      score: { test_id: proposal-score }
      rank: { test_id: proposal-rank }
      export_link: { test_id: proposal-export-link }

  - id: proposal-cwu-export-one
    domain: proposals
    route: /opportunities/code-with-us/:opportunityId/proposals/:proposalId/export
    title: "Export a Code With Us proposal"
    actions: {}
    observations:
      exported_proposal: { test_id: proposal-export-document }

  - id: proposal-cwu-export-all
    domain: proposals
    route: /opportunities/code-with-us/:opportunityId/proposals/export
    title: "Export all Code With Us proposals"
    actions: {}
    observations:
      exported_proposal: { test_id: proposal-export-document }

  - id: proposal-swu-create
    domain: proposals
    route: /opportunities/sprint-with-us/:opportunityId/proposals/create
    title: "Create a Sprint With Us proposal"
    actions:
      choose_organization: { test_id: proposal-organization-field }
      add_phase_team_member: { test_id: proposal-add-team-member }
      set_scrum_master: { test_id: proposal-scrum-master }
      set_phase_proposed_cost: { test_id: proposal-phase-cost-field }
      answer_team_question: { test_id: proposal-question-response-field }
      add_reference: { test_id: proposal-add-reference }
      add_attachment: { test_id: attachment-add-button }
      save_draft: { test_id: proposal-save-draft }
      submit_proposal: { test_id: proposal-submit }
      accept_program_terms: { test_id: proposal-accept-program-terms }
      accept_app_terms: { test_id: proposal-accept-app-terms }
    observations:
      field_error: { test_id: field-error }
      capability_gap_error: { test_id: proposal-capability-gap-error }
      budget_exceeded_error: { test_id: proposal-budget-exceeded-error }
      unqualified_organization_notice: { test_id: proposal-unqualified-organization-notice }
      pending_team_member: { test_id: proposal-pending-team-member }
      # The people the team-member choice offers for a phase once an organization is
      # chosen, by name, leaving out anybody the choice no longer offers because they are
      # already named in that phase. Each name is the person's account name, as the
      # manifest gives it (users.organizationOwner is "Blake Placeholder"). The choice
      # also lists people whose invitation to the organization is still unanswered,
      # marked pending (pending_team_member), so for organizations.qualified it holds
      # users.teamCandidatePending beside the three active members. A person whose
      # membership is inactive is not offered. While any phase names a pending person,
      # submit_proposal stays unavailable and the phase says its team must be confirmed
      # (non-pending) members; save_draft still saves the proposal with that person on
      # it, because the service checks membership only when a proposal is submitted.
      team_member_choices: { test_id: null }
      # Phases below are named Inception, Prototype and Implementation, as the criteria
      # name them. The oracle's screen labels the Prototype phase "Proof of Concept", on its
      # team section and on its cost field ("Proof of Concept Cost"); the binding reads that
      # label as Prototype.
      #
      # The phases the form offers a team section for, by phase name, in the order the form
      # shows them. The form offers a section for each phase the opportunity has and no
      # other: an opportunity with a Prototype and an Implementation phase and no Inception
      # phase gives [Prototype, Implementation]. Implementation is always among them, since
      # every Sprint With Us opportunity has it.
      phase_team_sections: { test_id: null }
      # Each offered phase, by phase name, with whether the form counts its team section as
      # meeting the phase's requirements, and the phase's required capabilities that the
      # team named in it does not yet hold (by capability name, empty when all are held).
      # A section is incomplete while it names nobody, names a person whose membership is
      # still pending, or leaves a required capability unheld; the oracle marks an
      # incomplete section with a warning icon in place of its usual one, and its
      # capability list shows each held capability checked. While any section is
      # incomplete, submit_proposal stays unavailable. The form does not count the scrum
      # master: a phase whose members include no scrum master reads complete here, and the
      # service refuses it when submitted. The scrum master is a single choice per phase
      # on this form, so two cannot be chosen here.
      phase_requirements: { test_id: null }
      # Each message the form shows against a cost field, with the field it stands
      # against: a phase by phase name (that phase's proposed cost), or total (the total
      # proposed cost, which the form adds up from the phase costs and does not take as
      # input). Shown once set_phase_proposed_cost has entered the cost, before any
      # submission. A phase cost over the phase's maximum budget reads "Please enter a
      # Proposed Cost less than or equal to N." with N the phase's maximum budget written
      # with thousands separators and no dollar sign ("200,000"); a total over the
      # opportunity's total maximum budget reads "The proposed cost exceeds the maximum
      # budget for this opportunity." against total. Empty when every cost is within its
      # budget. While any is shown, submit_proposal stays unavailable.
      cost_errors: { test_id: null }

