# Pages, and the actions and observations each offers. Test IDs are filled at the design gate.
#
# Actions and observations are named in the vocabulary the criteria use. A route with a
# query string in it (".../edit?tab=consensus") names a tab of a page rather than a
# separate address; the tab is part of how a test reaches the surface, not a selector.
# Several routes appear twice under different ids where two domains own different parts
# of the same screen; each such entry says so in a comment above it.
#
# Where a route parameter comes from
# ----------------------------------
# A test can only open a route whose parameters it can fill, so every parameter used
# below has a named source and there are only four kinds:
#
#   From the seed. Every record tests/seed/manifest.yaml names carries its identifier
#   there, so :userId, :orgId, the :slug of the one administrator-made page, the
#   :opportunityId of the two seeded Code With Us opportunities and of the seeded Sprint
#   With Us and Team With Us opportunities that have already closed, and the :proposalId
#   of the six proposals against those two, are all handles. The closed pair is what the
#   evaluation screens below are reached through: an opportunity closes only when its
#   proposal deadline passes, and no form will accept a deadline that has already gone by,
#   so the starting point for every criterion behind a closure is seeded rather than built.
#
#   From the page the record lands on. Creating a record sends the browser to that
#   record's own screen, and every such screen carries an observation returning the
#   identifier its own address holds — opportunity_identifier, proposal_identifier,
#   organization_identifier, user_identifier, page_address, attachment_address. A test
#   that builds an opportunity, a proposal, an organization or an attachment reads the
#   identifier off the screen it arrives on and passes it to any other route that needs
#   it. Without these observations a record a test creates cannot be addressed again,
#   which is why they are here rather than left to the design gate.
#
#   By following the service's own link. The evaluation and consensus screens for one
#   proponent are reached by open_proponent_evaluation and open_proponent_consensus on
#   the list that precedes them, which is also how a person reaches them. A test that
#   follows the link needs no identifier at all.
#
#   From a fixed set the application itself defines. :program is one of code-with-us,
#   sprint-with-us and team-with-us. :noticeId is one of deactivatedOwnAccount and
#   authFailure, and any other value is answered as not found. :userId on an evaluation
#   or consensus screen is the panel member's own account, which the seed names.
#
# A screen that is also reachable as the signed-in person's own carries a second entry
# with no parameter in its route: the application resolves "me" in place of an account
# identifier, and a test acting as itself has no identifier to pass.
pages:
  - id: home
    domain: opportunities
    route: /
    title: "Digital Marketplace"
    actions:
      browse_opportunities: { test_id: null }
      sign_in: { test_id: null }
      sign_up: { test_id: null }
    observations:
      total_awarded_opportunity_count: { test_id: null }
      total_awarded_opportunity_value: { test_id: null }
      readable_when_signed_out: { test_id: null }

