# Side effects a test may observe without reading the application's internals.
#
# Every address below is either a route of the application under test, reached at that
# target's own base URL, or an environment variable the harness sets at run time. No
# literal host or port appears here: the oracle chooses its ports when it starts.

email:
  # Every message the application sends leaves it over SMTP. The oracle points the
  # application's mail settings at a mailpit container (.sdlc/oracle/compose.yml), and a
  # test reads what arrived through mailpit's own HTTP API.
  via: mail-catcher
  api: ${SDLC_MAIL_API}
  catcher: mailpit
  read_messages: GET ${SDLC_MAIL_API}/api/v1/messages
  read_one_message: GET ${SDLC_MAIL_API}/api/v1/message/{id}
  search_messages: GET ${SDLC_MAIL_API}/api/v1/search?query={query}
  delete_all_messages: DELETE ${SDLC_MAIL_API}/api/v1/messages
  observable:
    # What a test may assert about a message it finds.
    recipient: to
    copied_recipients: bcc
    sender: from
    reply_to: ReplyTo
    subject: subject
    html_body: HTML
    plain_text_body: Text
    sent_at: Date
  # The pages in spec/contract/surface.yaml that read these fields, one message at a time
  # (caught-message, by the catcher's identifier) and all messages at once
  # (caught-message-list). Both are served by the catcher, not by the target.
  surfaces: [caught-message, caught-message-list, mail-delivery-fault, mail-delivery-delay]
  # A mail server that refuses delivery, for the criteria whose given is a message that
  # cannot be delivered. The catcher's fault injection (mailpit "chaos", switched on in
  # .sdlc/oracle/compose.yml) makes its SMTP server answer the sender's first command with
  # a refusal while it is in force. The service sends each message over a fresh connection
  # and treats a refusal the way it treats any failure to deliver
  # (src/back-end/lib/mailer/transport.ts: the error is logged, the send resolves, nothing
  # is retried), so this is the same thing to the service as an unreachable mail server.
  # A rebuilt target under test is given a catcher configured the same way.
  delivery_fault:
    read: GET ${SDLC_MAIL_API}/api/v1/chaos
    refuse: >-
      PUT ${SDLC_MAIL_API}/api/v1/chaos with body
      {"Sender": {"ErrorCode": 451, "Probability": 100}}
    restore: >-
      PUT ${SDLC_MAIL_API}/api/v1/chaos with body
      {"Sender": {"ErrorCode": 451, "Probability": 0}}
    observable:
      in_force: Sender.Probability in the answer to read is 100
    notes:
      - The fault is the catcher's, not the target's, and putting the data back to the
        seed does not lift it. A test that refuses delivery restores it when it ends,
        pass or fail, or every later test on the same catcher reads an empty inbox.
      - While the fault is in force the catcher stores nothing, so absence is the whole
        of what a test sees. A test asserting that nothing was retried restores delivery,
        triggers something that does send (so the catcher is shown to be accepting
        again), and then finds only that later message. The later message can land a
        moment after the service has answered, so wait for it to appear rather than
        reading once.
  # A mail server that answers slowly, for the criteria about the order of an answer and
  # the messages behind it (R-6.24: an announcement of changed terms reported as done
  # before any message has been sent). The service reaches the catcher's SMTP port through
  # a pass-through proxy (mail-hold in .sdlc/oracle/compose.yml) whose control API is
  # served beside the catcher's under ${SDLC_MAIL_API}/hold. With nothing in force it
  # changes nothing. slow delays every reply the mail server makes by three seconds.
  #
  # Three seconds, and not longer, because the service gives up on a mail server that has
  # not greeted it within five (src/back-end/config.ts, greetingTimeout), and a longer
  # delay would turn a slow server into a refusing one. A message needs at least three
  # replies before its content is sent (to the sender, the recipient and the start of the
  # content), so while the delay is in force none reaches the catcher sooner than nine
  # seconds after the service begins sending it — fifteen on a fresh connection, which
  # also waits for the greeting and the introduction.
  #
  # How a test uses it: slow; take the action; read the service's answer as soon as it
  # appears, and read the catcher (caught-message-list.message_count) at that moment; lift
  # the delay; then wait for the messages to appear, which shows they were on their way
  # rather than dropped. A service that waited for its messages before answering would
  # not answer until they had reached the catcher.
  # A rebuilt target under test is given a catcher configured the same way.
  delivery_delay:
    read: GET ${SDLC_MAIL_API}/hold/proxies/smtp/toxics
    slow: >-
      POST ${SDLC_MAIL_API}/hold/proxies/smtp/toxics with body
      {"name": "hold", "type": "latency", "stream": "downstream", "toxicity": 1,
       "attributes": {"latency": 3000, "jitter": 0}}
    restore: DELETE ${SDLC_MAIL_API}/hold/proxies/smtp/toxics/hold
    restore_everything: POST ${SDLC_MAIL_API}/hold/reset
    observable:
      in_force: the answer to read lists a toxic named "hold"
    notes:
      - The delay is the proxy's, not the target's, and putting the data back to the seed
        does not lift it. A test that slows delivery restores it when it ends, pass or
        fail. Asking to slow when the delay is already in force is answered with a
        conflict; restore first.
      - Lifting the delay while messages are on their way lets them finish at full speed;
        nothing is dropped. Refusal (delivery_fault) and delay can be combined, though no
        criterion needs it.
  # How every target is configured to send, so that "the same sender for every kind of
  # message" and "the service's own address as the visible recipient" have a value to be
  # compared with. The oracle sets these in .sdlc/oracle/compose.yml; a rebuilt target
  # under test is configured the same way.
  configured_sender: "Digital Marketplace <donotreply@example.test>"
  configured_sender_address: donotreply@example.test
  # The application sets no reply-to of its own; a message's ReplyTo is empty unless the
  # sender is taken as the reply address.
  # The marking a test environment puts on every message (VITE_SHOW_TEST_INDICATOR,
  # which the oracle turns on). The subject begins with the marker, and the image at the
  # top of the formatted body is the test variant of the logo.
  test_marker:
    subject_prefix: "[TEST] "
    logo_address_ends_with: images/logo_test.png
    ordinary_logo_address_ends_with: images/logo.png
  # The one kind of message a person's notification setting governs: the announcement of
  # a newly published opportunity, in each of the three programs, sent to every account
  # that has asked for new-opportunity notices and has not been deactivated
  # (src/back-end/lib/db/user.ts readManyUsersNotificationsOn). Every other message is
  # sent whatever the setting says.
  governed_by_notification_setting:
    - new Code With Us opportunity announcement
    - new Sprint With Us opportunity announcement
    - new Team With Us opportunity announcement
  # A kind of notification an active vendor receives that is not about an opportunity it is
  # watching, and how to make the service send it without the organization screens — so
  # that its absence for a deactivated account can be asserted (R-6.17).
  received_by_an_active_vendor:
    - kind: new opportunity announcement
      subject_contains: "A New Code With Us Opportunity Has Been Posted"
      reaches: >-
        every account that has asked for new-opportunity notices and is not deactivated,
        blind-copied in batches (see governed_by_notification_setting and batch_size)
      trigger: >-
        persona.administrator publishes a Code With Us opportunity —
        opportunity-cwu-edit.publish on seed.opportunities.draftOfOtherStaff, or
        opportunity-cwu-create.publish on one the test builds
      active_recipient: users.vendorOne (notices on, active)
      deactivated_account: >-
        users.vendorDeactivated — notices on and already deactivated in the seed, so
        it is exactly the account the clause is about without a test deactivating anyone;
        it appears in seed-notices-do-not-receive for that reason
      notes:
        - The announcement is the one message whose recipients are chosen by the
          notification setting rather than by a relation to the opportunity, so it is the
          plainest "any other kind" a vendor receives. Read the blind-copy list of every
          message carrying the subject to see who a batch reached.
        - Deactivating an account through the screens sends that account a notice of its
          deactivation at the moment it happens. That notice is the account being told it
          has been deactivated, not a notification received while deactivated; a test
          that deactivates someone itself should judge only messages sent afterwards.
  batch_size: 50
  notes:
    - A message is addressed to one person and every other recipient is a blind copy, so
      a test that reads only the visible recipient of a batch sees one address and not
      the group. Read the blind-copy list to count who a batch reached.
    - The application never fails a request because a message could not be sent; a mail
      server that is unreachable produces a logged error and nothing in the catcher.
      Absence of a message is therefore evidence of what the application decided, not of
      whether the mail server was up, and a test asserting absence should first prove
      the catcher is reachable.
    - >-
      Some messages the code sets out to send do not arrive. The messages that follow an
      ordinary request — an invitation to join an organization, for one — reach the
      catcher within the same second. When the deadline hook closes a Code With Us
      opportunity, its notice arrives too ("Your Code With Us Opportunity is Ready to Be
      Evaluated"; closing the seeded lapsed Code With Us opportunities on a fresh start
      put twelve of them in the catcher). The messages the same hook sets out to send when
      it closes a Sprint With Us or Team With Us opportunity do not: closing those, each
      with an evaluation panel, has left nothing in the catcher and nothing in the
      application's log. The hook hands the notification off without
      waiting for it and does so from inside the transaction that is closing the
      opportunity, so whatever happens to it happens out of sight. A criterion about who
      is told when an opportunity closes should therefore be measured against the target
      rather than assumed, and a test that expects such a message and does not get one has
      found something real.
    - Subjects carry a leading test marker when the application is configured to show
      one. The oracle turns that marker on, so assert on subjects by what they contain
      rather than by what they equal.
    - Announcements to large groups are sent in batches, so several messages may carry
      the same subject and between them cover the whole group.
    - Every field under "observable" above is one a test must be able to read, and the
      list of messages does not carry all of them. The listing gives a subject, a
      snippet, a visible recipient and an identifier; the sender, the blind-copy list,
      the formatted body and the plain-text body come only from reading one message by
      its identifier. A criterion about who else a batch reached, about what a message
      says, or about which sender it came from is reachable only that way, so whatever
      reads the catcher must offer both calls and not the listing alone.

configurations:
  # Settings the service reads once at start-up and that one criterion is about, so that a
  # test cannot reach them by acting on a running service. Each is selected by an
  # environment variable set where the oracle is started (`sdlc oracle up` passes its own
  # environment through to Compose); left unset, the oracle runs with the default, which
  # is what every other criterion is measured against.
  notifications_disabled:
    for: [R-6.1]
    select: SDLC_ORACLE_DISABLE_NOTIFICATIONS=1
    default: notifications on
    sets: DISABLE_NOTIFICATIONS=1 on the application (src/back-end/config.ts)
    observable:
      in_force: >-
        no message reaches the catcher for an action that sends one under the default —
        publishing an opportunity (opportunity-cwu-create.publish) — while the action
        itself reports success
    tag: "@notifications_disabled"
    notes:
      - A test for R-6.1 assumes the instance it runs against was started with
        notifications switched off, and does not skip itself on any signal from the
        environment. Nothing the service shows tells a test which configuration it is
        running against, so the test does not try to find out; run against an instance
        with notifications on, it fails, because the message it says must not be sent is
        sent.
      - Such a test carries the tag above, named after the configuration
        ("@notifications_disabled"), and that tag is how it is selected. It runs only
        against a separate instance started with SDLC_ORACLE_DISABLE_NOTIFICATIONS=1, in a
        run limited to that tag (Playwright's --grep @notifications_disabled). The default
        run, against the instance with notifications on, leaves every test with that tag
        out (--grep-invert @notifications_disabled), because the test clears the mail
        catcher and then acts, and doing so on the shared catcher would remove and add
        messages other tests are reading.
      - Every other criterion that expects a message is false on such an instance, so it
        is started for R-6.1 alone and never shared with the rest of the suite.

  service_page_absent:
    for: [R-7.29]
    select: SDLC_ORACLE_ABSENT_PAGE=sprint-with-us-opportunity-scope
    default: every page the service needs is present
    sets: >-
      the database setting sdlc.absent_page, read by tests/seed/017-absent-service-page.sql,
      which removes the page held at that address after the rest of the seed has restored
      it, at start-up and again on every reset. The application itself is started exactly
      as under the default.
    observable:
      in_force: >-
        GET {base_url}/api/content/sprint-with-us-opportunity-scope is answered as not
        found, and the published-page screen at /content/sprint-with-us-opportunity-scope
        shows the not-found screen
    tag: "@service_page_absent"
    notes:
      - The page a Sprint With Us opportunity's screen embeds as its scope section
        (surface.yaml, opportunity-swu-view.scope_section) is one the service needs. No
        screen and no request removes it (R-7.25), and the seed restores it on every
        reset, so its absence is a state only a separate instance can hold. The seeded
        Sprint With Us opportunities (tests/seed/manifest.yaml) are what a test opens on
        such an instance; nothing about them differs from the default.
      - The instance is started for R-7.29 alone. Every Sprint With Us opportunity reads
        the same page at the same address, so on this instance every one of them shows an
        empty scope section, and any criterion about that section's content is false here.
      - A test written for it carries the tag above, runs only against an instance started
        with SDLC_ORACLE_ABSENT_PAGE=sprint-with-us-opportunity-scope, and does not try to
        detect which instance it is on. It is left out of the default run, where the page
        is present and the scope section is not empty.
      - The variable takes any one service page's address, and the seed removes whichever
        page it names; this configuration names the scope page because that is the page
        R-7.29's clause is about.

files:
  # A stored file is reached at its own address, whatever page put it there. The
  # application decides on each request whether the requester may read it.
  via: http
  download: GET {base_url}/api/files/{fileId}?type=blob
  read_record: GET {base_url}/api/files/{fileId}
  upload: POST {base_url}/api/files
  upload_avatar: POST {base_url}/api/avatars
  observable:
    file_name: the name the response offers the file under
    content_type: the type the response declares, derived from the file's name
    disposition: whether the response offers the file as a download or displays it
    refusal: the status the application answers with when the requester may not read it
    file_identifier: the identifier the stored file is held at, from the description form
    stored_date: when the file was stored, from the description form
    stored_content_identifier: >-
      the identifier of the stored content, from the description form. Two uploads of
      identical bytes share it while remaining two records, so it is what tells storing
      once from storing twice.
  notes:
    - A file that no stored record carries and a file the requester may not read are
      answered differently, and which of the two a given requester sees is itself a
      thing the criteria turn on.
    - The description form names no uploader. The application records who stored a file
      and never returns it on this route, so who uploaded a file is not observable from
      outside however the request is made.

refusals:
  # Some criteria are not about whether a request is refused but about the form the
  # refusal takes: a refusal for lack of permission answered in the same form as one for
  # a malformed submission, or every request for a page refusing in one form rather than
  # in several. That is a property of the answer and of no screen, so it is read from the
  # answer the application returns rather than from the prose a screen shows.
  via: http
  observable:
    status: the status the application answers a refused request with
    shape: >-
      the form of the answered body — which fields it carries and how the reason is
      named — so that two refusals can be compared and not merely both be seen to happen
  surfaces:
    - content-request
    - user-list-request
    - organization-acting-for-list
    - affiliation-invitation-request
    - evaluation-individual-request-swu
    - evaluation-individual-request-twu
    - evaluation-panel-request
    - file-attach-by-identifier
  notes:
    - A screen reports a refusal as prose, which is evidence that one happened and not
      evidence of what form the answer took. A criterion comparing two refusals must
      read the answers themselves, through the request-level pages listed above.
    - The service's operational log, where some faults are written, is not observable.
      A criterion that says a fault is "recorded in the service's error log" can be
      tested for the fault and not for the record of it.

exports:
  # Two surfaces hand a test a document rather than a screen. Both are reached as
  # ordinary addresses and both answer with a file.
  via: http
  contact_list: GET {base_url}/api/contact-list?userTypes={types}&fields={fields}
  proposal_export: >-
    The export routes named in spec/contract/surface.yaml as proposal-cwu-export-one,
    proposal-cwu-export-all and their Sprint With Us and Team With Us equivalents,
    reached at the target's own base URL.
  observable:
    document_contents: the rows or text of the returned document
    document_name: the name the response offers the document under
    refusal: the status returned when the requester is not an administrator

scheduled_transitions:
  # The application has no scheduler. The transitions that look time-driven — an
  # opportunity closing when its proposal deadline passes, and the equivalents for the
  # other two programs — run as a hook in front of the resource routes under /api and in
  # front of /status, throttled by a configured interval.
  via: http
  trigger: GET {base_url}/status
  observable:
    opportunity_status: read back from the opportunity's own page or list entry
  notes:
    - The oracle sets the throttle interval to two seconds. There is one throttle per
      program (Code With Us, Sprint With Us, Team With Us), and each limits how often a run
      of that program's closing work STARTS. A request to the trigger starts a run at once
      if none has started in the last two seconds, and otherwise schedules one more start
      for when the two seconds are up. A request to any route under /api would do as well,
      since the hooks sit in front of those too; the trigger above is named because it
      needs no session and changes nothing else. Opening a screen does not run them — the
      authentication routes, the administrator routes and the screens carry no such hook.
    - The throttle spaces out starts; it does not serialize completions. Nothing waits for
      one run to finish before the next starts, so a run that takes longer than two
      seconds can overlap the next one, and nothing bounds how long a run takes. A burst of
      requests against the seeded lapsed opportunities has been seen to complete without
      the connection pool exhausting, which is evidence that the two-second spacing
      mitigates overlap in practice, not a guarantee that runs never overlap or that a
      closure always completes within seconds.
    - The hook starts the closing work and returns without waiting for it. The work has
      begun before the triggering request is answered, but may finish before or after the
      answer is sent; neither order is guaranteed. The trigger's answer therefore says
      nothing about whether the closure has happened, and a test must never read it that
      way.
    - A test that needs a closure follows this bounded procedure, and only this one —
      (1) request the trigger; (2) read the opportunity's status every 500 milliseconds;
      (3) if the status has not changed three seconds after the last trigger, request the
      trigger again, which is enough to be sure a fresh run starts after the throttle
      window; (4) stop as soon as the status reads the expected closed value, and continue
      with the test; (5) if thirty seconds pass after the first trigger without that value,
      FAIL the test, reporting the last status read, how many triggers were sent and what
      each answered. A timeout is a failure of the closure to be observed, never a reason to
      assume the closure happened, and a test must not go on to assert anything that
      depends on the closure after one. Thirty seconds is the test's own budget, chosen
      well above the closures seen on the oracle and well below the connection pool's
      sixty-second acquire timeout; it is not a figure the application promises.
    - The seed carries opportunities already standing at later stages. Those are not
      moved by this trigger; only a published opportunity whose deadline has passed is.

counters:
  # Views and watchers of an opportunity are counted, and the counts appear on the
  # opportunity's own reporting surface. They can also be read directly.
  via: http
  read: GET {base_url}/api/counters?counters={name}
  name_shape: "{resource-type}.{program}.{opportunity-id}.{counter-type}"
  observable:
    view_count: the number of times an opportunity has been opened
    watcher_count: the number of people watching an opportunity
  # Views are named opportunity.<program>.<opportunity-id>.views and are read through the
  # surface page opportunity-counters. The answer is an object from counter name to count;
  # a counter never incremented is absent from it and reads as 0. Only an administrator or
  # public sector staff may read counters.
  surface: opportunity-counters
