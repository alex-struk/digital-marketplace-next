  # ---------------------------------------------------------------- counters and metrics
  /api/counters:
    get:
      operationId: listCounters
      tags: [Counters]
      summary: Retrieves Counters for multiple resources.
      description: >-
        Return Counters for the specified resources. Counter names are of the form
        '<resource-type>.<resource-sub-type>.<resource-id>.<counter-type>'.
      parameters:
        - name: counters
          in: query
          required: false
          schema: { type: array, items: { type: string } }
      responses:
        "200": { description: Receive the array of Counters. }
        "400": { description: Invalid Counter names provided. }
        "401": { description: Insufficient permissions provided. }
        "503": { description: A database error has occurred or the Counter(s) are not retrievable. }

  /api/counters/{id}:
    put:
      operationId: incrementCounter
      tags: [Counters]
      summary: Increments an existing Counter.
      description: >-
        Recorded here as PUT because the framework registers every update route as PUT;
        the recovered description names POST.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Name of the Counter to increment.
      responses:
        "200": { description: Receive the incremented Counter. }
        "400": { description: An invalid Counter name was provided. }
        "503": { description: A database error has occurred or the Counter is not updatable. }

  /api/metrics:
    get:
      operationId: listMetrics
      tags: [Metrics]
      summary: Retrieves metrics related to various resources (e.g. Opportunities).
      responses:
        "200": { description: An array of metric objects. }

  # ---------------------------------------------------------------- notifications
  /api/emailNotifications:
    post:
      operationId: announceUpdatedTerms
      tags: [Email notifications]
      summary: Withdraws every vendor's acceptance of the terms and tells them so.
      description: >-
        Recovered from routes. Administrators only. The single action it accepts resets
        every vendor's acceptance of the terms and sends the announcement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TaggedRequestBody"
                - properties:
                    tag: { enum: [updateTerms] }
      responses:
        "200": { description: The announcement was accepted. }
        "400": { description: "The body was not understood, or the requester is not an administrator." }

  /admin/email-notification-reference:
    get:
      operationId: readEmailNotificationReference
      tags: [Email notifications]
      summary: Shows every message the service can send, rendered from sample data.
      description: Recovered from routes. Administrators only.
      responses:
        "200": { description: The reference page. }

components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The identifier of the resource.
    PathProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The proposal being evaluated.
    PathOpportunityId:
      name: opportunityId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The opportunity being evaluated.
    PathEvaluatorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The panel member whose scores these are.

  schemas:
    TaggedRequestBody:
      type: object
      description: >-
        Every update route takes one tagged action. The tag names which action, and the
        value carries whatever that action needs. Which tags a route accepts is listed on
        that route.
      required: [tag]
      properties:
        tag: { type: string }
        value:
          oneOf:
            - type: object
            - type: boolean
            - type: number
            - type: string
            - type: "null"
            - type: array
              items: {}

    CreateAffiliationRequestBody:
      type: object
      properties:
        userEmail: { type: string }
        organization: { type: string, format: uuid }
        membershipType: { type: string, enum: [MEMBER, OWNER, ADMIN] }

    CreateSubscriptionRequestBody:
      type: object
      required: [opportunity]
      properties:
        opportunity: { type: string, format: uuid }

    ContentBody:
      type: object
      description: Recovered from routes; the recovered descriptions say nothing about pages.
      properties:
        title: { type: string }
        slug: { type: string }
        body: { type: string }
        fixed: { type: boolean }

    FileUpload:
      type: object
      properties:
        name: { type: string }
        metadata:
          type: object
          description: Who may read the file once it is stored.
          properties:
            tag: { type: string, enum: [any, user, userType] }
            value: { type: string }
        file: { type: string, format: binary }

    Organization:
      type: object
      properties:
        legalName: { type: string }
        logoImageFile: { type: string, format: uuid }
        websiteUrl: { type: string }
        streetAddress1: { type: string }
        streetAddress2: { type: string }
        city: { type: string }
        region: { type: string }
        mailCode: { type: string }
        country: { type: string }
        contactName: { type: string }
        contactTitle: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
