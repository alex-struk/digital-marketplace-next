  - kind: missing-test
    item: R-2.27
    id: R-2.27
    version: 1
    domain: proposals
    stage: calibrate
    why: "blocked: the when is the last proposal still in contention being scored,
      which means carrying proposals all the way to evaluated. On the two seeded
      closed opportunities that is a single path — score every proponent's
      questions, agree those scores as a panel, finalise them, screen in, score
      the challenge and then the scenario — and the seed carries one closed
      opportunity per program. The first test to walk that path takes the
      opportunity with it, so the criteria behind the closure cannot each have
      one. Unblocked by seeding a closed opportunity for each criterion that has
      to move one, or by seeding opportunities already standing at the later
      evaluation stages."
    by: runner
