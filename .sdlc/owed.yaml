  - kind: missing-test
    item: R-1.35
    id: R-1.35
    version: 1
    domain: opportunities
    stage: derive-tests
    why: "blocked: every notice the criterion names — to the watchers, to the
      proponents and to the author — is sent as one announcement to a group, and
      the observables notes say such a message is addressed to one person with
      everyone else in blind copies. The criterion never says the author is sent
      a message of their own. The mail fixture only offers messagesTo, which
      searches by visible recipient, so being told cannot be distinguished from
      not being told for any of the three groups. The edit and the addendum
      themselves are reachable (opportunity-cwu-edit.edit_details and
      add_addendum on seed.opportunities.publishedCodeWithUs), and watchers and
      proponents could be arranged through toggle_watch and the proposal create
      pages. What unblocks it: a `mail` accessor over observables.yaml's
      read_one_message that returns one message's To and Bcc
      (copied_recipients), or a listing of every message in the catcher, plus
      the service's own sending address named in the contract, so the
      announcement can be found and its blind copies counted."
    by: runner
    at: 2026-09-25T07:55:52.736Z
    readdressed:
      - from: contract
        to: derive-tests
        why: caught-message.visible_recipients and copied_recipients, observables
          email.configured_sender_address
        by: contract-v4
        gate: G1
        approved_by: agent:product-owner
        at: 2026-09-25T08:16:31.008Z
