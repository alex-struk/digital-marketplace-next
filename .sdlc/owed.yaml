    item: R-2.29
    id: R-2.29
    version: 1
    domain: proposals
    stage: derive-tests
    why: "blocked: two things are missing. The ranking and the cut need the panel's
      agreed scores finalised, which consumes the one seeded closed opportunity
      of that program (see R-2.27). And the criterion describes six proponents
      of whom five clear every minimum and four go forward; the seed carries
      three per opportunity and says so itself. The size of the cut therefore
      cannot be shown even once, and the half that three proponents could show —
      one below a question's minimum score being left behind — needs the same
      finalisation. Unblocked by a closed opportunity of its own carrying six
