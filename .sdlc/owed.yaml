  - kind: missing-test
    item: R-2.15
    id: R-2.15
    version: 2
    domain: proposals
    stage: derive-tests
    why: "blocked: the Code With Us half needs a published Code With Us opportunity
      whose proposal deadline has passed, and there is none. The one seeded Code
      With Us opportunity is open until 2030, and the create form refuses a
      deadline earlier than the day it is filled in, so the refusal the
      criterion quotes — \"This opportunity is no longer accepting proposals.\"
      — has nothing to be raised against. The half that holds in all three
      programs needs a draft proposal against an opportunity already past its
      deadline: the two seeded closed opportunities are past theirs, but every
      vendor who could bid on one has already bid and every qualified
      organization is already named on a proposal of its own, so no draft can be
      added, and the deadline hook sits in front of the service's own routes so
      the state before the closure cannot be held still. Unblocked by seeding a
      Code With Us opportunity past its proposal deadline, and a draft proposal
      against a closed opportunity."
    by: runner
    at: 2026-09-25T07:55:52.736Z
    readdressed:
      - from: contract
        to: derive-tests
        why: seed.opportunities.cwuLapsedWithDraft with
          proposals.cwuLapsedWithDraftDraft
        by: contract-v4
        gate: G1
        approved_by: agent:product-owner
        at: 2026-09-25T08:16:31.008Z
  - kind: missing-test
    item: R-2.26
    id: R-2.26
    version: 1
    domain: proposals
    stage: derive-tests
    why: "blocked: the given is a Code With Us proposal under review, and a proposal
      reaches review only when its opportunity closes. The closure itself is now
      reachable — run_pending_transitions on scheduled-transition-trigger runs
      the deadline hook — but only the Sprint With Us and Team With Us
      opportunities are seeded past their deadlines. No Code With Us opportunity
      can be given a deadline in the past, so enter_score on proposal-cwu-view
      has no proposal to act on, and neither the score, the move to evaluated
      nor the refusal of an out-of-range score has anything to be read on.
      Unblocked by seeding a Code With Us opportunity past its proposal deadline
      carrying a submitted proposal."
    by: runner
