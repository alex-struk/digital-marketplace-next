  - ref: derive-tests-opportunities-5#2
    text: "R-1.35: the two tests each call arrangeWatcherAndProponent
      (tests/acceptance/opportunities/R-1.35.spec.ts:53) on
      seed.opportunities.publishedCodeWithUs, a record loaded once and never
      reset. toggleWatch as persona.competingVendor (line 70) is a toggle, so
      the second test's call turns the watch off again. Its poll that the
      watcher count exceeds the earlier count (line 76) then fails on a correct
      application, and persona.vendor submitting a second proposal to the same
      opportunity puts the proposal-count poll (line 77) at the same risk. Set
      up the watcher and the proponent once: for example, one test that sets
      them up and then makes the details change and adds the addendum in turn,
      clearing the mail catcher before each and checking all three people are
      reached after each."
    from: derive-tests-opportunities-5
    family: derive-tests-opportunities
    gate: G3
    stage: derive-tests
    by: agent:reviewer
    at: 2026-09-25T10:26:50.699Z
    closed:
      outcome: met
      why: tests/acceptance/opportunities/R-1.35.spec.ts is now a single test.
        arrangeWatcherAndProponent runs once, then the catcher is cleared before
        the details change and before the addendum, and expectEachReached checks
        the watcher, the proponent and the author after each, so nothing in the
        file toggles the watch twice or submits twice.
      by: agent:reviewer
      at: 2026-09-25T10:29:02.501Z
  - ref: derive-tests-opportunities-6#2
    text: "R-1.35: tests/acceptance/opportunities/R-1.35.spec.ts, lines 61-68, has
      persona.vendor submit a proposal against
      seed.opportunities.publishedCodeWithUs and then polls that the reported
      proposal count exceeds the earlier reading (line 79).
      tests/acceptance/opportunities/R-1.31.spec.ts, lines 19-26, has the same
      persona submit against the same record, which is loaded once and never
      reset, and a vendor holds at most one proposal per opportunity. When
      R-1.31 runs first, R-1.35's submission adds nothing and the poll fails on
      a correct application. Establish the proponent so it holds in either
      order: for example, submit as a persona no other spec submits with against
      this record, or accept that persona.vendor's proposal may already exist
      and establish that a submitted proposal from them is there rather than
      that the count went up."
    from: derive-tests-opportunities-6
    family: derive-tests-opportunities
    gate: G3
    stage: derive-tests
    by: agent:reviewer
    at: 2026-09-25T10:29:02.491Z
    closed:
