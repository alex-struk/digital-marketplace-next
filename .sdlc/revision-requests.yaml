requests:
  - stage: derive-tests
    why: "the content domain's test for R-7.17 asserts that the rendered page body
      matches no angle bracket. The criterion says a body's embedded markup is
      never executed; it does not say a body may not show an angle bracket, so a
      page whose wording legitimately contains 'a < b', rendered as text and
      never executed, meets the criterion and fails the test. The page the test
      reads is the seed's ordinary page, whose wording contains no markup at
      all, so the assertion also establishes nothing about the clause it stands
      in for — it would pass unchanged against an application that executed
      embedded markup. Replace it with an assertion that follows from what the
      criterion states, or record the never-executed clause as not testable,
      which the test's own note already argues: the surface hands back the
      rendered body as text, so an executed body and a stripped one come back
      alike."
    from: build-slice-1-3
