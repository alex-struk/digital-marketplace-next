rationale: |2-
  The question was which of 20 criteria failing against the old application are the application's fault, the spec's, or the test's. Ruling: approve, with spec-wrong on one and test-wrong on nineteen, and no defect-in-old this round. I read each failure against its test, the saved page snapshot, the adapter's reported error and the old source. SPEC WRONG. R-5.18: the service returns panel membership to administrators, the owner and panel members (db sprint-with-us.ts:897-942), but the only screen that lists the panel is opened only for an administrator or the opportunity's owner in both programs (sprint-with-us edit/tab/index.ts:181-182, team-with-us edit/tab/index.tsx:172-173). Anyone else is sent to 'Not Found' (edit/index.tsx:216-222), which is exactly what the panel member saw. Nothing suggests a bug: that screen is for managing the panel. TEST WRONG, target data. Eight failures trace to reference data that the old application's own migrations insert and this target appears not to hold. Every Team With Us opportunity validates each resource's service area against the service-areas table, even as a draft (team-with-us/index.ts:320-328, validation.ts:190-211, 264), and that table is filled by migration 20230315112325. Four things on this target point the same way. First, every Team With Us draft save stayed on /create with no message, including the ones with a full panel and resource (R-1.53, R-1.56); an invalid draft shows only a passing error toast (create.tsx:264-276). Second, the administrator's service-area approval was refused and every box reset (twu-qualification.tsx:177-190), and the seeded qualified organization shows no badge (R-3.26). Third, the seeded closed Team With Us opportunity cannot be read (R-1.24). Fourth, the pages the service needs, which migration 20201202094826 creates, answer 'Not Found' at /content/about, /disclaimer and /accessibility (R-7.12, R-7.25, R-7.27). The seed relies on those migrations and adds only one ordinary page (tests/seed/003-content.sql:1-8). I could not confirm this in the databases, because the read-only row counts needed an approval not available in this session, so the cause is inferred, not observed. R-1.8, R-1.13 and R-1.48 fail only their Team With Us part for this reason. The tests are told to confirm their given and report blocked rather than failed, following the precedent set for R-4.5. R-7.27's second half also needs a second administrator sign-in, which this target lacks. TEST WRONG, test logic. R-1.21: a new Code With Us opportunity's location starts as 'Victoria' (form.tsx:175), so the 'incomplete' draft was complete and was rightly accepted for review. R-5.17: the service does notify only newly added members, and only after draft (notifications sprint-with-us.tsx:147-170). It addresses them as hidden recipients (Bcc, to MAILER_REPLY, sprint-with-us.tsx:600-605), and the mail fixture searches only 'to:' (tests/fixtures/mail.ts:17-18). R-1.18: the allocation chooser offers only 10 to 100 in tens (resources.tsx:137-148), and the service-area chooser offers only recognised areas. So 101 and 'Lighthouse Keeper' could not be chosen, and 0 matched a different option by substring. R-1.10 and R-2.14: publication or submission was withheld with its control unavailable, and the tests again required a reason shown rather than the refusal the criterion promises; the old teaser field does validate against 500 (form.tsx:164, utility.ts:98-99). R-1.56's Sprint With Us draft was still a draft when its author changed it, so the rule on published opportunities was never exercised. R-1.53's four staff tests stop at the permissions-label precondition already ruled wrong for R-1.3. R-7.22: the service refuses a taken slug (content.ts:158-161) and the create screen puts that reason on the slug field (create.tsx:148-151, form.tsx:63), but the snapshot shows the form untouched with no outcome at all, so the creation was never shown to have been sent. R-5.1, R-5.9 and R-1.55: removing the creator leaves them selected in the separate Panel Chair field, which counts as the chair (swu-evaluation-panel.tsx:301-311, snapshot shows Chair Casey). So the 'no chair' panels still had a chair. New drafts held a second member, so 'add one, remove creator' left two. Marking another chair moves the chair (swu-evaluation-panel.tsx:230-241), so R-5.1's two-chair case saved a valid, different panel and wrongly required it unchanged; R-1.55's version of that case already reads it correctly. Why no defect-in-old: two old defects are confirmed in code but still unreached by a sound test. A duplicate member is refused, but the service's panel-level reason is dropped on screen (setErrors maps only user and chair errors, swu-evaluation-panel.tsx:316-336; the reason is at validation.ts:949-958). The service checks for more than one chair but never for none (validation.ts:938-947). Ruling defect-in-old now would freeze tests that build the wrong panel as the rebuild's obligation. Caveats for the oracle and adapter owners, which re-deriving tests cannot fix: check that the oracle's reseed keeps migration-inserted rows (service areas, fixed content), for example by counting 'serviceAreas' and fixed content rows. The mail fixture needs a way to read Bcc recipients. The adapter's required-field auto-fill appears to add an unrequested second panel member. Choosing an option by substring picks the wrong value silently. Saving a draft should report a toast it misses. What would change this ruling: a redone R-5.1 or R-1.55 that fails only because a duplicate member's rule is not named would make them defect-in-old. So would a redone R-5.9 or R-1.55 that shows a panel with no chair accepted. Database counts showing the service areas and fixed pages present on the target would bring the eight target-data criteria back as product questions. A screen that shows a panel member the panel's membership would withdraw the R-5.18 correction. Evidence that the old create screen shows no reason for a taken slug after a confirmed submission would make R-7.22 defect-in-old.
conditions:
  - "spec-wrong R-5.18: The membership of an evaluation panel is returned by the service only to an administrator, the opportunity's owner and the people on the panel itself; the screen that lists and manages the panel opens only for an administrator or the opportunity's owner, and answers \"Not Found\" to anyone else who asks for it, a panel member included."
  - "test-wrong R-5.1: the panel of one was never assembled, because the draft's panel already held a second member, so adding one person and removing the creator left two; and marking another member as chair moves the chair, so the two-chairs case saved a different panel with one chair, which the test wrongly required to be unchanged; establish the panel's membership before reducing it to exactly one, count a chair that moves rather than doubles as the second chair being refused, and keep requiring the rule to be named when the same person is named twice"
  - "test-wrong R-5.9: the person removed from the panel stayed named as its chair, so the panel put forward still had a chair and was rightly accepted; establish that the panel put forward names nobody as chair before reading whether it is refused, and if no available action can put such a panel forward, record the criterion as blocked until one can reach the service"
  - "test-wrong R-1.55: in the no-chair cases the person removed stayed named as chair, so the panel put forward still had one, and in the fewer-than-two case the panel already held a second member, so it still had two; establish that each panel is exactly the faulty panel its case names before reading its refusal, keep requiring the reason when the same person is named twice, and where the Team With Us draft a case depends on was never stored, record that case as blocked rather than failed"
  - "test-wrong R-1.8: the Team With Us case failed at its given, because the draft it saves was never stored on this target, for a reason the criterion does not govern; establish that the draft was stored before reading which program it belongs to, and record the case as blocked rather than failed when it was not"
  - "test-wrong R-1.13: the Team With Us opportunity was never published, so its absence from the list says nothing about a budget limit; establish that it was published with its budget before reading the list, and record the case as blocked rather than failed when the target would not store it"
  - "test-wrong R-1.48: the Team With Us draft was never stored on this target, for a reason the criterion does not govern, so the test says nothing about who may create one; establish that each draft was stored before reading its state, and record the Team With Us case as blocked rather than failed when it was not"
  - "test-wrong R-1.53: four tests stop at setup by requiring a statement of permissions that an ordinary staff member's profile does not carry, so establish the lack of administrator rights from something every staff account shows; the administrator's draft test stops at a Team With Us draft that was never stored, so establish that each draft was stored before asking to delete it, and record the Team With Us part as blocked rather than failed when it was not"
  - "test-wrong R-1.56: in the Sprint With Us case the administrator's publication did not take effect and the opportunity was still a draft when its author changed it, which the criterion permits; confirm the opportunity reads as published before its author tries, and in the Team With Us case, where the draft was never stored, record the case as blocked rather than failed"
  - "test-wrong R-1.10: publication of the over-length teaser was withheld, with the publish control left unavailable, and the test demanded a reason it could not find on the step the form was left on; look for the reason against the teaser where it is entered, allowing time for it, treat a publication that stays unavailable as the refusal, and check that nothing was published"
  - "test-wrong R-2.14: the criterion promises that the submission is refused and each offending field named in the service's reply, and for a blank field the submission was simply withheld with nothing shown, which the test read at once as a failure; treat a submission that stays unavailable as the refusal and check that no proposal was submitted, allow time for a reason where a malformed value was typed, and treat an archived organization that is not offered as a choice as refused"
  - "test-wrong R-1.18: the target allocation and the service area are each chosen from a list that offers nothing outside the criterion's bounds, so the out-of-range values were never put forward, and in the below-one case a different, valid allocation was taken in its place; treat a value that is not offered as refused, confirm that the value chosen is the one the case names before publishing, and record a case as blocked rather than failed when the target will not store the Team With Us opportunity"
  - "test-wrong R-1.21: the draft was not incomplete, because a new opportunity's location starts filled in, so leaving the location out left a location in place and the submission was rightly accepted for review; empty the location explicitly, confirm the saved draft shows it blank, then submit it and read what the author is told"
  - "test-wrong R-5.17: the notice to a person added to a panel reaches them as a hidden recipient, and the test searched only the addressees each message shows, so it would find nothing for anyone; read every recipient each message was delivered to, for the person added and for the two already on the panel alike"
  - "test-wrong R-7.22: in the creation case nothing shows that the new page was ever put forward: the screen stayed exactly as filled in, with no outcome of any kind, neither a created page nor a refusal; establish that the creation was submitted before reading whether the address was reported, and read the report against the address field where it is entered"
  - "test-wrong R-1.24: in the Team With Us case the given was established only from the address the administrator opened, which reads the same whether or not the opportunity can be read; establish it from the opportunity's own title and status before closure, and record the case as blocked rather than failed when the opportunity cannot be read"
  - "test-wrong R-7.12: the test established that this installation carries none of the pages the service needs and then reported that as a failure of the criterion; a given that does not hold makes the result blocked, not failed, so record it as blocked until the target carries those pages"
  - "test-wrong R-7.25: the test established that the page it needs, one the service depends on, does not answer on this installation and then reported that as a failure of the criterion; a given that does not hold makes the result blocked, not failed, so record it as blocked until the target carries that page"
  - "test-wrong R-7.27: the first test stopped at its given, a page the service created for itself, which this installation does not carry; the second needs a second administrator to act as, and this target signs in only one; record both as blocked rather than failed until the target carries the page and a second administrator can sign in"
  - "test-wrong R-3.26: the first test does not establish that the seeded organization holds its service-area approval and accepted terms before reading its badge, and on this target it holds no approval; the second does not confirm that the administrator's approval was recorded before reading the requirements, and every approval box was clear after the save; establish both before reading, and record the test as blocked rather than failed when the approval cannot be recorded"
