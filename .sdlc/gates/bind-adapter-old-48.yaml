    7. on proposal-swu-create's '2. Team' for a two-phase opportunity (Proof of Concept and Implementation), the adapter pressed 'Proof of Concept', which opened with its 'Add Team Member(s)' visible, and never pressed 'Implementation', which stayed folded as a bare name. All five tests timed out there. Decide whether each phase is open from its own container, which holds only the name when folded and the name plus 'Phase Dates' when open, not from screen bands that the opening of an earlier phase shifts. Press each folded name once and wait for its container to show 'Phase Dates' before moving on.
