rationale: |2-
  The question is whether this is what the files domain does and which of it is the contract, and the ruling is approve. The recovery is honest and the citations hold up under direct reading: the permission chain in permissions.ts:326-341 and db/file.ts:124-164 is exactly as described, the counts reconcile (24 criteria, 6/17/1 by confidence, 15/1/1/7 by reconciliation), and the proposal states its gaps rather than filling them with guesses. I confirmed five criteria and named what tipped each. D-files-1, because createFile is isSignedIn and the resource consults nothing else, so the code leaves no other reading. D-files-7, because hashFile takes the name as an unused parameter and hashes bytes alone, the blob is reused under its hash and the file row carries its own permission rows, so the whole dedup chain is visible with no other reading available. D-files-23, because the README documents TMP_DIR as a second source and I read the write at adapters.ts:173 against the unlinkSync placed after respond, which pins the claim that only the success path cleans up. D-files-15 I confirmed rather than leaving open, and this is the one place I depart from the archaeology: the two sources are not in conflict as behaviour. resources/file.ts:62 gates on permission before it looks the file up and permissions.ts:336 short-circuits for administrators, so a non-administrator is answered identically whether the file is absent or merely forbidden, which is a coherent and defensible design; the published interface description is simply incomplete, documenting only the administrator's path. The administrator exception is not a leak to people who least need it hidden but disclosure to a role that is already trusted with the file itself. Six criteria I ruled as defects with replacements, four of them ones the archaeology deliberately left to this gate. D-files-11 and D-files-12 are two halves of one rule and are answered together: attachments should record no read access at upload for all three programs alike, and one association rule covering all three programs should decide who may read them. The archaeology declined to write these because whether to carry three rules or one is a design decision, and it is right that it is a decision, which is why it is mine and not its. D-files-5 and D-files-6 both report a caller's mistake as a fault of the service, and although the archaeology reasoned they want different answers they want only different messages: both are bad requests, neither belongs in the service's error log. D-files-19 conflates two decisions and I have separated them, refusing content that cannot be read as a JPEG or PNG while continuing to tolerate a resize that fails on an image that read successfully. D-files-22 has a clean rule the archaeology's own objection does not defeat: require that the attacher may read the file, which the shared-file case passes precisely when the sharing was real. D-files-16 is the one I did not decide. Whether an attachment survives the deletion of what it hung on, and what removes stored content no record refers to, turns on a records-retention rule for procurement attachments that exists in neither source, and inventing one here would be steering dressed as archaeology. It is spiked with that question recorded. Every criterion not named below is contracted as it stands, which leaves the seventeen still inferred outside the contract for the follow-up loop to close, as intended. Two notes for the stages downstream rather than conditions on this ruling: the surface entry file-download carries a not_found_for_administrator observation, which my confirmation of D-files-15 leaves correct as written; and the 10 megabyte figure is left at 10 megabytes by D-files-5's replacement, since making the refusal honest and making the limit visible are the defects, and changing the number is a separate decision nobody has evidence for. What would change this ruling is evidence that the SWU and TWU public marking is deliberate rather than inherited, or a retention rule that settles D-files-16, either of which would reopen the criteria concerned.
