rationale: |2-
  The question is whether this is what the proposals domain does and which of it is the contract. Approve: the recovery is accurate where I could check it, and honestly graded. I verified roughly a dozen citations against sources/old at the pinned commit — permissions.ts 421/440/444/486/515/532/568/766/821/830/1300/1358/1367, the CWU create and delete paths at code-with-us.ts:296-393 and :930-946, the SWU organization-change guard at index.ts:683, the shared validators for proposal text, disqualification reason and score, SWU_CODE_CHALLENGE_SCREEN_IN_COUNT=4 and TWU=3, the anonymous-proponent loop at db/opportunity/sprint-with-us.ts:1488-1505 and the question-minimum filter at :1896-1930 — and every line landed where the criterion said. Thirty-three criteria stay as archaeology graded them: re-reading the same code is not a second witness, so inferred stays inferred and the follow-up round decides them. Five I am promoting, each for a stated reason rather than to keep things moving. D-proposals-36 is confirmed as a defect because a repository-wide search finds validateTWUProposalProposedCost exactly once — its own definition at validation/proposal/team-with-us.ts:147 — while validateSWUProposalProposedCost is called three times, at resources/proposal/sprint-with-us/index.ts:440, 827 and 925; that is not a reading of the code, it is a count, and it leaves no other explanation than an uncalled rule. The product ruling is that the new system enforces the ceiling, on create and on edit, as Sprint With Us already does. D-proposals-31 is confirmed as a defect on the same footing: readCWUProposalHistory grants admin and opportunity author only, while readSWUProposalHistory and readTWUProposalHistory are the same rule plus a proposal-author-or-org-admin clause — one missing disjunct in three otherwise identical rules — and the ruling is that a vendor reads the history of their own proposal in all three programs, since withholding it from Code With Us alone serves no purpose anyone recorded. D-proposals-35 does not need the application run to be decided: the migration that deprecated the stage says so in its own comment, 'Unused status; deprecate', and only two migrations in the whole history touch swuProposalStatuses_status_check — the 2020 one and the 2024 one that dropped the old spelling — so nothing restores it, and the live path moves proposals straight from question review to the code challenge. Whether or not the old code's offered move would now fail at the check constraint, the new system carries no stage between reviewing team questions and the code challenge, so I am marking it obsolete with that reason rather than leaving a question that can only be answered by exercising a dead path. D-proposals-34 is reworded rather than dropped: as written it is a finding about the old repository's stale OpenAPI documents, not a behaviour, but the strongest of its three disagreements is a real rule, and validateCWUProposalStatus, validateCreateSWUProposalStatus and validateCreateTWUProposalStatus independently fix the same two-value list, so the create-state rule is confirmed across all three programs; the other two disagreements it recorded are already carried as behaviour by D-proposals-17 and D-proposals-23, and the standing position for this rebuild is that the running service is the oracle and those documents are not a source where they conflict with it. D-proposals-37 is obsolete: an address rendering only the words 'Proposal List' is an unfinished stub rather than behaviour, D-proposals-18 already states where a vendor sees their proposals, and the proposal-list-stub entry in surface.yaml should be removed with it. Two things I am noting without returning the proposal: D-proposals-17 is graded confirmed partly on the same interface documents D-proposals-34 flags as stale on exactly the delete precondition, though the code at code-with-us.ts:930 and its two siblings is unambiguous enough to carry the grade on its own; and the sign-in fixtures named for the two new personas, vendor-org-admin-1 and gov-panel-1, do not exist in tests/seed yet and the stage that builds the seed data owns creating them. What would change this ruling: a citation that does not resolve at the pinned commit, or evidence that the Team With Us cost rule is called somewhere I did not search.
conditions:
  - "defect D-proposals-31: A vendor may read the history of a proposal they authored, or of a proposal belonging to an organization they own or administer, in all three programs."
  - "defect D-proposals-36: A Team With Us proposal is refused when the hourly rates it names, applied at each resource's target allocation across the opportunity's contract period, come to more than the opportunity's maximum budget; the check runs on both the create and the edit path, as the equivalent Sprint With Us check does."
  - "edit D-proposals-34: A proposal may be created only as a draft or as a submission, in all three programs; any other state is refused."
  - "obsolete D-proposals-35: The stage between reviewing team questions and the code challenge is deprecated in the old system by its own migration, which comments 'Unused status; deprecate', rewrites every stored occurrence and narrows the permitted values so the old spelling can no longer be stored; only two migrations ever touch that constraint and neither restores it, and the live path moves proposals straight from question review to the code challenge. The new system carries no stage between them."
  - "obsolete D-proposals-37: An address that renders nothing but the words 'Proposal List' is an unfinished stub rather than behaviour to carry forward. A vendor reaches their own and their organizations' proposals from the dashboard, which D-proposals-18 already states; the proposal-list-stub entry in spec/contract/surface.yaml is removed with it."
