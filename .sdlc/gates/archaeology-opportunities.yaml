rationale: |2-
  The recovery is grounded and honest: counts in the journal match the artifact exactly (51 criteria, 6 confirmed / 40 inferred / 5 open; 43 implemented-only, 4 conflicting, 3 defect, 1 documented-only), and every citation I spot-checked against sources/old landed on the line claimed, including the two most consequential — the Code With Us create-as-published hole at code-with-us.ts:394 and the Team With Us processing/award contradiction at team-with-us.ts:483. My brief refuses criteria still marked inferred or open; I read that as binding at ratification and downstream contract use rather than on the recovery artifact, because spec/README.md — approved by a human at G-POL — states that a criterion never ratifies while inferred or open, and so provides for those grades existing in a domain file first. Requiring all 51 confirmed would force confidence to be borrowed from documentation the proposal demonstrates has structurally drifted (README naming two programs, schema document with no Team With Us tables, no interface description for that program), which is the unlisted-assumption-as-fact the same brief refuses. Open questions are listed rather than guessed, and each conflict and defect names what disagrees with what. Not escalating: tier is STANDARD, the stage reported no confidence shortfall, and the ambiguous readings are per-criterion with an existing mechanism for human rulings — escalating the whole gate on five of fifty-one items would defeat sampling. The ruling would change if any inferred criterion were promoted to confirmed without a second witness, or if the conflicts and defects reached the rebuild by default instead of by ruling.
