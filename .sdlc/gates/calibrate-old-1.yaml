rationale: |2-
  The question is whether each of the 40 listed failures (of 173) is the old application's fault, the criterion's or the test's. Ruling: return, with no criterion ruled, because almost none of the failures is any of those three. They come from the old-target adapter, the layer that turns a test's steps into actions and reads against localhost:3000. None of the three calibration verbs describes an adapter fault. Ruling defect-in-old would make adapter bugs obligations for the rebuild, and ruling test-wrong would send sound tests back for a blind rewrite that hits the same adapter. The evidence: (1) contentView.pageTitle is bound to the browser tab title (tests/adapters/old/index.ts:2714), which the old app suffixes with ' — B.C. Digital Marketplace', so R-7.1, R-7.4 and the signed-out case of R-7.10 compare 'About us' with 'About us — B.C. Digital Marketplace' while the tests are correct. (2) The adapter reports 'no control labelled' for 'Save Draft', 'Deactivate Account' and 'Add Team Member(s)', yet all three are rendered by the old source (opportunity/code-with-us/create.tsx, user/profile/tab/profile.tsx, which hides deactivation only when an administrator views their own profile, and organization/edit/tab/team.tsx). Save Draft is missing even for public sector staff (R-1.8), who are allowed to use it. The same lookup fault causes R-1.7, R-3.7, R-3.8, R-3.9, R-4.5, R-4.9 and R-6.10, and the missing opportunity id in R-5.1, R-5.9 and R-1.9. For R-1.7 the adapter throws where the application may have refused the visitor, which is the outcome the criterion expects. (3) Reads return the wrong shape or nothing: organizationList.organizationName returns only the first row (R-3.1), opportunityList.unpublishedGroup returns a count '36' instead of titles (R-1.3), and saveDraft leaves drafts 'Untitled', so the title is never entered (R-1.3, R-1.9). fileUpload.storedFileIdentifier yields no id (R-8.7, R-8.10), and the Sprint With Us and Team With Us create flows never reach the panel step (R-2.10, R-2.11). (4) About twenty failures are bare 120-second timeouts with no trace (R-2.1, R-2.2, R-2.3, R-2.4, R-2.7, R-2.9, R-3.2, R-3.6, R-3.10, R-5.3, R-5.10, R-1.4, R-1.10, R-1.11, R-7.9 and part of R-7.10), which cannot be attributed to anyone. What to redo before this is asked again: fix the bindings in (1) to (3) and re-verify each one against a signed-in session that is allowed the action. Capture a Playwright trace for every timeout so the step that hung is known. Move R-4.3 to not-testable or add a seed account with an unfinished profile, because the target cannot produce its precondition. Retire the tests for superseded criteria (R-6.10 by R-6.16, plus R-8.14, R-6.14, R-6.22 and R-6.26 flagged by the checks) instead of calibrating them. Then re-run calibrate. What would change the ruling: a re-run where the failures land on the asserted observation, not on an unbound action or a timeout. At that point R-7.8 (updated date unchanged after publishing), R-4.4 (empty sign-in failure notice), R-7.7, R-5.9, R-5.10 and R-2.10 are the likeliest candidates for defect-in-old and should be looked at first.
