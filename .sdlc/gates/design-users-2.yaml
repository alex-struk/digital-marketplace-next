rationale: |2-
  The question is whether the fourteen users-domain screens serve the users criteria and are built from the design system, taking into account agent:ux-reviewer's escalation, which gave three unmet conditions. Ruling: approve. Conditions one and two are now met by evidence committed after the escalation. design/report.json (generated 15:30, after the 14:31 escalation) records a passing typecheck and build of the catalogue. A typecheck would fail on a wrong design-system prop or import, so that question is settled. It also records an axe 4.13.0 scan of all 54 stories, one for each of the 54 states in screens.yaml, with 0 violations and 0 failures. Condition three was for me to rule on. I searched the users stories for raw markup, and the only real stand-ins for design-system components are the three the proposal names. The other spans only carry test IDs, and the lists are ordinary semantic HTML. I approve all three as project-specific adaptations limited to this domain. (1) The profile section navigation is a labelled list of links with aria-current. Each section has its own route, so link navigation is the correct pattern and not a stand-in for tabs. (2) The status badge is styled only with design tokens and always shows its status as a word, never colour alone. (3) The user table is a native table with a caption, scope=col headers and a scroll region the keyboard can reach. That is the right markup, and DESIGN.md names it as the one horizontal-scroll exception. Nothing here touches a platform article, removes a gate or enables a rung. The tier is STANDARD, and the surface.yaml change only replaces null test IDs for this domain. What would change this ruling: a design-system release that adds a tabs, table or badge component these adaptations should use, evidence that report.json was not produced from the committed catalogue (its catalogue hash does not match), or a manual check finding a keyboard or screen-reader failure the automated scan cannot detect.
conditions:
  - "The three non-design-system patterns (the profile section link navigation, the token-only status badge, and the native user table in a scroll region) are approved for the users domain only. Any other domain that reuses them needs its own ruling, and each one is replaced if the design system releases an equivalent component."
  - "Gap 10 in design/DESIGN.md (the design system not checked) must be updated to match design/report.json before build: state the verified package version and that the typecheck passed, rather than calling the props and tokens unchecked."
  - "The manual checks DESIGN.md lists as still required (keyboard-only use, screen-reader smoke tests of the dialogs and the error summary, and reflow at 320 CSS pixels and 400% zoom) remain conditions for accepting the build. A clean axe run does not replace them."
  - "The spec gaps DESIGN.md records (a search that matches nobody, what a refused user list shows, failures of immediate saves, the prompt to agree before continuing after a terms change in R-4.16, and whether public sector employees are admitted to profile completion under R-4.23) go to the spec stage and are not filled in the build."
