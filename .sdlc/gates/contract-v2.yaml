rationale: |2-
  The question is whether this is the contract the tests will act through, and it is, once one derived artifact is rebuilt from it. I checked the load-bearing claims against the old application at b0f0c99 rather than against the journal: sources/old/src/back-end/index.ts:195-201 adds the three opportunity hooks to the resource routes after they are namespaced under /api and :258-263 adds them again to the status router, while the authentication, admin and front-end routers are concatenated outside that call, so the narrowed wording in observables.yaml and in the /status description is correct and the earlier over-generalisation is closed; shared/lib/resources/user.ts:6 defines VIEWER_USER_ROUTE_PARAM as "me" and the profile page resolves it to the viewer, so the five parameterless self entries describe something the application really does; and the code-with-us edit tab parser accepts only summary, opportunity, addenda, proposals and history, so the previous file-attachment-control route at ?tab=attachments addressed a screen that does not exist and ?tab=opportunity is the correction. The three artifact defects the previous ruling recorded without conditions are all closed in this diff. The central fix is the right one and is in the right place: a contract that named route parameters without saying where a value comes from left the tests to invent a convention, and they invented substituting a title into an address, which is the largest single cause of the recorded failing run; stating the four sources in the surface header and giving every landing screen an observation that returns its own identifier settles it in the contract instead of in the tests, which is where it belongs. The failing `generated` check is real and I measured it — tests/generated/surface.d.ts carries 79 pages against the contract's 88 and contains no identifier observation at all — but those files were last written by a derive-tests run, so regenerating them is the next stage's mechanical step and not a defect in the recovered contract. It is nevertheless load-bearing, because the entire value of this run reaches the tests only through that file: derive-tests must regenerate before it writes anything, or it will write blind against the stale surface and reproduce the defect this run exists to remove. Two limitations are reported honestly rather than papered over and neither is grounds for return. The whole evaluation domain has no given-clause a test can arrange, because an opportunity closes only when its deadline passes and the form refuses a deadline earlier than four in the afternoon on the filling-in day, so a seeded past-deadline Sprint With Us and Team With Us opportunity with submitted proposals and a panel is what those criteria need and it was not written; the stage could not run a database to write it safely, and returning the proposal would meet the same block again, so those criteria must report unbound and be ruled at calibration rather than skipped, exactly as the identity limits recorded at the previous gate are. The oracle assertions are graded correctly as inference from a log and a prior run rather than asserted as direct verification, which is the honest grading. What would change this ruling to return is evidence that a recovered route, persona or observation misdescribes the application in a way the seed cannot compensate for, or a decision to run derive-tests without regenerating tests/generated from this contract first.
