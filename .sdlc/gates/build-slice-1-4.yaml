rationale: |2-
  The question was whether slice 1 (a visitor can read the service's own pages) does what its criteria say, on a verify result of pass-unasserted: six of the eight criteria it claims pass, none failed, and R-7.12 and R-7.17 were never put to the application. Return. An approval is refused on any result but a current pass, and R-7.17 is the one criterion here whose failure would be a defect rather than a shortfall — a page body that executes the markup embedded in it — so nothing established in either direction is the wrong receipt for it. None of that is a fault in the code: bodies are rendered through a parser that emits a node tree with no node for raw markup and refuses javascript:, data: and protocol-relative link targets, and app/frontend/tests/formatted-text.test.tsx puts a script, a <b>, an <img onerror> and a javascript: link through the renderer and checks each comes back as the text it is; the rest of the receipt is in order, with six criteria exercised against a live service, check green across three workspaces, no credential or personal datum in the code or its logs, and the browser and container work that could not be done named rather than glossed. What blocks the assertion sits outside build's workspace. The content suite records R-7.17's never-executed clause as unreadable because the rendered body comes back as one piece of text, but the criterion turns on shown-as-text versus executed, and a body's text separates those whenever the body holds markup to begin with; the acceptance seed's only content body is 'The third and current version of this page, with a **formatted** word in it', so no such page exists for a test to read, and that is a seed gap rather than a surface one. R-7.12 is not this slice's at all: the ruling on build-slice-1-3 recorded it as moved to slice 5, and plan/tasks.md still lists it under slice 1 while slice 5 does not, which is why verify still claims it here. Four of the five conditions are therefore addressed to the stages that own the artifacts, and build's one is about the account, not the code. A current pass for this tree covering R-7.17 would change the ruling, as would a plan that no longer claims R-7.12 for slice 1.
conditions:
  - "The account reports R-7.12 and R-7.17 as criteria this slice treated as its own to answer for and exercised. verify records both as never asserted against the application, and what stands behind the claim is one hand-driven session nobody can repeat: no Docker, no browser, and a stand-in database that dropped its connection and answered a request with a 500 mid-run. Driving the running application was the right response to the last ruling and what it found reads as correct; presenting it as having exercised a criterion is not, because a criterion is asserted by the acceptance suite and by nothing else. In the next revision's account, say what the session showed and say plainly that neither criterion is asserted. Keep what that session put into the tree: app/frontend/tests/content-view.test.tsx pins the seeded page's rendered wording and both of its dates, and app/frontend/tests/formatted-text.test.tsx is where the never-executed behaviour is held."
  - "addressed-to contract: tests/seed/003-content.sql defines one content record, slug 'about-us', whose current body is 'The third and current version of this page, with a **formatted** word in it.' Nowhere in tests/seed does any body embed markup. Criterion R-7.17 says a page's body is rendered as formatted text only and that markup embedded in it is never executed, so a test for that clause needs a page whose stored body embeds markup — an element and a script sitting in ordinary prose. Read back as the text of the rendered body, such a body tells a service that shows markup from one that executes it; a body holding no markup renders the same either way, which is why the content suite has recorded the clause as untestable. Add such a body, as a further version of the existing page or as a second content record, and give it a handle in tests/seed/manifest.yaml so a test can name it. Two further things in that file. Criterion R-7.12's given is a fresh installation carrying the pages the service needs, and the suite cannot write a test for it because the seed names none of those pages, so any address for one would be a guess: give at least one of them a handle, 'privacy' or 'terms-and-conditions', even though the migrations rather than the seed create it. And the count is about to be asserted with three numbers standing for it — tests/seed/manifest.yaml and the header of 003-content.sql both say nineteen pages, R-7.12's then-clause says twenty-two, and the application's migration creates sixteen on the reasoning in docs/decisions/0008 (twenty-two, minus the seven nothing links to, plus the service level agreement page)."
  - "addressed-to plan: plan/tasks.md line 11 still lists R-7.12 among slice 1's criteria, and slice 5 (an administrator can write and manage the service's pages) does not list it, although the G3 ruling on build-slice-1-3 recorded that R-7.12 had moved to the slice 5 screen that can demonstrate it. Because the plan never carried that, verify still claims R-7.12 for slice 1, where its then-clause cannot be reached at all: the criterion's given is an administrator looking at the list of pages, and slice 1 builds no such list. Move it in both places, so plan/check-coverage.mjs still finds it in exactly one slice. While it is open: the criterion's then-clause names twenty-two pages, plan/plan.md ('The data it inherits', item 3) chose twenty-two minus the seven nothing links to plus the service level agreement page, which is the sixteen the application's migration now creates, and tests/seed/manifest.yaml says nineteen. Whichever slice ends up holding R-7.12 will be asserted against one of those three numbers, and the plan is where the sixteen was chosen."
  - "addressed-to plan: R-7.17 has two clauses — a page's body is rendered as formatted text only with embedded markup never executed, and the same body renders identically on the page's own address and wherever another screen embeds it. Slice 1 claims the criterion, and it builds no screen that embeds another page's body: its learn-more screens carry their own prose, so the second clause has nowhere to be read and the content suite records it as untestable. The first screen that embeds a page body is the Sprint With Us opportunity screen, which arrives with R-7.29 in slice 11. Say where that clause is asserted — either by moving R-7.17 to the slice whose screens embed a body, or by splitting it so slice 1 answers for the rendering and slice 11 for the sameness — so the clause has a named home instead of being recorded as never asserted for the rest of the build."
  - "addressed-to derive-tests: the content suite records R-7.17's never-executed clause as not testable on the ground that content-view hands the rendered body back as a single piece of text, so a body whose markup was run and a body whose markup was taken out come back alike. That reason names the wrong thing as missing. The criterion turns on whether embedded markup is shown as text or executed, and the text of a rendered body separates those two whenever the body holds markup to begin with: a body containing <script>x</script> comes back carrying that string when the markup is shown, and without it when the markup is run or stripped, and a renderer that strips it fails the criterion's first clause too. What is actually missing is a page whose stored body embeds markup — the acceptance seed's only content body is 'The third and current version of this page, with a **formatted** word in it.' A request to add such a body, with a handle, has been filed against the seed. Until it lands, write the reason as the seed holding no body with markup in it rather than as the surface being unable to show the difference, so the gap is recorded where it can be closed; when it lands, derive a test for the clause and read it against that body. The second clause, the same body rendering identically wherever another screen embeds it, genuinely has nowhere to be read while no screen embeds a page body, and that reason stands as it is."
