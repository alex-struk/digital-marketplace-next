rationale: |2-
  The question is which of the twelve content criteria still short of the contract become it, and I am escalating rather than ruling because the one blocking row cannot be repaired by anything this gate can express and the previous return at this gate provably did not reach the thing at fault. D-content-26 arrives byte-identical to the row I returned at ratify-content-1: spec/domains/content.md has not changed since 85710cb, which predates the return, and .sdlc/runs/2026-09-07.md records that the response to the return was another ratify run at 01:24 that regenerated site pages and opened this proposal. I re-verified the fault against sources/old rather than taking my earlier reading on trust. D-content-26 says a screen whose purpose is to show a page's body turns into the not-found screen when that page is missing, resting on the guard at sprint-with-us-terms.tsx:136, `if (!organization || !body)`. That clause cannot fire on a missing page: httpRequest in framework/component/cmd.ts:107-116 maps 400, 401 and 404 alike to `invalid(response.data)`, an ADT object that is always truthy, so `!body` is dead code and only a missing organisation reaches notFound. A missing terms page falls through to the else branch, `api.isValid(body)` is false, `state.body` keeps the empty string set at init (sprint-with-us-terms.tsx:81), readyMsg is dispatched, and the view at :209-245 renders the title, an empty Markdown block and a live Accept Terms & Conditions button to any vendor who has not already accepted; team-with-us-terms.tsx:135-152 is the same code with the same dead clause. The recovered consequence is therefore inverted: the business action is not blocked, it completes against terms the vendor was never shown, and that is the behaviour a rebuild must be told about. No ratification verb repairs this. `edit` replaces only the statement text, leaving the citations and the given/when/then aimed at a guard that never runs, so the row would contradict itself; `defect` and `obsolete` both assert the row is an accurate record of what the old system did, which it is not; and `spike`, though still available on this ID, would spend one of its two non-answers asking a question I have already answered from the source, while risking that ratify auto-obsoletes the row after two follow-ups and the two real behaviours here — the genuine notFound handling at pages/content/view.tsx:68-90, and the defect that a program's qualification terms can be accepted with nothing shown in place of them — never enter the spec at all. What the human needs to decide is procedural, not technical: how to route this domain back through archaeology rather than through ratify, and whether the eleven sound criteria should be minted meanwhile in a proposal split from this one. Those eleven are ready and I record the witnesses so the next gate need not rediscover them: the content table declares slug unique at migration 20201028131858_admin-content-mgmt.ts:12, giving D-content-11 a database witness under the application checks at resources/content.ts:146 and :267; `fixed` is read off the create body at resources/content.ts:126 and never reaches the validated body, so D-content-15's note that a page cannot be promoted or demoted is actively enforced alongside the slug refusal at :258, the delete refusal at :360, the disabled field at form.tsx:183 and the warning at edit.tsx:507; no reference to version or history exists anywhere under pages/content/, settling D-content-13 against the versions db/content.ts:67 accumulates; and for D-content-24, parseRequestBody at resources/content.ts:223-229 reads only slug, title and body so the submission carries no base version, while :293 derives `version: existingContent.version + 1` from state the server re-read itself outside any transaction, making staleness undetectable by construction — with one qualification the recovery misses, that the composite primary key [id, contentId] at migration :30 means two publishes interleaving inside a single validate-then-write window collide and the second is refused with a service error rather than silently winning. What would change this ruling is a corrected D-content-26 landing in spec/domains/content.md — recovering what the terms screens actually do when their page is missing, re-siting the not-found handling on pages/content/view.tsx alone, and opening a criterion for the defect this exposes — after which the twelve can be ruled together in a single pass; short of that, or a demonstration that ResponseValidation can be falsy on a 404, this gate has nothing left it can honestly do.
