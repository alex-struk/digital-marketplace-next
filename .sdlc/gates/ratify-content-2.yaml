rationale: |2-
  Confirmed the escalating gate's reading against sources/old before ruling: cmd.ts:96 maps 404 to invalid(response.data), an always-truthy ADT, so the `!body` clause in sprint-with-us-terms.tsx:136 and team-with-us-terms.tsx is dead code; the joined organisation read is the only arm that can yield null, so only a missing organisation reaches notFound. A missing terms page instead falls to the else branch, api.isValid(body) is false, state.body keeps the empty string from init, readyMsg is dispatched, and the view renders the title, an empty Markdown block and a live Accept Terms & Conditions button to any vendor who has not already accepted. The real notFound handling lives on pages/content/view.tsx:69-84, which tests api.isValid correctly. D-content-26 is therefore not a wrong wording over right evidence but a row whose statement, given/when/then and citations are all aimed at a guard that never runs, and whose recovered consequence is inverted: the business action is not blocked, it completes against terms the vendor was never shown. No ratification verb repairs that. `edit` rewrites the statement only and leaves the citations contradicting it; `defect` and `obsolete` both assert the row accurately records the old system's behaviour, which it does not; `spike` would spend one of the row's two permitted non-answers on a question already settled from source while risking ratify auto-obsoleting it, losing both real behaviours. I also confirmed the second half of the account: git log on spec/domains/content.md ends at 85710cb, which predates the ratify-content-1 return at 7976388, so the return provably did not reach the archaeology stage that produced the row and the pipeline answered it with another ratify pass that re-emitted identical bytes. That is a stage that cannot produce what its gate asks for and a return that does not reach the thing at fault - the two conditions under which this persona escalates rather than rules, because a ruling here would hide a pipeline defect behind a project decision. The eleven remaining criteria are sound and their witnesses are already recorded in the escalation; whether to mint them from a proposal split from this one, and how to route the content domain back through archaeology, are the decisions for the person who owns the pipeline. Separately and not the reason for this ruling: the config check fails because policy.budgets.derive-tests, build and review are token counts the runner reads as turn counts and ignores, and the egress check fails on roughly 900 local home paths in tests/test-results/results.json under rule E-2; both should be cleared in the same pass. What would change this ruling is a corrected D-content-26 in spec/domains/content.md - re-sited on pages/content/view.tsx, recovering what the terms screens actually do when their page is missing, with a criterion opened for the acceptance-without-terms defect - after which the twelve can be ruled together; or a demonstration that ResponseValidation can be falsy on a 404, which would make the row correct as written.
