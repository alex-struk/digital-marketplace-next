  - R-2.7 on old: sent to bind-adapter 4 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. unbound: proposal-swu-create.choose_organization — no chooser labelled "Organization" on http://localhost:3102/opportunities/sprint-with-us/d8f4c693-5190-4d1b-bfea-b551426ef30c/proposals/create; unbound: proposal-swu-create.choose_organization — no chooser labelled "Organization" on http://localhost:3102/opportunities/sprint-with-us/f482e992-6829-47ce-9d44-84f70a4da670/proposals/create
    2. unbound: proposal-swu-create.add_phase_team_member — no box labelled "Implementation" on http://localhost:3101/opportunities/sprint-with-us/386a6b21-8f65-4b89-a9ed-cc4cac556c01/proposals/create; unbound: proposal-swu-create.add_phase_team_member — no box labelled "Implementation" on http://localhost:3101/opportunities/sprint-with-us/d7ed161f-5c7c-421e-8041-d1fddba8da2c/proposals/create
    3. proposal-swu-create.add_reference neither opens the 'References' tab nor maps its input: fill Name, Company, Phone and Email under 'Reference N' (N = order + 1) from the input's name, company, phone and email, instead of looking for a field labelled 'Company Name' or 'Reference', which does not exist
    4. on proposal-swu-create's '2. Team' step for a one-phase opportunity, whose 'Implementation' section is open by default and already shows 'Phase Dates' and 'Add Team Member(s)', openTeamPhases presses the phase name when teamPhaseAdder misses the adder, which folds the section, and add_phase_team_member then throws 'no Add Team Member(s) inside Implementation'. Press a phase name only when its section shows no 'Phase Dates' below it. In the draft test, once the member was on the phase with the Scrum Master radio ticked, set_phase_proposed_cost never reached '3. Pricing': the step list shows only the current step, so move forward with the form's 'Next' until 'Implementation Cost*' shows.
  - R-2.11 on old: sent to bind-adapter 4 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. unbound: proposal-swu-create.choose_organization — no chooser labelled "Organization" on http://localhost:3101/opportunities/sprint-with-us/476c4cff-cd81-4f65-9cb2-7adaab9e0e0c/proposals/create
    2. unbound: proposal-swu-create.add_phase_team_member — no box labelled "Implementation" on http://localhost:3102/opportunities/sprint-with-us/93c76375-8eda-4631-97d8-fd03d1321583/proposals/create
    3. proposal-swu-create.add_reference neither opens the 'References' tab nor maps its input: fill Name, Company, Phone and Email under 'Reference N' (N = order + 1) from the input's name, company, phone and email, instead of looking for a field labelled 'Company Name' or 'Reference', which does not exist
    4. on proposal-swu-create, with all three references filled on '5. References', the 'Review Terms and Conditions' dialog was open with both acknowledgement checkboxes ticked and 'Submit Proposal' offered inside it as pressable text, and press() looped (index.ts:578) until the test timed out without pressing it. Find and press 'Submit Proposal' inside the open dialog by its text, not by button role, before looking on the page behind it.
  - R-2.19 on old: sent to bind-adapter 6 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. addPhase clicks a capability chip (index.ts:2115) chosen from bounding boxes between the phase headings (index.ts:2096), after an unfold click (index.ts:2061-2067) that may close the section again, so the chip is animating or hidden when clicked; look for the chip inside the expanded phase's own container, wait until the section is open and stable, and find the chip again before clicking
    2. unbound: opportunity-swu-create.add_phase — no field for "Proof of Concept" on the Phases step takes "startDate" or "completionDate" or "maxBudget"; unbound: opportunity-swu-create.add_phase — no field for "Implementation" on the Phases step takes "maxBudget"
    3. publishing a Sprint With Us opportunity whose phases are Prototype (28 to 60 days out) and Implementation (61 to 90 days out) left the page on /opportunities/sprint-with-us/create, and the adapter then read the opportunity identifier from that address; the publish must set the start-phase chooser to Prototype, enter each phase's dates exactly as given without adding dates of its own, and report the page's own refusal when publish does not land on a record
    4. opportunity-swu-create.publish splits the input's opportunity-level startDate/completionDate off as phase dates and calls addPhase on the form's starting phase (Prototype), overwriting the 28-to-60-day dates the test's own addPhase gave it with 28-to-90. Prototype then overlaps Implementation (starting day 61), the Phases step becomes invalid, and publish returns quietly on /opportunities/sprint-with-us/create. It must not write opportunity-level dates onto a phase the test has already given dates to.
    5. proposal-swu-create.add_phase_team_member reached the Team step with an organization chosen and looked only for an exactly-matching visible "Add Team Member(s)" text node, then threw unbound. It never expanded each phase's collapsible section (Inception / Prototype / Implementation) before looking, and never looked for the adder by role or partial label (a link or button containing 'Add Team Member') within each phase's block. Expand every phase section first, find the adder within the phase being asked about, and only report it unbound once every phase section is open and it is still absent.
    6. proposal-swu-create's openTeamPhases re-presses a phase name whose section is already unfolded. The snapshot shows 'Proof of Concept' open with its 'Add Team Member(s)' visible and the name itself as the last element pressed, while 'Implementation' stays folded, and the test times out. Decide whether a section is open from whether 'Phase Dates' or its 'Add Team Member(s)' shows below its name, press only a folded name, once, and wait for its section to open before moving to the next phase.
