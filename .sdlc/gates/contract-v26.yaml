rationale: |2-
  Question: is this the contract the R-2.19 tests will act through? Ruling: approve. It adds what R-2.19's test writer was missing. On proposal-swu-create there are three new observations: phase_team_sections (the phases the form offers), phase_requirements (whether each phase's team is complete, and the capabilities it still lacks) and cost_errors (each cost message with the phase or total it stands against). On proposal-team-request, a request now sends exactly the phases it is given, and each service message is located by phase part or total. I checked the key claims against the old source. The phase refusals 'This opportunity requires this phase.' and 'This opportunity does not require this phase.' are in back-end/lib/validation.ts at lines 1077 and 1087. The Prototype phase is labelled 'Proof of Concept' in shared/lib/resources/*/sprint-with-us.ts. The total-cost message is in shared/lib/validation/proposal/sprint-with-us.ts at line 248, and the per-phase cost message comes from the shared validator's 'less than or equal to' template. validateSWUProposalTeamCapabilities combines the capabilities required by every phase and reports one team-wide shortfall, which matches the contract's note that the service checks the team as a whole while the form checks each phase. The phase component's setErrors returns the state unchanged, so the stated limit is real: the form never shows the service's phase messages, and 'which phase' appears on screen only as the incomplete mark and the cost messages. Nothing outside R-2.19's owed item changed, and the observation descriptions state what the screen shows and name no internals. Two things are unproven. The oracle (the old application run in containers for the tests) never started because the shell refused the command, but none of the files it is built from changed since the last approved contract. The edited YAML could not be parsed, but the additions are comments plus three entries at their neighbours' indentation, and derive-tests will catch a malformed file when it reads it. What would change this ruling: a derive-tests or calibrate run showing that one of the three observations cannot be read on the old screen, or evidence that the oracle does not start.
