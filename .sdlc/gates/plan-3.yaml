rationale: |2-
  The question is whether this is the right cut of the work and whether each slice stands on its own, and on a revision that scope is whether the two G3 conditions addressed to plan are answered without disturbing the cut. Both are, and I approve. R-7.12 moved from Slice 1 to Slice 5 in plan/tasks.md and now sits on exactly one `- criteria:` line (verified on the branch: line 31; the remaining mentions are `delivers:` prose, which check-coverage.mjs does not read), and the placement is correct on the criterion's own terms — its given is an administrator looking at the list of pages, which Slice 1 does not build, while the seeding migration stays in Slice 1 because R-7.18's five links must resolve on a fresh installation. The harder half, the count, is settled the right way: sixteen is twenty-two minus the seven the D-content-27 ruling removed plus the one R-7.18 adds, every term a decision on the record, and no installation of the rebuild can show twenty-two without disobeying one of them. Decision record 0007 enumerates all sixteen rather than only counting them, which is what makes the criterion assertable at all, since the disagreement was about which rows are counted; I ratify sixteen as the number R-7.12 is asserted against. R-7.17 moved whole to Slice 10, placed by the slice carrying R-7.29 rather than by the ruling's slice number, which is right where the rest of the line references match this file. Moving rather than splitting was one of the two options the ruling offered, and the plan's reason for declining the split is the correct one: a second criterion ID is the spec's to author and inventing one here would put an ID in the plan that the index does not know. Slice 1 does not ship the renderer wholly unasserted — R-7.1 requires the body shown as formatted text — and the residual cost is stated plainly in the plan rather than buried. On my own criteria: the constitution check is complete and P5 and P7 now carry the rules these moves establish; no criterion is left unassigned; the revision makes no schema change (0002 gains an explanatory paragraph, not a row, and the R-1.51 data mapping that is a schema change is unchanged and already escalated to the tech lead in 0002, so re-escalating an untouched decision would spend this gate's turn on nothing); no dependency is introduced, the register change being a correction of a cited ID from R-7.19 to R-7.17, which points the Markdown-renderer row at the criterion it was always for; tier is STANDARD. Two things this proposal correctly did not do and correctly refused to hide: R-7.12's then-clause still reads twenty-two until the spec re-authors it, and the acceptance suite's seed manifest carries nineteen, which matches neither the old service nor any ruling. Both are recorded under 'For ruling' and neither is deliverable from a stage whose workspace is plan/ and docs/decisions/, so returning the plan to fix them would be asking for work it cannot perform. What would change this ruling: R-7.12 or R-7.17 appearing on a second `- criteria:` line, a re-authoring of R-7.12 against a set other than the enumerated sixteen, a ruling that the seven unlinked guides are seeded after all, or check-coverage.mjs reporting a placement this hand check missed.
