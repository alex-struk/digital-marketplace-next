  - "The seed manifest's nineteen is reconciled to sixteen by whoever owns tests/, not by the plan. P7 puts the suite behind the spec and the plan, decision record 0007 names the sixteen rows to reconcile against, and build-slice-1-4's untaken revision request to derive-tests already reaches that suite, so this is left to be ruled at derive-tests' own gate rather than filed from here."
