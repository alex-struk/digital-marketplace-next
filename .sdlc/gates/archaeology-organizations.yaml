rationale: |2-
  The question was whether this is what the organizations domain does and which of it is the contract. Approving. The recovered picture — register an organization and own it on the spot, staff it by email invitation through an affiliation that is deactivated rather than deleted, then qualify it separately for Sprint With Us by team capability and for Team With Us by administrator approval of service areas — matches the code I read, and the proposal is honest about the difference between what it saw and what it inferred: it grades most rows `inferred` on code alone rather than promoting them, and it declines to write corrected criteria for the three defects on the correct ground that choosing between widening a permission and hiding a control is mine to make, not archaeology's. I am confirming nine criteria because I read the code behind them this session and it leaves no second reading: the permission functions at src/back-end/lib/permissions.ts:195, :204, :258, :271 and :294 state the create, read-one, team-list, invite and admin-rights rules as literal boolean expressions; src/back-end/lib/resources/affiliation.ts:206-228 refuses a non-active or non-vendor invitee and an existing affiliation with three named error messages; :505 refuses removing the sole owner via readActiveOwnerCount, :370 refuses changing one's own admin status and the owner's membership type, :418 restricts ownership transfer to a service administrator and refuses a pending member while src/back-end/lib/db/affiliation.ts:351 demotes the previous owner to member; and src/back-end/lib/db/organization.ts:541 returns owned-or-administered active affiliations on active organizations only. I am leaving D-organizations-2 at `inferred` although it is probably right, because I read only the entry to the field-stripping branch and not what it returns — that is the difference between confirmed and inferred and I would rather it stayed honest. All three defects I could reproduce from the source and all three are now confirmed with a corrected criterion attached. On D-organizations-8 I can also settle what archaeology could not: the profile parse reads the phone from `contactString` while the form sends `contactPhone`, so the parsed value is the empty-string fallback from getString, which `optional()` in src/shared/lib/validation/index.ts:202 treats as not-defined and validates to undefined, so the column is omitted from the update entirely and the previously stored number survives rather than being cleared. On the two permission defects I have ruled toward the conservative reading in both cases — hide the controls rather than widen who may edit and archive a company's legal identity, and refuse the non-vendor rather than keep answering an empty success, because the permission rule that was written and never invoked is itself the statement of intent. What would change this ruling: evidence that an organization administrator was deliberately meant to be able to edit and archive the organization, which would turn D-organizations-7's replacement from a UI fix into a permission widening; or a reading of the knex update path showing the omitted column is written as null, which would make D-organizations-8 a silent data loss rather than a silent no-op and change how urgently it needs fixing. The narrative says four criteria are confirmed where the domain file carries five; not worth returning a proposal for, but worth correcting the next time that paragraph is written.
