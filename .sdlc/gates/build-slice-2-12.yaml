rationale: |2-
  Question: does slice 2 (sign in, finish signing up, sign out) do what its criteria say? Ruling: escalate to the pipeline owner. runner:verify's account decided it: the failures may not be the application's. Every criterion that did not pass traces to one pipeline gap. The bind-adapter stage cannot use the sandbox password, so it has never walked a signed-in screen. R-6.20 and R-6.28 are unbound because their screens were opened signed out and answered not-found; /users/$userId does exist in app/frontend/src/router.tsx, so that was a visitor being refused. R-4.23 is unbound for the reason stated in the adapter itself (tests/adapters/new/index.ts:285): 'the session that bound this adapter could not use the sandbox password'. R-4.1 and R-4.3 fail on empty reads, although the rebound adapter reads the 'Status: Active' line the screen draws (index.ts:3413-3417). The adapter has already been rebound (bind-adapter-new-9) and the gap is unchanged, so returning to build or to bind-adapter would repeat the loop. The previous ruling said this case goes to the pipeline owner. Approval is also blocked by missing-test/R-4.1 and missing-test/R-4.2, which need first-time personas and a way to reset an identity to never-signed-in; no build can supply either. This revision settles all three open instructions: build-slice-2-5#1, because R-4.17 passes against d27b6d8; build-slice-2-11#4, because the blocking sign-out request is gone and sign-out is one ordinary DELETE (app/frontend/src/api/accounts.ts:99-101); and build-slice-2-11#5, because the remaining egress failures are all in build-slice-2-11 files and .sdlc/conditions.yaml, none in this revision's journal or proposal page. Record these as condition-met on the next ruling that can carry them. What would change the ruling: a way for bind-adapter to sign in to the sandbox, a rebind that walks the signed-in screens, and first-time personas for R-4.1 and R-4.2. If verify still failed after that, it would be a finding about the application and would go back to build.
