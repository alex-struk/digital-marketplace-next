rationale: |2-
  The question was which of 22 criteria failing against the old application are the application's fault, the spec's, or the test's. Ruling: approve, with defect-in-old on four, spec-wrong on one and test-wrong on seventeen. I read each failure against the old source, the saved page snapshots, the test and the adapter. DEFECTS IN OLD. R-3.18 and R-4.19 are authored corrections of recovered defects, and the old screens still show the defect. The organization page offers 'Edit Organization' and 'Archive Organization' to an organization administrator who is not the owner (organization.tsx:305-313, 379-390), while the service allows only the owner or a service administrator (permissions.ts:218-243). The administrator's profile view offers 'Reactivate Account' on every inactive account without asking who deactivated it (profile.tsx:510-557), carries no sign-in wording, and the service refuses that request for a self-deactivated account (resources/user.ts:245-251). R-6.17: an invitation to a deactivated vendor looks the address up among active accounts only, treats it as unregistered, and sends it a sign-up invitation anyway (resources/affiliation.ts:175-205); the page's own notice listed that address as notified. R-7.20: an empty title or body is never marked with a reason, because nothing changes in an untouched field; the form only withholds Publish (create.tsx:217-224), which is the outcome calibrate-old-4 said would make this defect-in-old. SPEC WRONG. R-2.2: through the interface a second start is never refused with that message; the vendor is sent to the proposal they already hold (proposal/code-with-us/create.tsx:133-140), and only a direct create request gets 'You already have a proposal for this opportunity.' (resources/proposal/code-with-us.ts:365-368). TEST WRONG, harness-caused. The reviewer should have sent these back: redoing the test alone will not clear them. R-4.5: the suite's sign-in uses a development session route that never runs the reactivation or the email of the real sign-in (adapter index.ts:1447-1469 against routers/auth.ts:494-503). R-7.12, R-7.25 and R-7.27: the migrations create all 22 fixed pages, including copyright, disclaimer and accessibility, titled by address with body 'Initial version' and no author, which the managing screen shows as System (edit.tsx:408). The target held none of them; every page answered Not Found and the list showed only 'About us', which points at the per-test reseed replaying the seed without migrations. R-7.9: the old screen does return to the list and shows 'Page Deleted' (toasts.tsx:23-31), but the adapter stops reading at the footer, where that notice renders. TEST WRONG, test-caused. R-4.12: the grant took effect (the Admin box stays ticked), and Account Type reads 'Public Sector Employee' for administrators too (shared/lib/resources/user.ts:28-35). A vendor's profile offers no box at all (profile.tsx:420-440), and an ordinary employee's own profile shows no permissions label, which the criterion never promises. R-4.27 and R-5.22: both fields render their reason under the field about half a second after a change, and neither test allowed for it. R-5.22's empty comment was also typed into an already-empty box. R-4.9 reads 'deactivated by them' from R-4.19's control. R-3.27's second attempt ran against terms it had not yet accepted; the old page withdraws the accept control once the terms are accepted (sprint-with-us-terms.tsx:224), and the service refuses a repeat (resources/organization.ts:509-516). R-7.22 never confirmed the publish dialogs, so nothing was sent. R-1.8 and R-1.53 saved a Team With Us draft too incomplete for the service to store. R-1.35's author is told in the same blind-copy batch as the watchers (code-with-us.tsx:168-195, 334-337), which the mail fixture cannot see. R-2.35 read history as a vendor, who is never offered it (view/index.tsx:81-82). R-1.1 and R-1.24: the old closure handles Team With Us, moving proposals to review and naming them 'Proponent N' (db/opportunity/team-with-us.ts:1433-1512). The seeded opportunity meets its query, and both passed on 2026-09-14; the trigger returns before closure commits (hooks/team-with-us.ts:47-55). Caveats. Four harness faults need the adapter or oracle owner, not derive-tests: the session route, the reseed that drops fixed pages, the footer cut-off, and the stale error left on the add-team-member dialog (R-6.17). deleteWithheldForFixedPage returns a value that is always truthy, so that R-7.25 assertion cannot fail. Why the Team With Us pages answered Not Found is not established; the back-end log for that run is the next evidence. The long-title half of R-7.20 showing no mark after 15 s is not explained by the code. R-4.12's given describes ticking a box the old vendor profile never shows, and the statement is unaffected. Whether a Team With Us draft should need a complete panel is a question for R-1.9, not decided here. What would change this ruling: a rewritten R-1.1 or R-1.24 that waits and still finds the closed Team With Us opportunity unreadable would make those defect-in-old. A rewritten R-4.27 or R-5.22 whose changed field is never marked after waiting would do the same. Evidence that the interface can show the create refusal message would withdraw the R-2.2 correction. A reseeded target that carries the fixed pages and still fails R-7.12, R-7.25 or R-7.27 would bring them back as product questions. Evidence that the old form marks an empty title or body would withdraw R-7.20.
