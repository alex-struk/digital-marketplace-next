rationale: |2-
  The question was which of the 29 criteria failing against the old target were caused by this project's own adapter. Ruling: approve, with one triage line per criterion: 22 adapter-wrong and 7 product-question. I read each failure against tests/adapters/old/index.ts, the test and the saved snapshot under tests/test-results. The adapter is unchanged since calibrate-triage-old-6, so three faults named there account for most of the 22. First, submitProposal's enter() cancels the terms dialog and the boxes come back unticked with 'Submit Proposal' disabled (R-2.24, R-2.25, R-1.31, R-2.36, R-2.37, R-2.38, R-8.25, R-8.31). Second, the panel binding ignores a single {member} and matches chooser options by seed id when they are named 'Name (email)' (R-1.48, R-1.55, R-1.56, R-2.24, R-2.37, R-8.25). Third, scoreSheet.enter ignores 'order' (R-5.24, R-5.25, R-5.27, R-5.28, R-5.32, R-5.36). The snapshots also show faults new to this page. opportunityCwuView.addenda never opens the view's 'Addenda' tab, whose label carries a count, and a disabled 'Publish Addendum' throws instead of counting as the refusal (R-1.32). opportunityTab reads only the '1. Overview' step, and a missing Actions menu throws (R-1.56). readOnlyAfterSubmitted returns a non-empty 'absent' for an editable draft (R-5.24). serviceAreaCheckbox lists every area in display wording, ticked or not (R-3.28). createOrganization cannot place addressLineTwo in the second 'Street Address' box (R-3.26). uploadBodyImage clicks a hidden file input (R-8.29). filterByStatus clicks an intercepted placeholder, and publish fails on an empty remoteDescription whose field is hidden (R-1.39). Seven go to the product owner because nothing points at the binding. The disclaimer and accessibility management pages answer 'Not Found' (R-7.25, R-7.27). The second Sprint With Us terms acceptance answered 'Successfully accepted' (R-3.27). Both the edit ('R-1.35 the description as an administrator changed it.' stored) and the addendum ('Existing Addendum', created 5:33 PM) reached the service, and author staff.one received no mail (R-1.35). An empty name or an invalid email disables 'Save Changes' and the page shows no message (R-4.27). The vendor was shown 'Not Found' on the proposal view (R-2.35). Team With Us 'Save Draft' stays on /create (R-1.53). Caveats for the product owner. R-4.27's messages may appear only once a field loses focus, which the evidence cannot show. R-2.35 opens the staff proposal view as the vendor, whose own proposal lives under /edit, so the test may be reading history from a page a vendor is never offered. In R-1.39 the program and search values are set in their controls, yet the list still shows everything, which the evidence does not tie to the binding. Tier is STANDARD and no residual risk is marked unaccepted, so nothing escalates. What would change this ruling: a fresh run, with these adapter defects fixed, that still fails a criterion at the same assertion. That criterion would come back as a product question. Evidence that the old target renders field errors that messages() filters out would move R-4.27 to adapter-wrong.
