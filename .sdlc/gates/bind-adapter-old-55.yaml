escalate_to: tech-lead
rationale: >-
  bind-adapter was handed owed work sent back to it more times than the
  project's policy allows, so this proposal is ruled by tech-lead rather than
  put to G3's holder for another round.

  - R-1.17 on old: sent to bind-adapter 4 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. opportunitySwuEdit.teamQuestionsTab opens the sidebar 'Team Questions' tab under OPPORTUNITY EVALUATION, which is the proponents' team-question scoring table, not the opportunity's list of questions; it must read the saved opportunity's own team questions, in the order listed, from the 'Opportunity' tab's 'Team Questions' section
    2. opportunityTwuEdit.resourceQuestionsTab read the sidebar's 'Resource Questions' link under Opportunity Evaluation (proposal scoring) and returned sidebar and summary text; it must read the opportunity's own Resource Questions step inside the Opportunity tab, where authored questions are listed. Also, opportunityTwuCreate/opportunitySwuCreate.fieldError report '<step> is incomplete' when no field message is shown; they must return only what the page says against fields, never a step title, which currently fails the empty-guideline rows on text the page never said about a field and makes the empty-question row pass on the word 'Questions'.
    3. opportunitySwuCreate.fieldError returned '' for a 1,001-character question with Submit for Review disabled, although old's Question box uses the same LongText widget and check as Response Guidelines and shows 'Question must be between 1 and 1000 characters long.' (the over-length guideline row passes in the same run); find why addTeamQuestion's Question value or its field message is lost and return it. Also, a value given as empty for Question or Response Guidelines is filled into an already-empty box, which fires no change, so old never validates it: enter it as a person clearing the box would (type, then clear, then leave the box) so old's own refusal is shown, for both addTeamQuestion and addResourceQuestion.
    4. on submission for review, opportunitySwuCreate.fieldError() still returns '' for an empty Question and a 1,001-character Question, while the over-length Response Guidelines row using the same widget passes; addTeamQuestion must enter the Question value so old validates it (for an empty value, type then clear then leave the box so a change fires), and fieldError must read the message old draws under that Question box; for the 102-question row, submitForReview must report whether 'Submit for Review' was pressed or left disabled, and fieldError must include any alert or message old shows after it, rather than ending quietly with nothing read
  - R-7.26 on old: sent to bind-adapter 4 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. unbound: file-embedded-image.upload_body_image — no image file was named
    2. fileEmbeddedImage.imageRenderedInPublishedText never opens the published /content/<slug> page and reads images beside the heading of the edit screen left after Publish Changes, answering empty; it must open the published page for the slug and read the body's images there. imageInsertedIntoText returns the whole body text, which is truthy with no image in it; it must return the inserted image reference (the FILE_ID or /api/files/ marker) and empty when none was inserted.
    3. fileEmbeddedImage.imageRenderedInPublishedText returned '' on the published /content/<slug> page, whose body visibly holds img "body-image.png" in the paragraph right after the 'Published … | Updated …' line; imageSources walks only the level-1 heading's next element siblings, which does not reach that paragraph on old's markup. Collect img elements from the page's content region after the heading (excluding site header and footer), and match the /api/files/<id> the body's FILE_ID marker names.
    4. fileEmbeddedImage returned '' after uploading a body image and publishing; imageSources skips any image with an ancestor whose innerText begins with 'Published', and on old's /content/<slug> page the body paragraph follows the 'Published … | Updated …' line inside the content region, so the body image is dropped; exclude only the date line itself, not containers that start with it, and check that imageInsertedIntoText reads the Body box after the upload finished writing '![name](FILE_ID:<id>)' into it
  - R-8.31 on old: sent to bind-adapter 6 times, past the limit of 2 that
  policy.loops.rebind sets. What each send asked for:
    1. in the opportunity test removeExistingAttachment calls advanceTo('Add Attachment'), but a published opportunity shows its attachment read-only (a disabled 'R-8.31 removed from an opportunity.pdf' box, with 'Actions' in the top bar) until 'Edit' is chosen from the Actions menu, so it throws unbound; choose 'Edit' from Actions first, as addAttachment does. In the proposal test attachmentAddress returns '' from the proposal's '1. Proponent' step, with an empty dialog open; close it and go to '3. Attachments' before reading the link.
    2. proposalCwuEdit.startEditing (index.ts:3015) only goes through the Actions menu, which the proposal's /edit page does not have; like addAttachment (index.ts:1381-1389), use the top-bar Edit or the Proposal Details tab when they are present, and do nothing when the form is already editable
    3. removeExistingAttachment clicks the remove mark but never saves the opportunity form, so the removal never reaches the service; save after removing ('Publish Changes' / 'Save Changes' / 'Submit Changes for Review'). And proposal-cwu-edit.save_changes looks only for 'Save Changes', while a submitted Code With Us proposal's edit page offers 'Submit Changes', which opens a terms dialog whose boxes must be ticked before its 'Submit Changes' confirm
    4. on a published Code With Us opportunity fileAttachmentControl.attachmentAddress() returns '' because the added file is never stored: addAttachment saves the form only on Team With Us opportunities, and attachmentAddress tries 'Save Changes' before 'Publish Changes' and returns empty rather than failing when no save is found or no /api/files/ link appears; save a published opportunity through 'Publish Changes' and confirm 'Publish Changes to Code With Us Opportunity?' (as saveAttachmentForm does), wait for the /api/files/ link, and throw naming the missing control instead of returning ''
    5. on a Code With Us opportunity just published by opportunity-cwu-create.publish and opened by file-attachment-control.open, add_attachment followed by attachment_address returned an empty string, although the target stores the file and links it at /api/files/<id> once "Publish Changes" and its confirmation are accepted; add_attachment must raise when the upload leaves neither a blob: preview nor a stored /api/files/ link, or when no save control is offered, instead of returning silently, and attachment_address must confirm it is on the Attachments step of that same opportunity, in whatever read-only or edit state the publish left it, and raise rather than return empty when it finds no link there
    6. after fileAttachmentControl.addAttachment on a just-published Code With Us opportunity, attachmentAddress found neither a /api/files/ link nor a blob: preview on the Attachments step of /opportunities/code-with-us/<id>/edit?tab=opportunity, so the file was never added to the form; addAttachment must enter editing on the published opportunity if it is read-only, hand the file to the attachment input, save it through 'Publish Changes' and its confirmation, and raise when no file appears, rather than returning silently
