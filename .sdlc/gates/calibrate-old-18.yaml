rationale: |2-
  Question: R-6.1 fails against old, with 11 messages caught where 0 were expected. Is that the application's fault, the spec's, or the test's? Ruling: escalate to the person who owns the pipeline. None of the three is at fault, and the thing that is broken is the calibrate stage itself, which is not a question about the project. I checked the product-owner's account against the repository, and the part that decided it is its finding that the test ran against the wrong instance. The old application's only mail path returns before composing anything when notifications are off: makeSend exits early on DISABLE_NOTIFICATIONS (sources/old/src/back-end/lib/mailer/transport.ts:54). The oracle's compose file passes that setting through from SDLC_ORACLE_DISABLE_NOTIFICATIONS, and it defaults to 0, meaning on (.sdlc/oracle/compose.yml:104). The approved contract (spec/contract/observables.yaml, configurations.notifications_disabled) sets out two runs. The @notifications_disabled test runs only against a separate instance started with that variable set to 1, and the default run leaves the tag out with --grep-invert. Eleven announcements from one Code With Us publish mean the test ran against the default instance, where notifications are on. So defect-in-old would record a failure the old code does not have, spec-wrong would rewrite an accurate criterion, and test-wrong would send a correct test back to be rewritten blind. The same misrouting failed calibrate-old-16, -17 and -18 in a row, so this is a stage that cannot produce what its gate asks for. The fix belongs in calibrate, and calibrate cannot be addressed by a condition: it needs to start a second oracle instance with SDLC_ORACLE_DISABLE_NOTIFICATIONS=1, run only the @notifications_disabled test against it, and leave that tag out of the default run. What would change this ruling: if R-6.1 still fails against an instance really started with notifications off, it becomes defect-in-old and the transport.ts:54 reading has to be re-examined. If the pipeline owner decides a second instance will never be hosted, the right answer is a condition-withdrawn on the owed test rather than a calibration verdict.
