rationale: |2-
  Question: is R-6.1's failure against old (11 messages caught, 0 expected) the application's fault, the spec's, or the test's? Ruling: escalate to tech-lead, because none of the three calibration forms is true of it and this is the third consecutive calibration run (calibrate-old-16, -17, -18) with the same harness fault. The criterion is accurate: makeSend, the only path by which the old application sends mail, returns before composing anything when DISABLE_NOTIFICATIONS is set (sources/old/src/back-end/lib/mailer/transport.ts:54, read from config.ts:63; transport.send is called nowhere else). The test is correct for its tagged configuration: it carries @notifications_disabled and, per spec/contract/observables.yaml configurations.notifications_disabled, must run only against a separate oracle instance started with SDLC_ORACLE_DISABLE_NOTIFICATIONS=1 (which .sdlc/oracle/compose.yml:104 passes through to the application), with the default run excluding that tag via --grep-invert. Eleven caught messages from one Code With Us publish are exactly the new-opportunity announcements a notifications-on instance sends, so the test again ran against the default instance. defect-in-old would falsely record the old application as failing a criterion its code plainly meets; spec-wrong would rewrite an accurate statement; test-wrong would send a correct test back to be redone blind for no gain. calibrate-old-17 said that if this recurred, the calibrate stage owner should take it up; it has recurred, so it goes to tech-lead. The fix is in the calibrate stage: start a second oracle instance with SDLC_ORACLE_DISABLE_NOTIFICATIONS=1, run only @notifications_disabled against it, and exclude that tag from the default run. What would change this ruling: if R-6.1 fails against an instance genuinely started with notifications off, it becomes defect-in-old and the transport.ts:54 reading must be re-examined; if the tech lead decides a second instance will never be hosted, the right answer is a condition-withdrawn on the owed test, not a calibration verdict.
