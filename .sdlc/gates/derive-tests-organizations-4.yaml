rationale: |2-
  The question was whether the revised organizations tests now follow from their criteria and from nothing else, and they do. Every literal-string assertion traces to its own criterion — "Edit" and "Archive" are named verbatim in R-3.18, "Admin Rights Removed" and "Admin Rights Given" verbatim in R-3.33 including the ordering claim, and /archiv/i follows from R-3.24 — while no route, status code, selector or table name appears anywhere, every import is from ../../fixtures, and every action and observation used exists in spec/contract/surface.yaml. The differential reading in R-3.18 is not an over-assertion: the criterion states the controls are offered only to the owner or a service administrator, so reading the owner's view first asserts the criterion's own positive half rather than something nobody asked for, and it is what stops the absence check passing against an empty observation. Condition 4's substitution is right, since the changelog wording belongs to R-3.33 alone and R-3.12 states only that the member gains the rights. The three new not-testable reasons each name what is actually missing from the surface, verified against the contract: organization-list carries no refusal observation, add_team_members carries no membership type, and organization-user-memberships carries no accept-or-decline confirmation while the mail fixture exposes no body. Condition 2 is done — all four superseded spec files are gone and the organizations directory now raises none of the superseded-test warnings that remain in files/ and notifications/ — and the accounting reconciles at 28 spec files plus 3 not-testable plus 4 superseded against 35 accepted R-3 criteria. Condition 1 was raised on a misread diff and is moot on the substance: a character-level comparison against main shows the only change to the thirty-four R-6.* and R-8.* entries is 68 removed quote marks, a YAML re-serialization that re-wrapped long quoted strings into folded block form, leaving the reason prose identical after whitespace normalization. The proposal was right not to write replacements it could not source. The one real residue is that the same re-serialization stripped the five-line header comment from the top of not-testable.yaml, an unapproved deletion of documentation in a shared file, though YAML comments are unparsed so nothing reads it but a person. Checks are green and none are stale; the tests warnings concern other domains and predate this slice. The suite could not be run, but this is derive-tests, which writes acceptance tests ahead of the adapter that binds them, so a green run is not yet available to anyone. Tier is STANDARD, no residual risk is marked unaccepted, and nothing triggers escalation. What would change the ruling: a test asserting a message wording, field value or status its criterion does not state; a selector, route or table name reaching tests/acceptance; a not-testable reason that names inconvenience rather than a missing page, action or observation; or evidence that the not-testable reason text diverges from main beyond quoting and line wrapping.
conditions:
  - "Restore the five-line header comment at the top of tests/acceptance/not-testable.yaml, stripped by YAML re-serialization: the block beginning 'Accepted criteria the acceptance suite cannot exercise through the surface, and why' and ending 'sdlc run calibrate reports it as a not-testable row rather than a missing test.' Take it verbatim from git show main:tests/acceptance/not-testable.yaml; the entry bodies need no change, as their prose already matches main."
  - "Note for the next slice, not for this one: R-3.16 and R-3.29 lost working tests to supersession while their replacements R-3.20 and R-3.35 are filed not-testable, so organization-list refusal behaviour and the invitation email's accept and decline choices now have no executable coverage. Closing the two surface gaps the journal names — an available-actions or explicit control-offered observation on organization-edit, and an admin-status observation to sit alongside owner_badge and pending_badge — would also let R-3.18 and R-3.12 assert what their criteria say instead of approximating it by differential reading."
