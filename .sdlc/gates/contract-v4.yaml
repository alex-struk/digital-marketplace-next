rationale: |2-
  The question is whether this is the contract the tests will act through, and it is. The most important thing this run did is not on its list of 69 owed items. `sdlc oracle reseed` empties every ordinary table before each test, which also deletes rows the application's own migrations had written: the service areas, the 22 fixed service pages and the migration account. Nothing put them back, so every test after the first started from a broken installation. `000-installation.sql` restores only what those migrations write, and only where a row is missing. I checked it against the migrations it cites. `20201202094826_admin-content-stubs.ts` inserts fixed content with `fixed: true` and the body 'Initial version', which is what the seed writes. `20240527213854_add-evaluation-committee-panel-tables.ts` creates the MIGRATION_USER account with idpUsername and idpId both 'migration_user' and email migration_user@gov.bc.ca, which is what the seed writes. The one difference, a fixed page identifier instead of a random one, does no harm, because tests address those pages by slug. I also checked the finding about the old application at source: the `TWUOpportunityStatus` enum in `20250506164908_twu-evaluation-tables.ts` lists DRAFT, UNDER_REVIEW, PUBLISHED, EVAL_QUESTIONS_INDIVIDUAL, EVAL_QUESTIONS_CONSENSUS, EVAL_C, AWARDED, SUSPENDED and CANCELED, and no PROCESSING. The status check rebuilt from that enum therefore refuses a Team With Us opportunity in processing, as the journal says. That bears directly on R-1.49 and on the Team With Us half of R-1.25, both confirmed. The spec is not wrong about what the rebuild should do. The old target will fail them, and that is for calibration to rule, most likely as defect-in-old. Seeding `twuChallengeLastToScore` one step earlier, so the test watches what the oracle actually does, is the honest arrangement. The new seed follows the shape the contract-v3 ruling accepted. It seeds the condition and not the outcome: no totals, ranks or score-entry events are written. Each criterion that moves a record forward gets its own record, and shared read-only records are named in the manifest. The oracle applied all 14 files on four copies and the derived scores were read back through the application. The new request-level pages, the two mail-catcher pages and the four sandbox-idp personas each close a specific gap that the owed conditions named. Each persona that cannot reach the oracle is marked unavailable with a reason that matches the sign-in routes. The declared limits are honest and none is grounds for return: R-6.1, R-6.2, R-6.24, R-7.28, R-7.29 and R-5.34 stay owed, and R-1.51, R-8.16 and R-4.13 go back to ratify as unobservable. Two checks look like failures and are not defects in this work. First, `.sdlc/runs/2026-09-25.md` on the branch now differs from main only by the pipeline's own 'run contract' and 'propose' lines, so the scope complaint in the fix turn is gone. Second, the `generated` check fails because tests/generated has not been regenerated. That is the post-merge step the pipeline committed for contract-v2 and contract-v3, and both of those gates were approved in this same state. Carried forward from both earlier rulings: derive-tests must regenerate tests/generated from this contract before it writes anything, or none of this run's new pages, personas and seed handles reach the tests. It also has to fill in the `test_id: null` observations through the design gate. The tier is STANDARD and only one reading of the intent is plausible, so there is nothing to escalate. What would change this to a return: a seed file that fails to apply on a freshly migrated database, a restore row that differs from what its migration writes in a way a test can observe, or derive-tests running without regenerating tests/generated first.
