  - "adapter-wrong R-5.25: evaluationIndividualListSwu.submitDisabledUntilComplete returns controlState's string ('enabled', 'disabled' or 'absent'), which is truthy in every case, so an offered and enabled 'Submit Scores for Consensus' reads as withheld; it must return an empty string when the control is present and enabled, and a non-empty reason only when it is disabled or not offered"
  - "adapter-wrong R-1.17: opportunitySwuEdit.teamQuestionsTab opens the sidebar 'Team Questions' tab under OPPORTUNITY EVALUATION, which is the proponents' team-question scoring table, not the opportunity's list of questions; it must read the saved opportunity's own team questions, in the order listed, from the 'Opportunity' tab's 'Team Questions' section"
  - "product-question R-1.1"
