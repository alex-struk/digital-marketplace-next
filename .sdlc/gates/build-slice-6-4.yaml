rationale: |2-
  The question is whether slice 6 does what its seven criteria say. Verify, recorded against this proposal's application tree, passed R-7.13, R-6.18, R-6.23, R-6.28, R-4.16 and R-4.33, and reported R-6.24 unbound: the delay proxy's control interface answered 404 at the target's mail catcher, and no such proxy runs anywhere in the target's sandbox. An unbound result cannot be approved. The gap is in what build owns. The new target's sandbox is defined in app/compose/compose.yaml, which sends the backend's mail straight to Mailpit (SMTP_HOST: mail) and publishes only Mailpit on 8025, so there is nothing that can hold delivery back. The test does not overreach: R-6.24 asks that the administrator is told at once while messages are still being sent, and holding delivery is the only way to observe that from outside the application. The rest of the diff fits its criteria: the announcement is offered only on the terms page's managing screen, it withdraws every vendor's acceptance and keeps lastAcceptedTermsAt, it answers before reading recipients, the message names all three programs, the broadcast skips recipients with no address and carries on past refused ones, and the legal section's warning and re-acceptance are covered by unit and end-to-end tests. The ruling would become an approval once the sandbox carries the delay proxy and a verify run against the resulting tree shows R-6.24 bound and passing with the other six still passing.
reprompt: |2-
  You ruled return. "app/compose/compose.yaml: give the new target a mail catcher set up the way spec/contract/observables.yaml delivery_delay describes and .sdlc/oracle/compose.yml already does for the oracle. 1) Add a Toxiproxy service (the oracle's mail-hold, ghcr.io/shopify/toxiproxy) with one proxy named smtp, listening on 1025 and forwarding to the mailpit container's port 1025, and point the backend's SMTP_HOST at it, so every message goes through the proxy. 2) Serve the published port 8025 through a small front, as the oracle does with Caddy: mailpit's API at the root, unchanged, and the proxy's control API (8474) under /hold. Then GET http://localhost:8025/hold/proxies/smtp/toxics answers 200 with [], POST to it adds a latency toxic named hold, DELETE .../toxics/hold removes it, and POST /hold/reset clears every toxic. Mailpit's chaos fault injection (delivery_fault) must keep working. This is what verify's unbound result for R-6.24 showed: GET /hold/proxies/smtp/toxics answered 404 from the catcher, and no proxy was found anywhere on the sandbox. Add a line to app/README.md or a decision record saying the mail path now goes through the delay proxy." asks for spec/contract/observables.yaml, which build cannot deliver — build delivers app, docs/decisions, and everything else its workspace carries is there to be read. A condition it cannot carry out is one it either fails at or finds a way round, and the second is reported as done. no stage in this pipeline delivers it, so no ruling can ask for it; say what this proposal must do instead, and take the rest up outside the pipeline.
