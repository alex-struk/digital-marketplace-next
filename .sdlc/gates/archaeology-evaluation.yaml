rationale: |2-
  The question is whether this is what the evaluation domain does and which of it is the contract, and the ruling is approve: thirty criteria, all graded inferred or open, is the honest outcome for a panel feature that arrived in 2024 and 2025 with no documentation written for it, and the missing recommendation line in the proposal header is a resumed-run artifact rather than a gap in the archaeology — the domain file, the two panel personas and the seventeen surface pages are all present and the checks pass. I confirmed three rows because reading the cited code left no other reading rather than because I wanted them moved: D-evaluation-1 because validateSWUEvaluationPanelMembers and its Team With Us twin at validation.ts:487-528 are the same four rejections clause for clause, with MIN_SWU_EVALUATION_PANEL_MEMBERS and MIN_TWU_EVALUATION_PANEL_MEMBERS both 2 at config.ts:32 and :34, so every part of the statement maps to a specific refusal in both programs; D-evaluation-10 because the uniqueness check and its message are verbatim at evaluations.ts:243 in both programs. Five rows I ruled as defects rather than sending them back as questions, because each is a decision this persona owns and leaving them open costs another archaeology run to be told the same thing. D-evaluation-3 is real: the docstring at validation.ts:891-894 claims one and only one chair while the check at :938 rejects only more than one, so zero passes, and swu-evaluation-panel.tsx:83 refuses to submit without a chair — a chairless panel is a dead end, since the chair is the only person who can record a consensus, so the service must adopt the form's rule. D-evaluation-26 is confirmed at permissions.ts:894, where isGovernment plus a permissive opportunity status is the whole test: any public sector employee in the system can read any panel member's candid notes on a proponent once the code challenge starts, and nothing suggests that was intended. D-evaluation-27 is confirmed at permissions.ts:955-977, where the consensus read genuinely requires panel membership; the panel's independence during consensus is deliberate and I am leaving it, so what is defective is the browser turning the refusal into an empty list with no reason. D-evaluation-28 is the case where the service finalises on a partial set and strands a proponent in the question stage, neither screened in nor screened out, which is the one outcome the stage must never produce. D-evaluation-29 is a straight disagreement between a browser that offers finalising to administrators alone and a service that accepts it from the owner too; I am ruling for the service's wider set and requiring the browser to match. D-evaluation-21 I confirmed on its two preconditions, both verified verbatim at sprint-with-us/index.ts:1510 and :1527 and team-with-us/index.ts:1002 and :1019, and marked defective only for the copied message: Team With Us tells the user about the Code Challenge when its next stage is the Challenge. Everything I have not named stands exactly as recovered and returns on ratify-evaluation-1; in particular D-evaluation-12 needs no human ruling there, because validating on submit and not on draft is the same pattern the opportunities and proposals domains already use. What would change this ruling is evidence that the citations do not hold — if a spot-check of the rows I confirmed found the code says something else, or if the resumed run turns out to have lost criteria rather than only its prose.
