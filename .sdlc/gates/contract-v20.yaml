rationale: |2-
  The question is whether contract-v20 gives the two owed criteria something a blind test can act through. R-5.3 says an evaluator gets one evaluation per proponent, and a second attempt is refused with a message. R-5.32 says finalising the consensus records each proponent's agreed scores in their history. My ruling is to approve. For R-5.3, the pages evaluation-individual-request-swu and -twu gain an action, create_evaluation_by_request, plus two observations: evaluation_created and creation_refusal_message. openapi.yaml gives the exact refusal: 409 with {"conflict": ["You already have a team question evaluation for this proposal."]}, and "resource question" for Team With Us. That wording matches the criterion's 'then' clause word for word. The file says 409 because the author asked the running service and got 409, even though reading the old handler suggested 400; the live answer is the better evidence. Proving that no second evaluation is created cannot be done by listing evaluations, because the service only lists them at the consensus stage. The page offers a sound substitute: stored_scores for users.staffOne must still return the seeded draft's 3, 3, 3, 3. The untouched second proponent answers 201, which lets a test tell this refusal apart from a refusal for any other reason. For R-5.32, the pages proposal-swu-view and proposal-twu-view gain a history_entries observation. Its comment warns that the score note and the screened-in status share a timestamp, so a test must find the entry by its kind, not its position. It also says only an administrator or the opportunity's owner can read the history. I checked the seed against its handles. In 010-sprint-with-us-stages.sql, top, good, low and below are 5/5/5/5, 4/4/4/4, 3/3/3/3 and 5/5/5/2. Opportunity 29 therefore seeds 5555, 5544, 4444, 4433, 3333 and 5552, exactly as manifest.yaml and seed.ts list them, and the sixth proponent is below a minimum. That is the starting condition R-5.32 describes: six proponents, five of whom met every minimum. The Team With Us copy, opportunity 37, matches the same way. Opportunities 29 and 37 are separate copies because R-2.29 finalises the originals and finalising cannot be undone, which keeps the tests independent. The author ran the oracle, meaning the old application brought up with this seed, from a fresh start. The whole seed loaded without errors. Both refusals and both history notes appeared through the application, and nothing was left running. The one gap they list is that the YAML files were not checked with a parser. That is covered here: the seed loaded, and the generated seed.ts and surface.d.ts agree with the manifest. The pages, personas, sign-ins and observables approved at earlier gates are untouched. No criterion's wording or confidence changes, so there are no condition lines. The ruling would change to return if calibration found that the oracle's history note does not give the scores question by question for the proponent below the minimum, or if the create request turned out to need :userId instead of taking the evaluator from the session.
