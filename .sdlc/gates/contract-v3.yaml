rationale: |2-
  The question is whether this is the contract the tests will act through, and it is. The gap this run closes is the one the previous G1 ruling named and deferred: the evaluation domain had no given-clause a test could arrange, because an opportunity closes only when its deadline passes and no form accepts a past deadline. Seeding the condition rather than the outcome is the correct shape of that fix. Both opportunities are written PUBLISHED with a lapsed deadline and their proposals SUBMITTED, and no score, evaluation, consensus or anonymous name is seeded, so what a test reads is what the application decided rather than what the seed asserted. I checked the load-bearing claims against the old application rather than against the journal. The vendor session route builds its lookup as `test-vendor-${request.params.id}` at routers/auth.ts:317, so /auth/createsessionvendor/11 reaches the new competing-vendor persona, while the government and administrator routes use fixed identity-provider ids and take no parameter, which is exactly why the second staff member and second administrator remain unavailable. The mail finding is accurate and important: handleSWUReadyForEvaluation is called without await, from inside the closing transaction, at db/opportunity/sprint-with-us.ts:1525-1528, so the observables note describes a real property of the target and does not guess at the cause; a notification criterion that expects a closure message and gets none has found something, and recording it as measurable rather than assumed is the right call. The seed reconciles with the schema: FULL_STACK_DEVELOPER exists only because 20230419130229 renames service area id 1, and the seed correctly selects by name rather than by that id; twuResources gained its `order` column in 20240116093913; anonymousProponentName defaults to empty and not null per 20200403095356, so leaving it for the application is right; and the panel tables are keyed on (opportunityVersion, user) with no identifier of their own, which is what the fix turn's version-as-panel-id correction reflects. The migration count of 78 matches the tasks directory. The failing `generated` check is real but is not a defect in this stage's work: regeneration is a post-merge tooling step, and the equivalent commit for contract-v2 (4df7a26) landed after that merge and was authored by the pipeline, not the proposing agent, so this proposal sits in exactly the state contract-v2 was approved in. Its shape corroborates the diff rather than contradicting it, since only personas.ts and seed.ts are stale while surface.d.ts still matches, which is what a new persona plus new seed records plus a comment-only surface change should produce. I carry forward the previous ruling's condition in substance: derive-tests must regenerate tests/generated from this contract before it writes anything, or the value of this run never reaches the tests. The run record under .sdlc/runs/ is clean, carrying only the two ordinary lines for this run, so the fix turn's restoration holds. Nothing here contradicts J2: no file under sources/old/ is touched, and the seed carries synthetic placeholder names and example.test addresses as J3 requires. The three declared limits are honest and none is grounds for return. The six-proponent criterion should report unbound rather than force six qualified organizations that would change every user and organization listing. The two-person panel is an oracle identity limit rather than a design choice, and I note for calibration that folding the chair onto a scoring administrator means any criterion about a chair who does not score, or about two evaluators beside a separate chair, must report unbound rather than pass, because it could otherwise be satisfied for the wrong reason. The stage could not run a YAML parser and said so instead of claiming verification it did not have; I could not run one either under the same sandbox restriction, but the generated check parsed personas.yaml and manifest.yaml to produce its specific mismatch, which is indirect evidence both load, and the reworked observables note is a valid folded block scalar on reading. Tier is STANDARD and no escalation trigger applies. What would change this ruling is evidence that a seed file fails to apply against a freshly migrated database, that a recovered route or persona misdescribes the application in a way the seed cannot compensate for, or a decision to run derive-tests without regenerating tests/generated from this contract first.
