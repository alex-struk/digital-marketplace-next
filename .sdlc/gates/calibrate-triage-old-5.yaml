rationale: |2-
  The question was which of the 28 criteria failing against the old target were caused by this project's own adapter. Ruling: approve, with one triage line per criterion: 24 adapter-wrong and 4 product-question. The adapter and the tests are unchanged since the run calibrate-triage-old-4 ruled on (git diff 4c2f3bf..HEAD over tests/adapters/old and tests/acceptance is empty), so the faults named there come back. The largest is on the Code With Us create form: its '3. Details' step also requires 'Acceptance Criteria*' and 'Evaluation Criteria*', which the test input never carries. The adapter leaves both blank, so Publish and Submit for Review stay disabled and 17 criteria stop before reaching what they test. The saved snapshots also show new binding faults. saveServiceAreas and organizationEdit.saveChanges never confirm the 'Are you sure?' and 'Save Changes?' dialogs (R-3.28, R-8.28). addAddendum never confirms 'Publish Addendum?' (R-1.35). A disabled 'Save Changes' or 'Disqualify', or a missing 'Cancel' action or 'Addenda' tab, is the refusal the test asks about, but the adapter throws instead of returning (R-4.27, R-2.34, R-1.28, R-1.32). fieldError() drops the list item naming the unregistered address in the 'Unable to Add Unregistered Team Members' alert (R-3.30). The attachment control never selects 'Edit' on a draft whose page says to (R-8.25, R-8.31). A Sprint With Us 'Save Draft' stays on /create while landOn hides its timeout (R-1.48, R-1.53). The proposal terms are opened through a top-bar Submit disabled by blank proponent fields (R-1.31). Four go to the product owner because the adapter did what the test asked. R-4.31: vendor.one's profile genuinely shows Status Inactive with only 'Reactivate Account'. R-6.26: the 'Vendors Notified' alert rendered and no mail reached vendor.one, an inactive account. R-3.32: the invitation succeeded and the Team table lists members by name ('Indigo Placeholder Pending'), never by email. R-4.32: the export dialog opens with every box already ticked and Export an enabled link. Caveats for the product owner: in R-1.35 the edit showed 'Opportunity Changes Published' and the author (staff.one, Casey Placeholder) received no mail. In R-2.34 the page shows the proposal as Non-compliant with its history withheld until the Challenge. Seed accounts left altered by earlier runs (vendor.one inactive, staff.one showing admin-only links) may skew those results. What would change this ruling: a fresh run, with these adapter defects fixed, that still fails a criterion at the same assertion. That criterion would come back as a product question.
