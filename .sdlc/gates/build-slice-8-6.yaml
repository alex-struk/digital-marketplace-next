  - "addressed-to bind-adapter: content-service-level-agreement-link.answer_at_link_target looks for the service level agreement link again after follow_service_level_agreement_link has already navigated to the page it leads to. That page carries no such link, so the reader returns an empty string, and R-7.18 fails although /content/service-level-agreement answers with the page (its title, dates, body and address are all in main). Read the answer from the page the link led to."
