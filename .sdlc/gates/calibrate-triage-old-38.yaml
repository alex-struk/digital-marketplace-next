rationale: |2-
  Question: which of R-1.17 and R-7.26's failures against old did this project's adapter cause. Ruling: approve, sorting both as adapter-wrong. R-1.17: in the Team With Us draft row the draft demonstrably saved (the page shows its title and it has an identifier), but opportunityTwuEdit.resourceQuestionsTab clicked the sidebar's 'Resource Questions' link under Opportunity Evaluation and returned the sidebar and summary rather than the opportunity's own Resource Questions step, where an authored question is held. Its fieldError also substitutes a step title ('6. Team Questions is incomplete') when the form names no field, which fails the empty-guideline rows on something the page never said about a field and lets the empty-question row pass only because the step title contains 'Questions'. The 102-question row timed out with nothing to read, which looks like old accepting the submission; that is a product matter and will come back through triage once the binding is fixed. R-7.26: of the test's checks, the only image check that can come back as an empty string is fileEmbeddedImage.imageRenderedInPublishedText. imageInsertedIntoText returns the whole body, which already holds text; changesPublishedSuccess cannot be excluded from the log, so this attribution is inferred. imageRenderedInPublishedText's own comment says it reads the published /content/<slug> page, but it never opens it and reads images beside the heading on the edit screen still showing after Publish Changes, so it returns empty. imageInsertedIntoText also returns the whole body, so it would be truthy with no image inserted. What would change this: if the rebound readers still fail with no adapter fault left, both return here as product questions.
conditions:
  - "adapter-wrong R-1.17: opportunityTwuEdit.resourceQuestionsTab read the sidebar's 'Resource Questions' link under Opportunity Evaluation (proposal scoring) and returned sidebar and summary text; it must read the opportunity's own Resource Questions step inside the Opportunity tab, where authored questions are listed. Also, opportunityTwuCreate/opportunitySwuCreate.fieldError report '<step> is incomplete' when no field message is shown; they must return only what the page says against fields, never a step title, which currently fails the empty-guideline rows on text the page never said about a field and makes the empty-question row pass on the word 'Questions'."
  - "adapter-wrong R-7.26: fileEmbeddedImage.imageRenderedInPublishedText never opens the published /content/<slug> page and reads images beside the heading of the edit screen left after Publish Changes, answering empty; it must open the published page for the slug and read the body's images there. imageInsertedIntoText returns the whole body text, which is truthy with no image in it; it must return the inserted image reference (the FILE_ID or /api/files/ marker) and empty when none was inserted."
