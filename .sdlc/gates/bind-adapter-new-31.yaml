rationale: |2-
  Question: does bind-adapter-new-31 answer request 7 from build-slice-7 (name which step of R-8.17 read '' and why) and bind correctly on target new? Ruling: escalate to the pipeline owner, because the reason this cannot be settled is the pipeline itself. The proposal blames bytesGiven for misreading the size the test asked for, so the adapter sent a few-byte stand-in that the service stored. The test in this checkout contradicts that. tests/acceptance/files/R-8.17.spec.ts never states a size: it passes content: Buffer.alloc(limit.bytes, 0x61), about 11 MB, to uploadFileStatingItsReadAccess. uploadGiven forwards that as content, and tests/fixtures/upload.ts:81 writes the file from it, so bytesGiven never decides this file's size. The change is harmless and narrow, and it typechecks according to the runner, but it does not reach the failure it cites. So request 7 is still unanswered after three sends, past the policy.loops.request limit of 2. The account that decided this is the bind-adapter run's own statement that its workspace has no tests/acceptance/ and no node_modules. A stage asked to 're-run R-8.17 and report which step read empty' cannot see the test's input or run it. And verify's result for R-8.17 names only 'a toBeTruthy assertion' when the test holds three, which is the gap the request was written to fill. Neither is something a bind-adapter revision can fix, and returning it again would buy a fourth guess. What would change this ruling: a verify result for R-8.17 that names the failing assertion along with the HTTP status and body of the upload, or a bind-adapter workspace that holds the acceptance test it is asked about. With either, the cause can be found against evidence and the proposal ruled at G3 on that.
