rationale: |2-
  Question: do the nine organizations tests follow from their criteria and nothing else? Approve. The runner's typecheck reports no diagnostics under acceptance/organizations (the one failure is in adapters/new, outside this proposal), and the tests/results/old/applied.yaml removals are the same bookkeeping the preceding approved derive-tests proposal carried. Each of the five rewrites answers its redo: R-3.3 establishes the staff member's lack of rights from their own account type rather than a permissions statement; R-3.12 and R-3.13 treat an attempt the page does not let through as the refusal and assert only that rights and ownership did not move, with no message required; R-3.28 establishes the two starting approvals, clears one, ticks a third and polls after the save; R-3.26 establishes approval and terms before reading and skips as blocked when the given cannot be built. R-3.13 departs from its ruling by testing the transfer half rather than recording it blocked, and that is correct: the ruling's premise was that an invitation had to be answered first, and the seeded qualified organization already holds an active member, so the criterion is reachable and a test beats a blocked entry. The four owed tests use exactly the observations the contract added (invite_with_membership_type with the interface's own third type as the rejected one, refused_when_not_permitted for three non-vendor kinds of person, organizations_offered against a given built through the surface, follow_link_in_body with the matching confirmation read and the other absent), and none asserts a status, message or field the criterion does not state. Two tests are weaker than their criterion rather than broader, which is not grounds to return: R-3.28 reads the owner's lack of an editing control only as an attempt that changes nothing, because the contract has no observation of whether the control is offered, and R-3.3 checks the staff account type for the word 'admin' as a precondition on the given, not as the outcome. The owed missing-test conditions for R-3.15, R-3.17, R-3.20 and R-3.35 stay open until calibration runs those tests. What would change this ruling: a calibration run showing that the adapter reads the input shapes the author guessed (the invitation's fields, the Accept/Decline link labels, service_area_checkbox naming only approved areas) differently, in which case the failures would be sorted as adapter-wrong or returned for re-derivation.
