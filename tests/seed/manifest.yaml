stored_files:
  # Stored files. The bytes are in the database like the record, so each is served in
  # full. Neither carries any read-access rows, so each is readable by its uploader and by
  # nobody given rights through those rows. Their content identifiers are invented rather
  # than the digest the application would compute (see 012-files.sql).
  privateOfFileUploader:
    id: 00000000-0000-4000-8000-000000000901
    name: private-note.txt
    uploaded_by: users.fileUploader
    contents: A private note that only its uploader may read.
    for: [R-8.15, R-8.22]
  teamWithUsProposalAttachment:
    id: 00000000-0000-4000-8000-000000000902
    name: team-with-us-proposal-attachment.txt
    uploaded_by: users.organizationOwner
    attached_to: proposals.teamWithUsOne
    contents: An attachment to a seeded Team With Us proposal.
    for: [R-8.9]

not_seeded:
  # Named so that a later stage does not go looking for these and conclude they were
  # forgotten. A test builds each of these through the pages, and addresses what it built
  # by reading the identifier off the screen the application lands it on: creating an
  # opportunity, a proposal or an organization ends on that record's own screen, and
  # spec/contract/surface.yaml gives each of those screens an observation returning the
  # identifier its address holds — opportunity_identifier, proposal_identifier,
  # organization_identifier. A handle below is the identifier itself and is passed
  # straight to a route; a record a test creates has no handle and must be read this way.
  - what: draft, under-review and still-open opportunities in any program
    why: >-
      Each is something a test can build through the pages, and building it is also the
      only way to be sure the shape it gets is the shape the application makes. Only the
      states the form cannot reach — a deadline already in the past, and the evaluation
      stages that lie behind one — are written into the seed.
  - what: proposals against still-open opportunities
    why: >-
      A proposal's shape depends on the opportunity it answers, and a vendor can make one
      through the pages against the published Code With Us opportunity or an opportunity
      the test publishes. Tests build these.
  - what: stored files other than the two above
    why: >-
      A test that needs a file it uploaded uploads it (file-upload), and reads its
      identifier off the answer. The two seeded files are the ones no test could arrange:
      one whose uploader a second person then names, and one attached to a proposal whose
      opportunity has already closed.
  - what: score-entry events in any proposal's history
    why: >-
      The later-stage opportunities carry the scores their stage implies, and the history
      a proposal shows is its status rows. The events the application writes when a score
      is entered ("score entered", "price score entered") are the outcome of entering one,
      so the only such events are the ones a test's own scoring produces.
  - what: an addendum on an awarded opportunity
    why: >-
      Criteria about the full report of a completed opportunity name its addenda. Neither
      awarded opportunity carries one; a test that needs one adds it (add_addendum) before
      reading the report, since an addendum can be added to an awarded opportunity.
