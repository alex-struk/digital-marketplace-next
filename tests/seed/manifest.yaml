evaluation_panels:
  # Two members each, and that is an oracle limit rather than a design choice: consensus
  # begins only once every evaluator on a panel has submitted, so a panel member no
  # sign-in route reaches would make the whole of consensus untestable. The oracle has two
  # public sector sign-ins, so the panel is the government account as an evaluator and the
  # administrator account as chair. The administrator is also an evaluator, because a
  # two-person panel whose chair does not score leaves one evaluator and the criteria
  # describe two. The criteria that turn on two evaluators beside a separate chair, or on
  # a chair who does not score, are unreachable on the oracle for the same reason
  # users.staffTwo cannot be signed in as.
  #
  # A panel has no identifier of its own: its rows are keyed by the opportunity version
  # they hang off, so that version's identifier is what addresses the panel.
  sprintWithUs:
    id: 00000000-0000-4000-8000-000000000711
    opportunity: opportunities.closedSprintWithUs
    members:
      - { user: users.staffOne, chair: false, evaluator: true, order: 0 }
      - { user: users.administratorOne, chair: true, evaluator: true, order: 1 }
  teamWithUs:
    id: 00000000-0000-4000-8000-000000000811
    opportunity: opportunities.closedTeamWithUs
    members:
      - { user: users.staffOne, chair: false, evaluator: true, order: 0 }
      - { user: users.administratorOne, chair: true, evaluator: true, order: 1 }

