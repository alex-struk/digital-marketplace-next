  # 000-installation.sql restores them after the harness empties the tables; each is fixed
  # at its address, titled by that address, holds the body "Initial version" and names no
  # person as its author. A page's address is what every content route takes, so each
  # handle's id is its address. The seed never changes these; a test that changes one
  # changes it for itself only, since the data is put back before the next test.
  #
  # Counting pages: the list holds these twenty-two plus the three ordinary pages above.
