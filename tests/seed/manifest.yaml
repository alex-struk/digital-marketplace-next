# Handles the acceptance suite uses to refer to seed data.
#
# tests/seed/*.sql is applied in ascending name order into the oracle's database after
# the application's own migrations have run and before any test does. Every handle below
# names one record those files insert. A test refers to a record by its handle; the
# identifier is here so the handle can be resolved, not so a test can carry it around.
#
# Everything here is invented. Names are placeholders, every address is on example.test,
# and no record corresponds to a real person or company.
description: seed data handles for the acceptance suite

files:
  - 001-users.sql
  - 002-organizations.sql
  - 003-content.sql
  - 004-opportunities.sql

