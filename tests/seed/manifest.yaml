opportunities:
  publishedCodeWithUs:
    id: 00000000-0000-4000-8000-000000000601
    program: code-with-us
    status: PUBLISHED
    title: Seeded published Code With Us opportunity
    created_by: users.staffOne
    proposal_deadline: 2030-06-01T23:59:00Z
    reward: 5000
    remote_ok: true
  draftOfOtherStaff:
    id: 00000000-0000-4000-8000-000000000602
    program: code-with-us
    status: DRAFT
    title: Seeded draft Code With Us opportunity of another staff member
    created_by: users.staffTwo
    note: >-
      Exists so that a criterion about one staff member not seeing another's unpublished
      work has something to be about. No test can create it, because the oracle has no
      sign-in route that reaches its owner.

  # The two opportunities that exist so the evaluation criteria have a starting point.
  # Each is seeded PUBLISHED with a proposal deadline thirty days in the past. That is the
  # condition and not the outcome: the application's own hook closes a published
  # opportunity whose deadline has passed, moves its submitted proposals to review and
  # writes each proposal's anonymous name, and it runs in front of every request to a
  # route under /api and to /status. So by the time a test looks, the status is
  # EVAL_QUESTIONS_INDIVIDUAL because the application put it there. A test that wants to
  # be sure can request /status first, which spec/contract/surface.yaml names as
  # scheduled-transition-trigger.
  #
  # There is no seeded score, no seeded evaluation and no seeded consensus anywhere. Those
  # are what the criteria are about.
  closedSprintWithUs:
    id: 00000000-0000-4000-8000-000000000701
    program: sprint-with-us
    version_id: 00000000-0000-4000-8000-000000000711
    seeded_status: PUBLISHED
    status_after_the_application_closes_it: EVAL_QUESTIONS_INDIVIDUAL
    title: Seeded closed Sprint With Us opportunity
    created_by: users.staffOne
    proposal_deadline: thirty days before the seed is applied
    total_max_budget: 500000
    phases: [IMPLEMENTATION]
    team_questions: 4
    question_with_minimum_score: 4
    weights: { questions: 25, code_challenge: 40, team_scenario: 15, price: 20 }
    panel: evaluation_panels.sprintWithUs
    proposals: [proposals.sprintWithUsOne, proposals.sprintWithUsTwo, proposals.sprintWithUsThree]
  closedTeamWithUs:
    id: 00000000-0000-4000-8000-000000000801
    program: team-with-us
    version_id: 00000000-0000-4000-8000-000000000811
    seeded_status: PUBLISHED
    status_after_the_application_closes_it: EVAL_QUESTIONS_INDIVIDUAL
    title: Seeded closed Team With Us opportunity
    created_by: users.staffOne
    proposal_deadline: thirty days before the seed is applied
    max_budget: 300000
    resources: [resources.teamWithUsDeveloper]
    resource_questions: 4
    question_with_minimum_score: 4
    weights: { questions: 30, challenge: 40, price: 30 }
    panel: evaluation_panels.teamWithUs
    proposals: [proposals.teamWithUsOne, proposals.teamWithUsTwo, proposals.teamWithUsThree]

  # Opportunities standing at later points, one per criterion that moves one on, so that
  # no criterion has to walk another's record through every stage first. Files 009, 010
  # and 011. Each names the criteria it was seeded for; one that nothing moves (a refusal,
  # a reading) is shared between the criteria that need it.
  #
  # Identifiers: 00000000-0000-4000-aNNN-000000000001 for opportunity NNN, its version
  # ...-000000000002, proposal p ...-00000000010p. All belong to users.staffOne (the
  # government account a sign-in route reaches) unless owner says otherwise, and every
  # Sprint With Us and Team With Us one has four questions scored out of five, the fourth
  # with a minimum score of three. The panel, unless panel says otherwise, is
  # users.staffOne as evaluator and users.administratorOne as chair and evaluator.
  #
  # "lapsed" means seeded PUBLISHED with its deadline thirty days past, so the
  # application closes it on the next request to scheduled-transition-trigger or any
  # route under /api (Code With Us to EVALUATION, the other two to
  # EVAL_QUESTIONS_INDIVIDUAL, submitted proposals to review with anonymous names).

  cwuLapsedWithDraft:
    id: 00000000-0000-4000-a001-000000000001
    program: code-with-us
    title: Seeded lapsed Code With Us opportunity with a draft
    seeded_status: PUBLISHED (lapsed)
    proposals: [proposals.cwuLapsedWithDraftDraft]
    for: [R-2.15]
    note: >-
      Its only proposal is a draft, by users.organizationOwner for organizations.qualified.
      Submitting it after the closure, and a second vendor creating a new proposal already
      marked submitted, are the two requests the criterion says are refused.
  cwuLapsedForScoring:
    id: 00000000-0000-4000-a002-000000000001
    program: code-with-us
    title: Seeded lapsed Code With Us opportunity for scoring
    seeded_status: PUBLISHED (lapsed)
    proposals: [proposals.cwuLapsedForScoringOne]
    for: [R-2.26]
  cwuLapsedWithThreeProposals:
    id: 00000000-0000-4000-a003-000000000001
    program: code-with-us
    title: Seeded lapsed Code With Us opportunity with three proposals
    seeded_status: PUBLISHED (lapsed)
    proposals: [proposals.cwuThreeOne, proposals.cwuThreeTwo, proposals.cwuThreeThree]
    for: [R-2.27]
    note: One to be disqualified and the other two scored; the last score moves it to processing.
  cwuLapsedAtFinalStage:
    id: 00000000-0000-4000-a004-000000000001
    program: code-with-us
    title: Seeded lapsed Code With Us opportunity at its final stage
    seeded_status: PUBLISHED (lapsed)
    proposals: [proposals.cwuFinalStageOne, proposals.cwuFinalStageTwo]
    for: [R-1.25]
  cwuLapsedForAward:
    id: 00000000-0000-4000-a005-000000000001
    program: code-with-us
    title: Seeded lapsed Code With Us opportunity for an award
    seeded_status: PUBLISHED (lapsed)
    proposals: [proposals.cwuForAwardOne, proposals.cwuForAwardTwo, proposals.cwuForAwardWithdrawn]
    for: [R-2.33]
    note: >-
      Two submitted and one withdrawn before the deadline. The criterion's given — one
      evaluated, one disqualified, one withdrawn — is reached by scoring the first and
      disqualifying the second (with a reason); scoring the last one in contention moves it
      to processing, where the award is made.
  cwuLapsedForAwardNotices:
    id: 00000000-0000-4000-a006-000000000001
