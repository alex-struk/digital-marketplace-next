not_seeded:
  # Named so that a later stage does not go looking for these and conclude they were
  # forgotten. A test builds each of these through the pages, and addresses what it built
  # by reading the identifier off the screen the application lands it on: creating an
  # opportunity, a proposal or an organization ends on that record's own screen, and
  # spec/contract/surface.yaml gives each of those screens an observation returning the
  # identifier its address holds — opportunity_identifier, proposal_identifier,
  # organization_identifier. A handle below is the identifier itself and is passed
  # straight to a route; a record a test creates has no handle and must be read this way.
  - what: Sprint With Us and Team With Us opportunities other than the two closed ones above
    why: >-
      A draft, an under-review or a still-open opportunity in either program is something
      a test can build through the pages, and building it is also the only way to be sure
      the shape it gets is the shape the application makes. Only the state the form
      refuses — a deadline already in the past — is written into the seed.
  - what: proposals against opportunities other than the two closed ones above
    why: >-
      A proposal's shape depends on the opportunity it answers, so seeding one means
      seeding the opportunity's whole shape first. Tests build these through the pages.
  - what: stored files and attachments
    why: >-
      A file record points at bytes on the application's own disk. A row without the
      bytes is a file the application cannot serve, so tests upload what they need.
  - what: evaluations, consensuses and scores
    why: >-
      They hang off proposals, and the criteria that concern them describe the act of
      recording a score rather than a score that was already there. The two closed
      opportunities give those criteria somewhere to start; what happens next is the
      application's and belongs in the test.
  - what: an opportunity with six proponents
    why: >-
      One criterion describes six proponents, five of whom met every minimum score. The
      seeded opportunities carry three, which is what the rest of the evaluation criteria
      describe. Six would mean six qualified organizations and six vendor accounts seeded
      for the sake of a single criterion, and it would change what every list of
      organizations and of users contains. That criterion is expected to report unbound
      rather than to fail.
