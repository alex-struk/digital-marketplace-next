# Handles the acceptance suite uses to refer to seed data.
#
# tests/seed/*.sql is applied in ascending name order into the oracle's database after
# the application's own migrations have run and before any test does. Every handle below
# names one record those files insert. A test refers to a record by its handle; the
# identifier is here so the handle can be resolved, not so a test can carry it around.
#
# Everything here is invented. Names are placeholders, every address is on example.test,
# and no record corresponds to a real person or company.
description: seed data handles for the acceptance suite

files:
  - 000-installation.sql
  - 001-users.sql
  - 002-organizations.sql
  - 003-content.sql
  - 004-opportunities.sql
  - 005-evaluation-proponents.sql
  - 006-swu-evaluation.sql
  - 007-twu-evaluation.sql
  - 008-more-accounts.sql
  - 009-code-with-us-stages.sql
  - 010-sprint-with-us-stages.sql
  - 011-team-with-us-stages.sql
  - 012-files.sql
  - 013-content-pages.sql

# Before every test the harness empties every table except the migration bookkeeping and
# applies these files again. 000-installation.sql puts back what the application's
# migrations had put into ordinary tables — the service areas, the twenty-two pages the
# service needs, and the migration's own account — so that each test starts from a
# freshly migrated installation plus the seed, and not from an installation missing
# them.

