redo:
  - id: R-6.23
    version: 1
    why: the test expects a message for vendors it assumes are active without
      establishing that they are active when the announcement is made, and the
      first one it polls is an account another test in the suite leaves
      deactivated; the criterion promises a message only to active vendors, so
      establish the active and deactivated vendors the given names before
      announcing and check each group against what the criterion says it should
      receive
  - id: R-6.28
    version: 1
    why: the test polls vendors it assumes are active without establishing it, the
      first being an account the suite leaves deactivated, so one timeout ends
      the check before any other vendor is looked at; establish that every
      vendor polled is active at the moment of the broadcast, keep the vendor
      holding no email address among the recipients, and report every
      addressable vendor not reached rather than stopping at the first
  - id: R-6.26
    version: 2
    why: the test polls vendors it assumes are active without establishing it, the
      first being an account the suite leaves deactivated, so one timeout ends
      the check before any other vendor is looked at; establish that every
      vendor polled is active at the moment of the broadcast, keep the vendor
      holding no email address among the recipients, and report every
      addressable vendor not reached rather than stopping at the first
  - id: R-1.3
    version: 1
    why: the test signs in as the member of public sector staff without establishing
      that the account holds no administrator rights at that moment, and another
      test in the suite grants that account administrator rights during the same
      run; the criterion is about staff who are not administrators, so establish
      that before listing opportunities
  - id: R-1.21
    version: 1
    why: the second half reads the refusal from an opportunity that was never saved
      as a draft, which the criterion does not describe, and both halves sign in
      as public sector staff without establishing that the account holds no
      administrator rights, which another test in the suite grants during the
      same run; submit a saved draft as a staff member who is not an
      administrator, treat a draft that cannot be submitted and keeps its status
      as refused, and read what that person is told
  - id: R-4.14
    version: 1
    why: the test assumes both accounts it names are active without establishing it,
      and another test in the suite leaves one of them deactivated, which
      correctly places it after every active account in the order the criterion
      describes; it also reads the narrowed list without allowing the list time
      to narrow after the name is typed; establish both accounts as active
      before comparing their order, and let the list settle before reading it
  - id: R-4.31
    version: 2
    why: the test uses another person's profile as proof that the screen offers a
      deactivation control, without establishing that person's account is
      active, and another test in the suite leaves it deactivated, so the
      control it expects there is legitimately absent; establish an active
      account for the comparison before looking for the control
  - id: R-4.32
    version: 1
    why: the test assumes nothing is chosen when the export choices open, which the
      criterion never says; establish that no kind and no field are chosen
      before checking that export is unavailable, then check it becomes
      available only once at least one kind and one field are chosen
