redo:
  - id: R-6.23
    version: 1
    why: the test expects a message for vendors it assumes are active without
      establishing that they are active when the announcement is made, and the
      first one it polls is an account another test in the suite leaves
      deactivated; the criterion promises a message only to active vendors, so
      establish the active and deactivated vendors the given names before
      announcing and check each group against what the criterion says it should
      receive
  - id: R-6.28
    version: 1
    why: the test polls vendors it assumes are active without establishing it, the
      first being an account the suite leaves deactivated, so one timeout ends
      the check before any other vendor is looked at; establish that every
      vendor polled is active at the moment of the broadcast, keep the vendor
      holding no email address among the recipients, and report every
      addressable vendor not reached rather than stopping at the first
  - id: R-6.26
    version: 2
    why: the test polls vendors it assumes are active without establishing it, the
      first being an account the suite leaves deactivated, so one timeout ends
      the check before any other vendor is looked at; establish that every
      vendor polled is active at the moment of the broadcast, keep the vendor
      holding no email address among the recipients, and report every
      addressable vendor not reached rather than stopping at the first
  - id: R-1.3
    version: 1
    why: the test signs in as the member of public sector staff without establishing
      that the account holds no administrator rights at that moment, and another
      test in the suite grants that account administrator rights during the same
      run; the criterion is about staff who are not administrators, so establish
      that before listing opportunities
  - id: R-1.21
    version: 1
    why: the second half reads the refusal from an opportunity that was never saved
      as a draft, which the criterion does not describe, and both halves sign in
      as public sector staff without establishing that the account holds no
      administrator rights, which another test in the suite grants during the
      same run; submit a saved draft as a staff member who is not an
      administrator, treat a draft that cannot be submitted and keeps its status
      as refused, and read what that person is told
  - id: R-3.3
    version: 1
    why: the refusal of the member of public sector staff is read without
      establishing that the account holds no administrator rights at that
      moment, and another test in the suite grants that account administrator
      rights during the same run; establish that the staff member is not an
      administrator before opening the organization
  - id: R-3.7
    version: 1
    why: the test signs in as the organization's owner without establishing that the
      owner's account is active, and another test in the suite leaves that
      account deactivated; it also looks for the invitees' email addresses on
      the team list, which the criterion never says the list shows; establish an
      active owner, and identify the invitees on the team list without assuming
      it shows email addresses
  - id: R-3.8
    version: 1
    why: the test reads the refusal as an error on a form field, which the criterion
      never says it is; the criterion says the invitation itself is refused, so
      read the refusal of the invitation, and when checking that nobody was
      added do not assume the team list shows email addresses
  - id: R-3.15
    version: 1
    why: the test reads every organization on the vendor's own page of
      organizations, which also lists organizations they merely belong to,
      rather than only the organizations the criterion describes as those they
      may act on behalf of; read only the organizations the vendor is offered as
      ones they can act for
  - id: R-3.32
    version: 1
    why: the test identifies the invited person on the team list by email address,
      which the criterion never says the list shows; identify them on the team
      list without assuming it shows email addresses, both before and after they
      decline
  - id: R-4.14
    version: 1
    why: the test assumes both accounts it names are active without establishing it,
      and another test in the suite leaves one of them deactivated, which
      correctly places it after every active account in the order the criterion
      describes; it also reads the narrowed list without allowing the list time
      to narrow after the name is typed; establish both accounts as active
      before comparing their order, and let the list settle before reading it
  - id: R-4.31
    version: 2
    why: the test uses another person's profile as proof that the screen offers a
      deactivation control, without establishing that person's account is
      active, and another test in the suite leaves it deactivated, so the
      control it expects there is legitimately absent; establish an active
      account for the comparison before looking for the control
  - id: R-4.32
    version: 1
    why: the test assumes nothing is chosen when the export choices open, which the
      criterion never says; establish that no kind and no field are chosen
      before checking that export is unavailable, then check it becomes
      available only once at least one kind and one field are chosen
  - id: R-7.9
    version: 1
    why: the test reads being told the page was removed only from the page's main
      content and at once; the notice may appear anywhere on the screen, so
      allow time and read it wherever the screen shows it
  - id: R-7.12
    version: 1
    why: the test reads a page the criterion promises on a freshly prepared
      installation without establishing that the target it runs against is one;
      the target held none of the pages the service needs, so the absence says
      nothing about the criterion; establish that the installation carries its
      needed pages before reading the title and body of one
  - id: R-7.25
    version: 1
    why: the test opens a page the service needs without establishing that the
      target carries it, and it did not; establish that the page exists before
      looking for the warning and the ways to change it, and check that removal
      is genuinely not offered rather than accepting any reading
  - id: R-7.27
    version: 1
    why: the test opens a page the service created for itself without establishing
      that the target carries it, and it did not; establish that the page exists
      before reading who published it and who last changed it
  - id: R-7.22
    version: 1
    why: neither half completes the publish it starts, so nothing is ever sent to be
      refused; complete the publication as an administrator would, then read
      whether the address is reported as already in use
  - id: R-5.22
    version: 1
    why: the test reads the rejection the instant the entry is made, without
      allowing time for it to appear, and it leaves the comment empty by
      entering nothing into a comment that was already empty, so nothing about
      the comment changed; allow time for the mark, and enter a comment before
      clearing it
  - id: R-1.1
    version: 2
    why: the test reads the opportunity and its proposals immediately after the
      request that sets closure off, without allowing the closure to complete;
      allow time for each opportunity and its submitted proposals to reach their
      new state, reading each as a person entitled to see it, before concluding
  - id: R-1.24
    version: 1
    why: the test reads the proponent names immediately after the request that sets
      closure off, without allowing the closure to complete; allow time for the
      opportunity to reach evaluation before reading the names
  - id: R-1.8
    version: 1
    why: the test assumes a Team With Us opportunity can be saved as a draft holding
      only a title and a budget, which R-1.8 never says, and the refusal it met
      concerned the draft's content, not its program; save a draft the service
      accepts before reading which program it is filed under
  - id: R-1.53
    version: 2
    why: the test assumes a Team With Us opportunity can be saved as a draft holding
      only a title, which the criterion never says, so setup failed before any
      deletion was asked for; save a draft the service accepts before deleting
      it
  - id: R-1.35
    version: 1
    why: the test expects the author's notice to arrive addressed to the author by
      name, but the criterion names the author with the watchers and proponents
      as those told and never says the author is addressed individually, so the
      author's notice is as unobservable to the mail fixture as the watchers'
      notices the test already leaves unasserted; observe the author's notice in
      a way that does not depend on visible addressing, or record it as not
      observable
  - id: R-3.27
    version: 1
    why: the second attempt relies on another test having accepted the terms first,
      so it ran against terms nobody had yet accepted; accept the terms within
      the same test before trying again, and treat an organization whose terms
      can no longer be accepted, or whose second acceptance is turned away, as
      refused, with the date of the first acceptance unchanged
  - id: R-2.35
    version: 1
    why: the test reads the history as the vendor, whom the criterion never names as
      entitled to see it; read the history as someone entitled to see it, such
      as an administrator
  - id: R-4.5
    version: 1
    why: the return the criterion describes is signing in again, but the test's
      second sign-in admits the person without going through the ordinary
      sign-in a person makes, so it cannot show what signing in again does; sign
      the person in again the ordinary way before reading their status and their
      mail
  - id: R-4.9
    version: 1
    why: the test reads 'marked as deactivated by the person themselves' from
      whether an administrator is offered a reactivation control, which is what
      R-4.19 governs and R-4.9 never mentions; read the marking only from what
      R-4.9 itself describes, or leave it unasserted where nothing shows it
  - id: R-4.12
    version: 1
    why: the test takes the account-type label as the sign of administrator rights,
      which the criterion never says changes; read whether the person holds
      administrator rights; on a vendor's profile it demands a message on the
      page, where the criterion is met when no way to grant the rights is
      offered and the account is unchanged; and it requires an ordinary
      employee's own profile to show a statement of permissions, which the
      criterion never states
  - id: R-4.27
    version: 2
    why: the test reads the invalid field's mark the instant the value is entered,
      without allowing time for it to appear; allow time for the mark, treat a
      save that is withheld as the refusal, and check the stored profile is
      unchanged
