redo:
  - id: R-6.26
    version: 2
    why: the test polls vendors it assumes are active without establishing it, the
      first being an account the suite leaves deactivated, so one timeout ends
      the check before any other vendor is looked at; establish that every
      vendor polled is active at the moment of the broadcast, keep the vendor
      holding no email address among the recipients, and report every
      addressable vendor not reached rather than stopping at the first
  - id: R-5.22
    version: 1
    why: the test reads the rejection the instant the entry is made, without
      allowing time for it to appear, and it leaves the comment empty by
      entering nothing into a comment that was already empty, so nothing about
      the comment changed; allow time for the mark, and enter a comment before
      clearing it
  - id: R-5.19
    version: 1
    why: the test takes the status label shown to the panel member as proof they
      opened a draft, but the criterion never says a panel member is told the
      opportunity's state; confirm the panel member opened it by its own title
      and details, and that another public sector employee cannot see it
  - id: R-5.24
    version: 1
    why: the evaluator submitted after scoring only some of the proponents, so
      nothing was submitted and the evaluation stayed a draft that may still be
      changed; score every proponent completely and confirm the submission took
      effect before trying to change it
  - id: R-5.1
    version: 1
    why: the panels saved already named the draft's creator as chair and a second
      member, so adding people built a valid panel, and a vendor is never
      offered as a choice; start from exactly the one-person, two-chair and
      vendor panels the given describes, treating a panel that cannot be
      assembled or saved and leaves the opportunity's panel unchanged as
      refused, and keep requiring the rule to be named when the same person is
      named twice
  - id: R-5.9
    version: 1
    why: the panel offered still had the draft's creator as its chair, so it was
      valid and accepted; the criterion is about the service's own check on a
      panel with no chair, so put a panel that names no chair before the service
      and read whether it is refused
  - id: R-6.23
    version: 1
    why: the test tries to establish each vendor's standing acceptance, and later
      its withdrawal, from the administrator's view of the vendor, which never
      shows it, so it fails before any announcement is made; read each vendor's
      acceptance and the request to accept the new terms while signed in as that
      vendor
  - id: R-1.10
    version: 1
    why: the test demands a reason shown against a field the person never changed,
      and reads the over-length teaser's reason the instant it is entered; the
      criterion promises that the opportunity is refused and the field is named
      in the service's reply, not on the screen at once; treat a publication
      that stays unavailable as the refusal, allow time for any reason to
      appear, and check that nothing was published
  - id: R-1.11
    version: 1
    why: the criterion promises only that the opportunity is refused, never that a
      reason is shown; treat a publication that stays unavailable as the
      refusal, allow time for any reason to appear, and check that nothing was
      published
  - id: R-1.12
    version: 1
    why: the criterion promises only that the opportunity is refused, never that a
      reason is shown against a skill list the person never touched; treat a
      publication that stays unavailable as the refusal and check that nothing
      was published
  - id: R-1.14
    version: 1
    why: the criterion promises only that the opportunity is refused, and the test
      reads a reason the instant a date is entered; treat a publication that
      stays unavailable as the refusal, allow time for any reason to appear, and
      check that nothing was published
  - id: R-1.21
    version: 1
    why: the test establishes that the author holds no administrator rights by
      requiring a statement of permissions that an ordinary staff member's
      profile does not carry, so it stops before any submission; establish it
      from something every staff account shows, submit a saved incomplete draft,
      treat a draft that keeps its status as refused, and read what the author
      is told
  - id: R-1.3
    version: 1
    why: the test requires a statement of permissions to be shown for a member of
      public sector staff who holds no administrator rights, and such a person
      is shown none, so it stops before listing anything; establish that the
      account holds no administrator rights without depending on such a
      statement being present
  - id: R-1.55
    version: 1
    why: the fewer-than-two and no-chair tests saved panels that still held two or
      more members and a chair, the vendor test assumed a vendor could be
      chosen, and the Team With Us test never saved the draft it needed; build
      exactly each invalid panel the criterion names, treat one that cannot be
      assembled as refused, start from a Team With Us draft the service accepts,
      and keep requiring the reason when the same person is named twice
  - id: R-1.24
    version: 1
    why: the test sets closure off without first establishing that the lapsed Team
      With Us opportunity it relies on exists and can be read by an
      administrator, and on this target it could not, so the absence says
      nothing about the names; establish that the opportunity and its submitted
      proposals are present before closure, then wait for the names
  - id: R-1.39
    version: 1
    why: the list narrows a moment after a condition is chosen and the test read it
      before then; allow the list to settle after each choice before checking
      what remains and what is gone
  - id: R-3.12
    version: 1
    why: the test demands a message, but the criterion says only that changing one's
      own rights and changing the owner's are refused; treat a choice that is
      shown but cannot be changed as the refusal, and confirm afterwards that
      both people's rights are unchanged
  - id: R-3.3
    version: 1
    why: the test requires a statement of permissions to be shown for a member of
      public sector staff who holds no administrator rights, and such a person
      is shown none, so it stops before opening the organization; establish that
      the account holds no administrator rights without depending on such a
      statement being present
  - id: R-3.13
    version: 1
    why: the refusal of a pending member is that they cannot be chosen as the new
      owner and ownership is unchanged, and the criterion promises no message;
      assert that instead; the transfer half needs a way to answer the
      invitation that the suite does not yet provide, so record it as blocked
      until it does
  - id: R-3.28
    version: 1
    why: the test does not establish that the organization is approved for two
      service areas before editing, and it does not tick a third area as the
      given describes; establish the two starting approvals, clear one and tick
      a third, then read the approvals once the save has completed
  - id: R-2.13
    version: 1
    why: for a proposal with no complete proponent the criterion promises only a
      refusal, never a reason shown against a choice the person never made;
      treat a submission that stays unavailable as the refusal and check that no
      proposal was submitted, expecting the offending field to be named only in
      the text and comments cases, after allowing time for it
  - id: R-4.5
    version: 1
    why: the return the criterion describes is an ordinary sign-in, and the only
      sign-in this target completes is not one, so the test cannot show what
      signing in again does; sign the person in the ordinary way, and if the
      target offers no ordinary sign-in record the criterion as blocked rather
      than failed
