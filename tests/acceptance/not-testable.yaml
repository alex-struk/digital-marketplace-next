# Accepted criteria the acceptance suite cannot exercise through the surface, and why —
# written by `derive-tests` when a criterion has no path through any page's actions and
# observations, or added by hand when a person makes the same call. An entry here stands
# in for a spec file: `sdlc run calibrate` reports it as a `not-testable` row rather than
# a missing test.
criteria:
  - id: R-6.1
    version: 1
    reason: >-
      The given is a service configured with notifications switched off, and no page in
      the contract carries an action that switches them off — the setting is read once at
      start-up and the surface offers no route to it. The "then" also asks that no message
      reach anybody, while the Mail fixture searches by one recipient address at a time and
      has no way to ask whether the catcher is empty. Needs a way to run against a target
      with notifications disabled, and a mail observation of the catcher as a whole rather
      than of one named recipient.
  - id: R-6.2
    version: 1
    reason: >-
      The given is a service whose mail server is unreachable, which nothing in the
      contract can bring about: no page, action or observation touches delivery, and the
      mail catcher the email observable names is the very thing that would have to be
      broken for the criterion to be reached. Needs a way to point a run at an unreachable
      mail server, and an observation that the triggering action still reported success.
  - id: R-6.3
    version: 1
    reason: >-
      Both halves of the "then" are out of reach. The test marker sits at the front of a
      subject, which the mail catcher does expose, but nothing in the contract says whether
      the target a run points at is marked as a test environment, so a test has no way to
      know whether to expect the marker or its absence; and the test variant of the logo is
      an image in the message body, which the Mail fixture does not reach. Needs an
      observation of whether the target is a test environment, and a mail observation of
      the message body.
  - id: R-6.4
    version: 2
    reason: >-
      The claim is about who a message comes from and where a reply to it goes. The Mail
      fixture exposes a message's subject, snippet, recipient and id and nothing else, so a
      test cannot read the sender's display name, the sender's address, or the absence of a
      reply-to address distinct from it. Needs mail observations of the sender and of the
      reply-to address.
  - id: R-6.5
    version: 1
    reason: >-
      The claim is that every message carries both a formatted and a plain-text form and
      that the plain text carries the same words and links as the formatted version. The
      mail catcher reaches a message's subject and a snippet of it, not its parts, so a test
      can read neither form and cannot compare them. Needs mail observations of a message's
      formatted and plain-text bodies.
  - id: R-6.8
    version: 1
    reason: >-
      The claim is about batch size and about recipients hidden from one another. The Mail
      fixture searches by recipient address and returns subject, snippet, recipient and id;
      it cannot enumerate the messages one send produced, read a message's blind recipient
      list, or read its visible one. The given also asks for one hundred and twenty people
      who have requested new-opportunity notices, and the seed names no group of that size.
      Needs a mail observation of a message's visible and hidden recipient lists, a way to
      count the messages one action sent, and a seed group large enough to force batching.
  - id: R-6.9
    version: 1
    reason: >-
      The finding is that four evaluation notices put every recipient in the visible address
      line instead of hiding them. The mail observable exposes a message's recipient field
      but nothing that tells a visible recipient from a hidden one, and nothing in the
      contract identifies which notice a message is, so a test cannot single out the four.
      Needs a mail observation of the visible address line, and a way to tell one kind of
      notice from another without guessing at its subject wording.
  - id: R-6.11
    version: 1
    reason: >-
      The "then" turns on telling a watcher's notice apart from a new-opportunity
      announcement for the same person, and nothing in the contract names message kinds —
      the mail observable reaches subject, snippet and recipient, so the only way to
      distinguish them is to guess at wording the contract does not carry. The given also
      needs an account deactivated while a watch it holds survives, and no observation in
      the contract reports a deactivated account's watches. Needs a mail observation naming
      which notice a message is, and an observation of a watch held by a deactivated account.
  - id: R-6.12
    version: 1
    reason: >-
      The claim is about which programs one sentence inside the changed-terms message names.
      That sentence lives in the message body, and the mail observable reaches only subject,
      snippet and recipient; a snippet is the beginning of a message and nothing in the
      contract says the sentence falls within it. Needs a mail observation of the message
      body.
  - id: R-6.15
    version: 1
    reason: >-
      The authored replacement for R-6.9 requires that every multi-recipient notice carry
      its batch as blind copies with the service's own address as the visible recipient. The
      mail observable exposes a message's recipient field without distinguishing a hidden
      recipient from a visible one, so neither half of the requirement can be read. Needs a
      mail observation of a message's hidden and visible recipient lists.
  - id: R-6.16
    version: 1
    reason: >-
      The claim is that a message the notification preference does not govern must not offer
      to unsubscribe. The offer sits at the end of a message body, and the mail observable
      reaches subject, snippet and recipient only, so a test cannot see whether the offer is
      present or absent, nor what it links to. Needs a mail observation of the message body
      or of its links.
  - id: R-6.18
    version: 1
    reason: >-
      The authored replacement for R-6.12 turns on which programs the changed-terms message
      names, in a sentence inside the message body. The mail observable reaches subject,
      snippet and recipient only, so the sentence cannot be read at all, let alone checked
      for naming all three programs or none. Needs a mail observation of the message body.
  - id: R-6.20
    version: 1
    reason: >-
      The given is a person signing in to the service for the first time and having an
      account created for them. The contract's personas are accounts a run signs in as, and
      no action in it creates one — user-sign-up-choose-account and user-sign-up-complete
      offer to choose an account type and complete a profile, but a run reaches them already
      provisioned, so a test cannot read the notification setting of an account nothing has
      yet touched. Needs a way to bring a new account into being within a run.
  - id: R-6.24
    version: 1
    reason: >-
      The claim is that the announcement is reported successful while the messages are still
      being sent, and that nothing later says whether every one was sent.
      notification-terms-broadcast observes notify_vendors_success, but nothing in the
      contract observes work still outstanding behind it, so the ordering the criterion
      rests on cannot be read; the second half is a negative over the whole service that no
      observation covers. Needs an observation of the broadcast's outstanding work.
  - id: R-6.25
    version: 2
    reason: >-
      The claim is about the layout and the leading content of one message — the
      opportunity's title, the winning proponent's name, an em dash where none is recorded,
      and an offer to sign in and see one's own score. All of it lives in the message body,
      which the mail observable does not reach; the snippet is the beginning of a message and
      the contract does not say what falls within it. Needs a mail observation of the message
      body.
  - id: R-6.27
    version: 1
    reason: >-
      The claim is that the new-opportunity control is offered on the list of opportunities
      at every screen width. notification-optin-opportunity-list carries notification_control
      and notification_control_hidden_on_narrow_screen, but no action or parameter in the
      contract sets the width of the screen a run reads a page at, so a test cannot put
      itself on a narrow screen to find the control there. Needs a way to set the viewport
      width through the surface rather than around it.
  - id: R-8.3
    version: 1
    reason: >-
      The claim is about an upload whose declared size is above ten megabytes and one that
      declares no size at all. The three upload controls in the contract — add_attachment,
      choose_image and upload_body_image — each take a file and settle its declared size
      themselves, so a test cannot overstate, understate or omit it; and the observations on
      those controls are file_name_error and rejected_image_error, neither of which is a
      size refusal or the service fault the criterion records. Needs an upload action whose
      declared size the test chooses, and an observation of the size refusal.
  - id: R-8.4
    version: 1
    reason: >-
      The given is a submission carrying no file part, or read-access information that is not
      well-formed data. No control in the contract can produce either: add_attachment,
      choose_image and upload_body_image all send a file, and each fixes the read-access
      statement itself. The "then" also rests on what the service's error log records, which
      no observation reaches. Needs a way to submit a malformed upload, and an observation of
      the fault it produces.
  - id: R-8.5
    version: 1
    reason: >-
      The claim is that two uploads of identical content share one stored copy while
      remaining separate records with separate read access. Nothing in the contract observes
      a file's record apart from its bytes — file-download reaches the contents, the name on
      save and the content type of one file at a time, and reports no fingerprint — so a test
      cannot tell one stored copy from two. Needs an observation of a file's record,
      including the fingerprint by which identical uploads are recognised.
  - id: R-8.6
    version: 1
    reason: >-
      The claim is that every stored file records who uploaded it and when, and that neither
      can be changed afterwards. file-download observes contents, name on save, content type
      and the several refusals, and no page in the contract shows a stored file's uploader or
      the date it was stored. Needs an observation of a file's uploader and stored date.
  - id: R-8.7
    version: 1
    reason: >-
      The claim is the five ways of being allowed to read a file. Reaching four of them needs
      a file uploaded with a read-access statement of the test's choosing — readable by
      anyone, by a named person, or by an account type — and no upload action in the contract
      carries one; each control fixes read access itself. file-download does carry
      refused_when_not_permitted, so the refusal would be readable, but the states that must
      be arranged before it are not. Needs an upload action that carries a read-access
      statement.
  - id: R-8.8
    version: 1
    reason: >-
      The claim is that a Sprint With Us or Team With Us attachment is readable by a
      signed-out visitor while its opportunity is still a draft. file-download carries
      readable_when_signed_out_if_public, but reaching a particular file needs its
      identifier, and nothing in the contract hands a test the identifier of an attachment it
      has just added — file-attachment-control observes attachment rows and offers
      download_attachment from a page only the draft's owner can open. Needs an observation of
      an attachment's own identifier or address.
  - id: R-8.9
    version: 1
    reason: >-
      The claim is that a Team With Us proposal attachment is refused to the opportunity's
      owner although they may read the proposal. proposal-twu-create does offer
      add_attachment, so the given can be set up, but the "then" is a request for that
      particular file made by another person, and no observation in the contract yields the
      identifier of an attachment; download_attachment acts from the page rather than by
      identifier, and it is on the page that the wrong person cannot get. Needs an observation
      of an attachment's identifier.
  - id: R-8.11
    version: 1
    reason: >-
      The claim is about asking for a file without requesting its content and receiving its
      identifier, name and stored date instead. The contract's only address for a file is
      file-download at "?type=blob", whose observations are all about the bytes; there is no
      page, action or observation for a file's description on its own. Needs an observation of
      a file's record without its content.
  - id: R-8.13
    version: 1
    reason: >-
      The claim is that a profile picture or logo above five hundred pixels is reduced to five
      hundred keeping its proportions. file-image-picker observes current_image and
      chosen_image_preview, neither of which reports a width or a height, and nothing else in
      the contract measures a stored image. Needs an observation of a stored image's
      dimensions.
  - id: R-8.15
    version: 1
    reason: >-
      The claim is that attaching a file checks only that it exists, so one person can attach
      another person's file and widen who may read it. Reaching it needs a test to name an
      already-stored file's identifier while saving a proposal, and no action in the contract
      takes a file identifier — add_attachment takes a file to upload. Needs an action that
      attaches an already-stored file by its identifier.
  - id: R-8.16
    version: 1
    reason: >-
      The claim is about a working directory on the service's own machine and about a working
      copy being removed once the upload has been answered. No page, action or observation in
      the contract reaches the service's file system; the whole criterion is about a place the
      surface does not describe. Needs an observation of the working directory's contents,
      which is not something a surface can offer.
  - id: R-8.17
    version: 1
    reason: >-
      The authored replacement for R-8.3 requires that a too-large upload be refused as the
      requester's error with a message naming the limit, and that the limit be stated before a
      person chooses a file. No upload action in the contract lets a test choose a declared
      size, the observations on the upload controls are file_name_error and
      rejected_image_error rather than a size refusal, and nothing in the contract observes a
      stated limit anywhere in the interface. Needs an observation of the size refusal and an
      observation of the limit as shown before a file is chosen.
  - id: R-8.18
    version: 1
    reason: >-
      The authored replacement for R-8.4 has the same unreachable given: no control in the
      contract can send a submission with no file part or with read-access information that is
      not well-formed. Its "then" adds that nothing is written to the service's error log and
      that any working copy is removed either way, and neither the log nor the working
      directory is anything the surface observes. Needs a way to submit a malformed upload, an
      observation of the bad-request refusal, and an observation of the error log.
  - id: R-8.19
    version: 1
    reason: >-
      The claim is about what read access is recorded against a file at the moment it is
      uploaded, for all three programs alike. Nothing in the contract observes a file's
      recorded read access — file-download reports only whether a given requester is refused,
      and only for a file whose identifier the test holds, which no observation yields. Needs
      an observation of a file's recorded read access, and of an attachment's identifier.
  - id: R-8.22
    version: 1
    reason: >-
      The authored replacement for R-8.15 requires that a file be attachable only by someone
      permitted to read it. Attempting the forbidden case needs a test to name an
      already-stored file's identifier when attaching, and no action in the contract takes a
      file identifier; nor is there an observation of the refusal such an attempt should meet.
      Needs an action that attaches an already-stored file by its identifier, and an
      observation of the refusal.
  - id: R-8.24
    version: 2
    reason: >-
      The claim is about an upload carrying no read-access statement, and one naming a kind of
      access the service does not recognise. Every upload control in the contract fixes the
      read-access statement itself, so a test can neither omit it nor name an unrecognised
      kind, and no observation reports the invalid-read-access refusal. Needs an upload action
      carrying a read-access statement of the test's choosing, and an observation of that
      refusal.
  - id: R-8.26
    version: 1
    reason: >-
      The claim is that deleting an opportunity removes only the attachment link, leaving the
      file stored and still readable by whoever could read it. Asking for the file after the
      deletion needs its identifier, which no observation in the contract yields —
      file-attachment-control shows attachment rows and offers download_attachment from the
      page, and that page is gone with the opportunity. Needs an observation of an
      attachment's identifier or its own address.
  - id: R-8.31
    version: 1
    reason: >-
      The authored replacement for R-8.26 has two halves, neither reachable. Checking that a
      removed attachment's read paths are withdrawn needs the file's identifier, which no
      observation in the contract yields; and identifying a file no record refers to any longer
      needs a report of detached files, which the contract has no page or observation for.
      Needs an observation of an attachment's identifier and a report of files no record refers
      to.
  - id: R-3.17
    version: 1
    reason: >-
      The only way the surface creates an invitation is organization-edit's
      add_team_members, whose subject is email addresses; no page in the contract offers
      a membership type on an invitation, so a test cannot send one other than the
      "member" the team surface always sends, and therefore cannot reach the rejection of
      any other type. Needs an add_team_members that carries a membership type, and an
      observation of the invalid-membership-type refusal.
  - id: R-3.20
    version: 1
    reason: >-
      The criterion turns entirely on telling a refusal apart from an empty answer, and
      no page in the organizations domain carries a refusal observation — organization-list
      offers organization_name, owner_name, the two qualification marks and pagination,
      none of which distinguishes "you are not permitted" from "you may act for nothing".
      Needs an observation such as organization-list.refused_when_not_permitted, or a page
      of its own for the organizations one may act on behalf of.
  - id: R-3.35
    version: 1
    reason: >-
      The claim is about where the accept and the decline choice inside an invitation
      email lead. The email observable reaches a message's subject, snippet and recipient
      through the mail catcher, and the Mail fixture exposes only those, so a test cannot
      read the message body or follow either choice; organization-user-memberships also
      carries no observation of an accept or a decline confirmation standing ready. Needs
      a mail observation of the message body or its links, and an observation of the
      prepared confirmation on organization-user-memberships.
