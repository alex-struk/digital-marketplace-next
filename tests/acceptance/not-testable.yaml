# Accepted criteria the acceptance suite cannot exercise through the surface, and why —
# written by `derive-tests` when a criterion has no path through any page's actions and
# observations, or added by hand when a person makes the same call. An entry here stands
# in for a spec file: `sdlc run calibrate` reports it as a `not-testable` row rather than
# a missing test.
criteria:
  - id: R-2.6
    version: 1
    reason: >-
      Superseded by R-2.9, which spec/domains/proposals.md records on both criteria —
      R-2.6 carries superseded-by: R-2.9 and R-2.9 carries replaces: R-2.6. R-2.6 states
      that a vendor cannot see the history of their own Code With Us proposal; R-2.9
      states that they can, in all three programs. The two outcomes are contradictory, so
      only the replacement is derived, in tests/acceptance/proposals/R-2.9.spec.ts.
  - id: R-2.7
    version: 2
    reason: >-
      The criterion turns on a proposal being created in a state that is neither draft nor
      submitted, and being refused for it. The proposal pages carry exactly two creation
      actions — save_draft and submit_proposal — and no action, and no input to one, names
      the state a proposal is to be created in. There is therefore no way through the
      surface to ask for any third state, so the refusal the criterion asserts cannot be
      provoked; the two accepted states are exercised incidentally by R-2.12 (draft) and
      R-2.13 (submission) in all three programs.
  - id: R-2.8
    version: 1
    reason: >-
      Superseded by R-2.10, which spec/domains/proposals.md records on both criteria —
      R-2.8 carries superseded-by: R-2.10 and R-2.10 carries replaces: R-2.8. R-2.8 states
      that an over-budget Team With Us proposal is accepted; R-2.10 states that it is
      refused, on both the create and the edit path. The two outcomes are contradictory,
      so only the replacement is derived, in tests/acceptance/proposals/R-2.10.spec.ts.
