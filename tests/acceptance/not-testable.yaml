# Accepted criteria the acceptance suite cannot exercise through the surface, and why —
# written by `derive-tests` when a criterion has no path through any page's actions and
# observations, or added by hand when a person makes the same call. An entry here stands
# in for a spec file: `sdlc run calibrate` reports it as a `not-testable` row rather than
# a missing test.
criteria:
  - id: R-6.1
    version: 1
    reason: "The given is an environment with notifications switched off, read once at start-up. No page, action or observation configures the running target's notification setting, and the fixtures set no environment beyond the target URL and the mail catcher, so the condition the criterion is about cannot be established."
  - id: R-6.2
    version: 1
    reason: "The given is a service whose mail server is unreachable. Nothing in the surface or the mail fixture can stop, break or intercept delivery — `mail` can only clear the catcher and search it — so a failed send cannot be produced, and the claim that nothing in the service records the failure has nothing to be asserted against."
  - id: R-6.3
    version: 1
    reason: "Neither half is observable. The test marker is never named — the contract says only that subjects may carry one — so no assertion can tell a marked subject from an unmarked one; and the test variant of the logo lives in the message body, which the mail fixture does not expose (observables.yaml names html_body, but Mail returns only Subject, Snippet, To and ID)."
  - id: R-6.4
    version: 2
    reason: "The sender and the reply-to of a message are not reachable: observables.yaml names `sender: from`, but the mail fixture returns only Subject, Snippet, To and ID and offers no way to read one message's headers."
  - id: R-6.5
    version: 1
    reason: "Comparing the plain-text form of a message with the formatted one needs both bodies. The mail fixture exposes neither html_body nor plain_text_body, only a snippet, which is a summary the catcher makes and not evidence that a plain-text part was sent at all."
  - id: R-6.8
    version: 1
    reason: "Two things are missing. The batch's recipients are blind copies and the mail fixture has no accessor for them (observables.yaml names `copied_recipients: bcc`), so neither the batch size nor the hiding can be counted; and one hundred and twenty accounts that have asked for new-opportunity notices can be produced neither by the seed nor by any surface action, since accounts arrive only through sign-in as a seeded persona."
  - id: R-6.9
    version: 1
    reason: "The claim is about the visible address line of a panel notice listing all of its recipients. `mail.messagesTo` searches by one visible address and hands back `To` as an opaque value, so the addresses of the other recipients of the same message cannot be read."
  - id: R-6.11
    version: 1
    reason: "Both halves turn on the notice about a watched opportunity, which is sent as a batch of blind copies. The mail fixture searches by visible recipient only, so a message that did reach a deactivated watcher would not be found, and its absence from a search would be equally consistent with it having been sent."
  - id: R-6.12
    version: 1
    reason: "The criterion is about the wording inside one message. The mail fixture exposes no message body, and the reference page's observations (message_subject, message_summary, message_body) name no way to select one message among the fifty on the page, so a containment assertion over the page as a whole would be satisfied by any message that happens to name a program."
  - id: R-6.15
    version: 1
    reason: "Requires reading, for one multi-recipient notice, both the visible recipient and the list of blind copies. The mail fixture offers neither: it searches by a single visible address and returns no blind-copy list, so hiding cannot be told from not sending."
  - id: R-6.16
    version: 1
    reason: "The claim is about what stands at the foot of a particular message — an unsubscribe offer, or a plain link to the notification settings. The mail fixture exposes no message body, and the reference page cannot be asked for one message's body, so the two endings cannot be told apart."
  - id: R-6.18
    version: 1
    reason: "Same missing observation as R-6.12: naming all three programs or none is a fact about the body of the changed-terms message, and no surface observation or mail accessor returns that one body."
  - id: R-6.20
    version: 1
    reason: "The given is an account being created for the first time. Every persona signs in as an account the seed already holds, and no surface action creates one, so the sign-up completion page cannot be reached with a first-time identity and the state of a never-before-seen account cannot be read."
  - id: R-6.24
    version: 1
    reason: "What distinguishes this criterion from R-6.23 is ordering — success reported before any message has been sent. Nothing in the surface reports send progress, and nothing can hold delivery, so the only available check (that the catcher is empty at the moment success appears) is a race against the background sending rather than a test of it."
  - id: R-6.25
    version: 2
    reason: "Every part of the claim — the opportunity's title and the winner's name leading the message, the em dash where no successful proponent is recorded, the offer to sign in and see one's own score — is content of the message body, which no mail accessor returns and which the reference page cannot be asked for one message at a time."
  - id: R-6.27
    version: 1
    reason: "The only width-aware observation is notification_control_hidden_on_narrow_screen, which is worded for the old service's behaviour. Asserting its negation is not reliable, since observations return free text with no stated yes/no vocabulary, and nothing names an observation reporting the control as offered at a narrow width or a way to ask a page to open at one."
  - id: R-7.11
    version: 1
    reason: "The claim is about the shape of a refused answer — a permission refusal reported as though the submission were faulty. Nothing returns that shape: observables.yaml names a `refusal` status for files and for exports but nothing for a page request, and the content surfaces offer only free-text refused_for_non_administrator and field_error, which cannot be compared for the shape of the answer that produced them."
  - id: R-7.14
    version: 1
    reason: "The criterion is a contrast between two renderings of one body, and the second cannot be produced. The screens that embed a page's body — the program qualification terms screens and the evaluation instructions screen — embed pages the service creates for itself, which the seed does not name and which no surface addresses by handle, so no body a test can write can be got into an embedded rendering; and no observation reports one body's own rendering beside its embedded one."
  - id: R-7.15
    version: 1
    reason: "The when is following the service level agreement link offered beside the cost of a program. No surface exists for the learn-more index, and no action on any surface follows a service level agreement link — the program cards are reachable only as opportunity_program_select.program_card, an observation with no link to follow — so the five places the criterion names cannot be reached and the link cannot be followed to whatever answers it."
  - id: R-7.16
    version: 1
    reason: "Same missing observation as R-7.11, across a wider set of requests: the criterion is about every page request answering a permission refusal in one shape, and no observation returns the shape or status of a refused page request. refused_for_non_administrator is free text on each surface, so two refusals cannot be shown to be the same shape, only to have both happened."
  - id: R-7.18
    version: 1
    reason: "Every screen the criterion names as linking to the service level agreement page is out of reach: there is no learn-more surface, and no action on the program cards or on the three opportunity forms follows that link. Whether a page stands at that address could be read through content-view, but that is a different claim from the one made here, which is that each of the five links resolves."
  - id: R-7.23
    version: 1
    reason: "Asserting that nothing shows, compares or restores an earlier version needs an observation naming what must be absent, and content-edit names none: it has no observation of the wording it is showing, none of a history, an earlier version or a comparison, and no restore action. A test can neither find a route to a past version nor show that none exists."
  - id: R-7.28
    version: 2
    reason: "The given is two administrators who both opened the same page before either saved. The target carries one administrator sign-in and no second one, and the surface drives a single session, so two people cannot hold the page open at once and no stale read-then-write window can be produced. The collision half needs two publishes interleaving inside one such window, and nothing in the surface reports a version-key collision or a service error on the content-edit screen."
  - id: R-7.29
    version: 1
    reason: "The given is a page whose body another screen embeds having been removed. The embedded pages — an opportunity's scope page, a program's evaluation instructions — are ones the service needs, which R-7.25 records the service refuses to remove, so the condition cannot be established; and neither the opportunity view nor the evaluation instructions screen names an observation of the embedded section, so an empty one could not be told from a missing one."
