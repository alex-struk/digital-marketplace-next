      resultingPublicAddress() finds nothing.
  - id: R-8.7
    target: old
    why: fileDownload.downloadFile() ignores the fileId passed to
      fileDownload.open() and rebuilds the address from its own missing input,
      throwing 'called without a value for :fileId'. It must reuse the file
      opened.
  - id: R-7.8
