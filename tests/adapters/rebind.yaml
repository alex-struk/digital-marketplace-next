  - id: R-3.12
    target: old
    why: acceptOrgAdminTerms() throws 'no dialog is open' because the test calls it
      before anything has raised the terms dialog; open it from the member's
      Admin box, or return when none is open. toggleMemberAdminStatus({member})
      gets '' from asText for the nested seed user, so it falls back to the
      first checkbox on the Team tab, the owner's checked and disabled box, and
      clicks it until the 15 s timeout. Find the row by the member's name, and
      treat a disabled box as the refusal rather than clicking it.
