rebind:
  - id: R-2.1
    target: old
    why: publishOpportunity's opportunityCwuCreate.publish(input) fills every field
      the test gives, but the old form's '3. Details' step also requires
      'Acceptance Criteria*' and 'Evaluation Criteria*', which the contract's
      input never carries; the snapshot shows both blank, so Publish stays
      disabled and press() throws before the proposal is reached. Enter valid
      values into required fields the input does not name before pressing
      Publish.
