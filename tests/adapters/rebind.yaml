rebind:
  - id: R-2.1
    target: old
    why: proposalCwuCreate.opportunitySummary reads headerText(), which returns
      every line on the page when no numbered step exists, so the staff user's
      'Not Found / The page you are looking for doesn't exist. / Go Home' page
      was read as an opportunity summary; return '' when the page has no
      proposal step list or create heading.
  - id: R-5.1
    target: old
    why: evaluationPanel.addPanelMember passes {member} to setEvaluationPanel, which
      reads only 'members' or 'evaluators', so no member is ever added and all
      three tests save the draft's valid default panel (Casey Placeholder as
      chair, Robin Placeholder); read input.member and pick the chooser option
      whose text contains the seed user's email, since options are named 'Name
      (email)'.
  - id: R-2.3
    target: old
    why: proposalCreate.submitProposal calls enter(), which presses Cancel on the
      open terms dialog to type the proposal text; closing the dialog unticks
      the boxes acceptProgramTerms and acceptAppTerms ticked, and
      openTermsDialog reopens it with both boxes unticked and 'Submit Proposal'
      disabled. Enter the values before opening the terms, or tick the accepted
      boxes again after reopening.
  - id: R-1.4
    target: old
    why: opportunityEdit.opportunityTab reads tabContent(['Opportunity']), which is
      only the visible '1. Overview' step (Title, Teaser, Remote OK?, Required
      Skills, Next); the Description is on a later step, so neither the old nor
      the new description can be read. Walk every step of the tab when reading
      it.
  - id: R-2.4
    target: old
    why: as in R-2.3, submitProposal's enter() cancels the terms dialog and the
      reopened dialog has both terms boxes unticked and 'Submit Proposal'
      disabled, so press() throws before any proposal is submitted; keep the
      accepted terms ticked across the reopen.
  - id: R-5.9
    target: old
    why: "evaluationPanel.addPanelMember passes {member} to setEvaluationPanel,
      which reads only 'members'/'evaluators', so staff.two is never added and
      the saved panel still reads 'Chair: Casey Placeholder
      (staff.one@example.test)', leaving missingChairError no chairless panel to
      report; read input.member and match the option by the seed user's email."
  - id: R-1.10
    target: old
    why: completeRequired(true) walks the create form to '4. Attachments' and
      publish returns quietly on the disabled Publish, but fieldError() is
      messages(), which reads only the step on screen, so the error on the step
      holding Title, Teaser, Location or Description is never read; when Publish
      stays disabled, go back through the steps and collect field errors from
      each.
  - id: R-5.10
    target: old
    why: "scoreSheet.enter picks the question with indexOf, which reads only
      'index', 'position' or 'row' and ignores the test's 'order', so all four
      scores go into question 1 (the Sprint With Us table shows '1', '—', '—',
      '—' per proponent) and 'Submit Scores for Consensus' stays disabled; map
      'order' to the question slot. The Team With Us test is not a binding
      fault: the seeded opportunity's evaluation page answers 'Not Found'."
  - id: R-1.11
    target: old
    why: in the remote-description tests completeRequired leaves the form on '4.
      Attachments' with Publish disabled and fieldError reads only that step, so
      the error beside the remote-work field is never read; in the 'must state
      whether remote work is acceptable' test completeRequiredHere answers the
      unnamed 'Remote OK?' with No, so the opportunity published ('Opportunity
      Published') instead of being refused. Collect errors from every step, and
      do not auto-answer 'Remote OK?' when the test leaves it out.
  - id: R-1.12
    target: old
    why: completeRequired leaves the create form on '4. Attachments' and publish
      returns on the disabled Publish, but fieldError() reads only that step, so
      the reward and skills errors on their own step are never read; collect
      field errors from every step when Publish stays disabled.
  - id: R-3.12
    target: old
    why: "organizationEdit.teamMemberRow reads tableText(), whose innerText has no
      trace of the Admin checkbox, so after the grant (Dana's box now checked)
      the reading is identical; include each row's Admin checkbox state in the
      reading. The two refusal tests are not binding faults: the target's box is
      checked and disabled and the page shows no message."
  - id: R-2.13
    target: old
    why: openTermsDialog presses the top-bar 'Submit', which throws when disabled;
      in all four tests the form was deliberately left invalid (empty or
      overlong text, overlong comments, no proponent), so the disabled Submit is
      the refusal. Return quietly instead, and go back from '3. Attachments',
      where completeRequired left the page, to the step holding the invalid
      field so fieldError can read it.
  - id: R-5.13
    target: old
    why: scoreSheet.enter ignores the test's 'order' because indexOf reads only
      index/position/row, so only question 1 is scored (rows read '5', '—', '—',
      '—'), 'Submit Scores for Consensus' stays disabled and finalising is never
      reached; map 'order' to the question slot.
  - id: R-1.14
    target: old
    why: completeRequired leaves the form on '4. Attachments' and fieldError reads
      only that step, so the three date-order errors are never read; and
      opportunityView.proposalDeadline reads the value beside 'Proposal
      Deadline' ('Sep 28, 2026') while the page states the time in its header
      line 'Closes Sep 28, 2026 at 4:00 PM PDT'. Collect errors from every step,
      and read the deadline from the 'Closes' line as
      opportunityList.proposalDeadline does.
  - id: R-2.14
    target: old
    why: in the individual test openTermsDialog throws on the disabled top-bar
      'Submit' although the test blanked legalName on purpose, so the disabled
      Submit is the refusal and should end the action quietly on the step
      holding the field; in the organization test submitProposal's enter()
      cancels the terms dialog and the reopened dialog has both boxes unticked
      and 'Submit Proposal' disabled.
  - id: R-5.14
    target: old
    why: scoreSheet.enter ignores the test's 'order' (indexOf reads only
      index/position/row), so only question 1 is scored, 'Submit Scores for
      Consensus' stays disabled and the owner's finalise action is never
      reached; map 'order' to the question slot.
  - id: R-5.16
    target: old
    why: setEvaluationPanel looks for an option named with the seed user id
      '00000000-0000-4000-8000-000000000102', but the chooser names people
      'Casey Placeholder (staff.one@example.test)', so match by the seed user's
      email; addPanelMember adds nobody from {member}, so staff.two is never on
      the panel; removePanelMember ignores which member it was given and looks
      for a 'Remove' button, while each panel slot offers only an unlabelled
      clickable icon; and scoreSheet.enter ignores 'order', leaving questions 2
      to 4 unscored so consensus is never reached.
  - id: R-1.17
    target: old
    why: "in the position test fillSlot treats 'order' as a slot number and presses
      'Add Question' at most twelve times before throwing 'did not make a
      Question 102'; the team question form has no position field (only
      Question*, Response Guidelines*, Response Word Limit*, Score*, Minimum
      Score), so do not treat 'order' as a slot for team questions. The other
      four tests are not binding faults: the invalid values are in the right
      fields on '6. Team Questions' and the page shows no error."
  - id: R-5.18
    target: old
    why: addPanelMember adds nobody from {member}, so staff.one is never on the
      administrator's draft panel and is shown 'Not Found'; and in the other
      staff and vendor tests setEvaluationPanel matches options by the id
      '00000000-0000-4000-8000-000000000104' while options are named 'Name
      (email)', so setup fails before anyone looks. Read input.member and match
      options by the seed user's email.
  - id: R-3.19
    target: old
    why: "organizationEdit.organizationTab reads screenText(), the innerText of
      main, which omits the values of the disabled textboxes, so the saved
      'textbox \"Contact Name\" [disabled]: Phone Saving Contact Name' reads as
      missing; include each field's value in the reading."
  - id: R-5.19
    target: old
    why: draftForPanelMember's addPanelMember calls add nobody because
      setEvaluationPanel reads only 'members'/'evaluators', so staff.one never
      joins the draft's panel and is shown 'Not Found' on the draft and no row
      under Evaluations; read input.member and match the chooser option by the
      seed user's email.
  - id: R-8.19
    target: old
    why: fileAttachmentControl.addAttachment picks the file into the chooser but
      never saves the form ('Save Changes' still offered, the only link is a
      'blob:' preview), and on the Sprint With Us draft never chooses 'Edit' as
      the page asks, so attachmentAddress, which keeps only '/api/files/' links,
      returns ''; save the form after adding the attachment and wait for a
      stored file link. The Team With Us Save Draft staying on /create is not
      shown to be a binding fault.
  - id: R-8.20
    target: old
    why: in the Code With Us test addAttachment never saves the form, so only a
      'blob:' preview exists; in the Sprint With Us and Team With Us tests
      setEvaluationPanel matches chooser options by the seed id
      '00000000-0000-4000-8000-000000000102' while they are named 'Name
      (email)', so match by email; in the proposal test submitProposal's enter()
      cancels the terms dialog and both terms boxes come back unticked with
      'Submit Proposal' disabled.
  - id: R-3.21
    target: old
    why: organizationList.swuQualifiedMark and twuQualifiedMark read markUnder(),
      which returns the withheld cell's '—' as a mark; read '—' as '' as
      ownerName now does, and when a row is named read that row rather than the
      first data row.
  - id: R-2.23
    target: old
    why: both tests fail in submitProposal, whose enter() cancels the terms dialog
      so the reopened dialog has both terms boxes unticked and 'Submit Proposal'
      disabled; keep accepted terms ticked across the reopen, or enter values
      before opening the terms.
