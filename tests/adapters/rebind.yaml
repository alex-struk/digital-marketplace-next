rebind:
  - id: R-2.1
    target: old
    why: publishOpportunity's opportunityCwuCreate.publish(input) never fills the
      form from its input (title, teaser, location, description, remoteOk,
      reward, skills, dates), and press() clicks the Publish anchor while it is
      disabled (tabindex=-1, class disabled), retrying until the 120 s timeout.
      Fill the fields from the input, and have press() fail at once on a
      disabled control instead of clicking it.
  - id: R-3.1
    target: old
    why: organizationList.organizationName() uses textUnder('', 'Organization
      Name'), which returns only the first body row's cell ('Broken Compass
      Delivery Ltd.'). It must return every name in that column, in page order.
  - id: R-7.1
    target: old
    why: contentView.pageTitle() returns page.title(), the browser tab title ('About
      us — B.C. Digital Marketplace'). It must read the page's own heading text.
  - id: R-2.2
    target: old
    why: publishOpportunity's opportunityCwuCreate.publish(input) never fills the
      form from its input, and press() clicks the disabled Publish anchor
      (tabindex=-1) until the test times out. proposalCwuCreate.saveDraft(input)
      likewise drops proposalText.
  - id: R-3.2
    target: old
    why: organizationCreate.createOrganization(input) never fills Legal Name,
      address and contact fields from its input, then clicks the disabled
      'Create Organization' anchor (tabindex=-1) until the 120 s timeout. For
      public sector staff it throws unbound when the create page is withheld,
      instead of letting the refusal be observed.
  - id: R-1.3
    target: old
    why: opportunityCwuCreate.saveDraft(input) drops the title, so drafts are saved
      as 'Untitled' (the dashboard shows rows of Untitled drafts).
      allOpportunitiesForAdministrator reads only the administrator's own 'My
      Opportunities' tab rather than a list of every opportunity.
  - id: R-2.3
    target: old
