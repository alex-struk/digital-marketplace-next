rebind:
  - id: R-3.7
    target: old
    why: organizationEdit.addTeamMembers types every address into the one 'Email
      Addresses*' box joined by commas
      ('file.owner@example.test,vendor.notices.off@example.test'), and the
      dialog keeps its 'Add Team Member(s)' disabled; enter each address in a
      box of its own, adding a box for each further address with the clickable
      icon beside the field. A single address is accepted, as the pending
      invitations in R-3.13 and R-3.34 show.
  - id: R-2.14
    target: old
    why: "in the organization test proposalCwuCreate.chooseProponentOrganization
      reads the organization only as a string, so given the seed record for the
      archived organization it chooses nothing, completeRequired picks the first
      organization offered ('Cedar Hollow Systems Inc.') and the proposal is
      submitted; take the name from the record's legal_name. The individual test
      is not shown to be a binding fault: a blank field leaves 'Submit' disabled
      with no message."
  - id: R-5.18
    target: old
    why: "in the vendor and unrelated-staff tests opportunitySwuCreate.publish
      throws unbound because fillForm has no label for questionsWeight,
      codeChallengeWeight, teamScenarioWeight, priceWeight, startDate or
      completionDate; map the weights to the percentage fields on the form's
      scoring step and the dates to the phase's 'Phase Start Date' and 'Phase
      Completion Date'. The panel-member test is not a binding fault: the panel
      member is shown 'Not Found' on the evaluation panel tab."
  - id: R-8.20
    target: old
    why: in the Code With Us test fileAttachmentControl.attachmentAddress saves only
      through 'Save Changes', but the published opportunity's top bar offers
      'Publish Changes', so the file stays a 'blob:' preview and the address
      reads ''; press 'Publish Changes' and confirm when that is the save
      control. In the Sprint With Us and Team With Us tests publish throws
      unbound on the weight keys (and on Sprint With Us startDate and
      completionDate); map them to the scoring step's percentage fields and the
      phase dates. In the proposal test addAttachment reports no 'Add
      Attachment' although the snapshot at that address shows 'Choose File' with
      'Add Attachment' on '3. Attachments'; find the control there, or set the
      file on the 'Choose File' input directly.
  - id: R-2.24
    target: old
    why: "in the Code With Us test the second vendor's acceptProgramTerms and
      acceptAppTerms return before ticking or remembering either box because
      'Submit' is still disabled: completeRequired leaves 'Proposal*' empty
      since namedLabels still holds 'proposal' from the first vendor's form.
      submitProposal then reopens 'Review Terms and Conditions' with both boxes
      unticked and 'Submit Proposal' disabled; remember accepted terms even when
      the dialog cannot open yet, and start namedLabels afresh for each form. In
      the organization test opportunityTwuCreate.publish throws unbound on
      questionsWeight, challengeWeight and priceWeight; map them to the scoring
      step's percentage fields."
  - id: R-2.25
    target: old
    why: opportunityCwuEdit.proposalsTab returns tabContent(['Proposals']), the
      whole tab including the opportunity header and 'Proposals will be
      displayed here once this opportunity has closed.', so a tab that withholds
      every proposal reads as non-empty; return '' when the tab shows that
      notice and lists no proposals.
  - id: R-3.25
    target: old
    why: organizationEdit.addTeamMembers types both addresses comma-joined into the
      one 'Email Addresses*' box
      ('org.admin@example.test,org.member@example.test'), and the dialog keeps
      its 'Add Team Member(s)' disabled; enter each address in a box of its own.
  - id: R-3.26
    target: old
    why: "in the second test organizationEdit.twuRequirementServiceArea returns
      every line matching /service area/i, which picks up the organization's own
      heading 'Juniper Reach Service Area Only Ltd.', the RFQ instruction and
      the 'Service Areas' heading, none of which shows whether the requirement
      is met; read only the service-area requirement under 'Requirements', with
      whatever marks it met or unmet. The first test is not a binding fault: the
      qualified organization shows no Team With Us badge and no service area
      ticked."
  - id: R-8.29
    target: old
    why: fileEmbeddedImage.imageAddress looks for '/api/files/' in the Body and then
      for a stored image on the page, but the Body refers to the upload as
      '![R-8.29 diagram.png](FILE_ID:9abb034f-abfa-48e9-a349-8df7e91ab385)', so
      it returns ''; build the file's address from the identifier after
      'FILE_ID:'.
  - id: R-1.31
    target: old
    why: opportunityCwuEdit.proposalsTab returns tabContent(['Proposals']), the
      whole tab including the opportunity header and 'Proposals will be
      displayed here once this opportunity has closed.', so a tab that withholds
      every proposal reads as non-empty; return '' when the tab shows that
      notice and lists no proposals.
  - id: R-8.31
    target: old
    why: in the opportunity test attachmentAddress saves only through 'Save
      Changes', but the published opportunity's top bar offers 'Publish
      Changes', so the file stays a 'blob:' preview and the address reads '';
      press 'Publish Changes' and confirm when that is the save control. In the
      proposal test addAttachment reports no 'Add Attachment' although '3.
      Attachments' at that address shows 'Choose File' with 'Add Attachment';
      find the control there, or set the file on the 'Choose File' input
      directly.
  - id: R-3.34
    target: old
    why: organizationEdit.teamCapabilities returns every name under 'Team
      Capabilities', but that list names all nine capabilities whatever the team
      holds (the R-3.7 organization, whose owner holds none, lists the same
      nine), so the names alone cannot show what is held; return only the
      capabilities the page marks as held.
  - id: R-1.48
    target: old
    why: opportunitySwuCreate.publish throws unbound because fillForm has no label
      for questionsWeight, codeChallengeWeight, teamScenarioWeight or
      priceWeight, nor for the top-level startDate and completionDate, which the
      Sprint With Us form holds only on its phases; map the weights to the
      percentage fields on the form's scoring step and the dates to the phase's
      'Phase Start Date' and 'Phase Completion Date'. The Team With Us 'Save
      Draft' staying on /create is not shown to be a binding fault.
  - id: R-1.53
    target: old
    why: "in the administrator draft test opportunitySwuCreate.save_draft throws
      unbound because fillForm has no label for questionsWeight,
      codeChallengeWeight, teamScenarioWeight, priceWeight, startDate or
      completionDate; map the weights to the scoring step's percentage fields
      and the dates to the phase's 'Phase Start Date' and 'Phase Completion
      Date'. The other four tests are not binding faults: they stop because the
      staff profile shows no 'Permission(s)' label."
