  - id: R-3.18
    target: old
    why: organizationEdit.organizationTab() returns tabContent(['Organization']),
      which drops the top bar, so for the owner the reading lacks the 'Edit
      Organization' control the snapshot shows there and 'Edit' is not found.
      Include the screen's top-bar controls in this reading, as profileTab now
      does.
  - id: R-1.19
    target: old
    why: opportunityCwuCreate.saveDraft and publish(input) leave the required
      'Acceptance Criteria*' and 'Evaluation Criteria*' on '3. Details' blank
      because the contract's input never names them. The draft is therefore
      incomplete, its Actions menu offers Publish disabled and no 'Submit for
      Review', and the create page's Publish throws disabled. Fill required
      fields the input does not name before saving or publishing.
  - id: R-3.19
