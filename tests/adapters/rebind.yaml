  - id: R-3.3
    target: old
    why: organizationEdit.organizationTab() reads the page before it has rendered.
      For the service administrator the snapshot shows heading 'Northern Pines
      Digital Ltd.', but the reader returned only the footer; for the owner and
      the organization admin it read while the page showed 'Loading...'. Wait
      for the tab's content to appear before reading it.
