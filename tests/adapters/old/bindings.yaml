# What the "old" adapter binds, and what it does not.
#
# Nothing is bound. Binding an action or an observation means opening its page on the
# running target and finding the control by role, label, visible text or the address it
# leads to; this run could not open the target at all, because the browser tooling in
# this workspace has no usable Chromium and the session was refused any other way to
# reach the application. Rather than leave guessed locators behind, every action and
# observation is recorded unbound with that reason, and the adapter throws the matching
# "unbound: <page>.<member>" error. Navigation and sign-in are written from the contract
# and are not listed here.
