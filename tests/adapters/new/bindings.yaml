# What this adapter binds against the running "new" target, and what it does not.
#
# Four addresses render a page of their own on this target: / , /content/:slug ,
# /learn-more/:program and /status. Everything else in the surface — the dashboard, the
# opportunity, proposal, organization, user and evaluation screens, the content management
# screens and the file addresses under /api — is answered by the client's own "Page not
# found" screen or by a 404 from the service, and there is no sign-in anywhere, so no
# signed-in state exists in which any of them might appear.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      total_awarded_opportunity_count: "unbound: opened the home page and read the whole of it; it carries no count of awarded opportunities and no label naming one"
      total_awarded_opportunity_value: "unbound: opened the home page and read the whole of it; it carries no total value of awarded opportunities and no label naming one"
      readable_when_signed_out: bound

  opportunity-dashboard:
    actions:
      create_opportunity: "unbound: /dashboard is not a page on this target; opening it shows the service's own Page not found screen"
      open_opportunity: "unbound: /dashboard is not a page on this target; opening it shows the service's own Page not found screen"
