# What this adapter binds against the running "new" target, and what it does not, as the
# target stands now (every entry below was walked again against it).
#
# The whole marketplace is served at this address. A signed-out visitor is shown the home
# page, /opportunities and each opportunity's public page, /organizations, /sign-in,
# /sign-up, /sign-out, /notice/deactivatedOwnAccount and /notice/authFailure, /proposals,
# the published pages under /content/:slug, /learn-more/:program and /status; the service
# answers its interface under /api (files included).
#
# Signing in: "Sign in as a vendor" and "Sign in as a public sector employee" on /sign-in
# hand off to the sandbox identity provider's own form (Username, Password, "Sign In"), and
# signIn() fills it with the persona's username and the sandbox password from the
# environment. The session that bound this adapter could not use that password, so no
# screen that needs a session has been walked signed in: each was opened signed out, with
# the seeded record's identifier wherever its address takes one, and answered with the
# "Page not found" screen or a redirect to /sign-in; its members are unbound and say so. A
# member about the refusal itself reads it.
#
# Each member's reason is written out in full beside it (no anchors or aliases), so a page's
# members that share a reason repeat it word for word.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      # "95" over "TOTAL OPPORTUNITIES AWARDED", "$14,241,500" over "TOTAL VALUE OF ALL OPPORTUNITIES".
      total_awarded_opportunity_count: bound
      total_awarded_opportunity_value: bound
      readable_when_signed_out: bound

  opportunity-dashboard:
    actions:
      create_opportunity: "unbound: /dashboard is offered only to a signed-in person, and it has not been walked signed in ('Sign in as a vendor' and 'Sign in as a public sector employee' on /sign-in now hand off to the sandbox identity provider's username and password form, but the session that bound this adapter could not use the sandbox password, so no signed-in screen has been seen); opened signed out it redirects to the home page"
