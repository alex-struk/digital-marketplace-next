  notification-unsubscribe-landing:
    actions:
      # Walked signed in as test-vendor-1 (box ticked): the address opens the dialog "Stop
      # emails about new opportunities?" with "Keep receiving them" and "Unsubscribe". To the
      # administrator (box unticked) no dialog opens, and pressing either fails saying so.
      confirm_unsubscribe: bound
      cancel_unsubscribe: bound
    observations:
      # The dialog's words ("You are signed in as <name>. <address> will no longer be emailed
      # …") and the address in them; empty when no dialog opened. resolves_to_signed_in_person
      # reads the address "Notifications are sent to" names.
      unsubscribe_confirmation: bound
      confirmation_names_signed_in_address: bound
      resolves_to_signed_in_person: bound
      # Signed out, the address redirects to /sign-in carrying itself as redirectOnSuccess, which this reads.
      sign_in_required: bound

  # Signed in (as a vendor, a public sector employee or the administrator), /opportunities
  # carries a "New opportunity emails" region: "You are emailed at <address> when new
  # opportunities are posted." with "Stop emailing me about new opportunities", or "You are
  # not emailed …" with "Email me about new opportunities"; pressing it saves at once.
  # notification_control reads the region's words, notification_control_state "checked" or
  # "unchecked" (as the profile's box reads); a signed-out visitor has no region, read "".
  # At a phone's width (375 pixels) the region stays shown, so the narrow-screen reading
  # returns its words, and "" only when it is hidden there.
  notification-optin-opportunity-list:
    actions:
      toggle_new_opportunity_notifications: bound
    observations:
      notification_control: bound
      notification_control_state: bound
      notification_control_hidden_on_narrow_screen: bound

  notification-terms-broadcast:
    actions:
      notify_vendors_of_updated_terms: bound
      confirm_notify_vendors: bound
      cancel_notify_vendors: bound
    observations:
      notify_vendors_control: bound
      notify_vendors_confirmation: bound
      notify_vendors_success: bound
      notify_vendors_failure: bound

  notification-email-reference:
    actions:
      open_reference: "unbound: walked signed in as the administrator (test-admin) on 2026-09-30, /admin/email-notification-reference is no screen: the service answers it 404 {\"errors\":[\"Cannot GET /admin/email-notification-reference\"]}; /api/email-notification-reference, /api/admin/email-notification-reference and /admin (a 'Page not found' screen) offer nothing either, and neither the administrator's dashboard (a greeting only) nor profile links to an email reference"
    observations:
      message_group_title: "unbound: walked signed in as the administrator (test-admin) on 2026-09-30, /admin/email-notification-reference is no screen: the service answers it 404 {\"errors\":[\"Cannot GET /admin/email-notification-reference\"]}; /api/email-notification-reference, /api/admin/email-notification-reference and /admin (a 'Page not found' screen) offer nothing either, and neither the administrator's dashboard (a greeting only) nor profile links to an email reference"
      message_subject: "unbound: walked signed in as the administrator (test-admin) on 2026-09-30, /admin/email-notification-reference is no screen: the service answers it 404 {\"errors\":[\"Cannot GET /admin/email-notification-reference\"]}; /api/email-notification-reference, /api/admin/email-notification-reference and /admin (a 'Page not found' screen) offer nothing either, and neither the administrator's dashboard (a greeting only) nor profile links to an email reference"
      message_summary: "unbound: walked signed in as the administrator (test-admin) on 2026-09-30, /admin/email-notification-reference is no screen: the service answers it 404 {\"errors\":[\"Cannot GET /admin/email-notification-reference\"]}; /api/email-notification-reference, /api/admin/email-notification-reference and /admin (a 'Page not found' screen) offer nothing either, and neither the administrator's dashboard (a greeting only) nor profile links to an email reference"
      message_body: "unbound: walked signed in as the administrator (test-admin) on 2026-09-30, /admin/email-notification-reference is no screen: the service answers it 404 {\"errors\":[\"Cannot GET /admin/email-notification-reference\"]}; /api/email-notification-reference, /api/admin/email-notification-reference and /admin (a 'Page not found' screen) offer nothing either, and neither the administrator's dashboard (a greeting only) nor profile links to an email reference"
      # Reads whatever refusal the address gives: the "Page not found" screen, a redirect to
      # sign-in, or the service's plain "You do not have permission" answer.
      refused_for_non_administrator: bound

  content-footer:
    actions:
      open_about: bound
      open_disclaimer: bound
      open_privacy: bound
      open_accessibility: bound
      open_copyright: bound
    observations:
      # The footer has no contentinfo landmark: it is found as the box holding "Owned and
      # operated by the B.C. Government." with the links over it.
      about_link: bound
      disclaimer_link: bound
      privacy_link: bound
      accessibility_link: bound
      copyright_link: bound
      present_when_signed_out: bound

  # /learn-more/code-with-us carries a "service level agreement" link to
  # /content/service-level-agreement. Following it lands on that page, and the answer is read
  # from the page it led to (which carries no such link of its own). Where a page offers no
  # such link, the link, its address and the answer at it read empty.
  content-service-level-agreement-link:
    actions:
      follow_service_level_agreement_link: bound
    observations:
      service_level_agreement_link: bound
      link_target_address: bound
      answer_at_link_target: bound

  # Walked signed in as the administrator (the header's "Content" link): a table captioned
  # "Every page, in order of title" (Title, Public address, Needed by the service, Created,
  # Last updated) under a "Create page" link. Anybody else, signed out included, is shown
  # "Page not found" at /content, /content/create and /content/:slug/edit, which is what
  # refused_for_non_administrator reads.
  content-list:
    actions:
      open_page_for_editing: bound
      open_public_page: bound
      create_page: bound
    observations:
      page_title: bound
      page_public_address: bound
      # "<public address>: Yes" or ": No", from the "Needed by the service" column.
      page_is_fixed: bound
      page_created_date: bound
      page_updated_date: bound
      ordered_by_title: bound
      refused_for_non_administrator: bound
      # The table's body rows (27 on the seeded installation when walked).
      page_count: bound

  # Title, Address and a formatted Body ("Insert image" over it), "Cancel" and "Publish page";
  # "Publish this page?" confirms, and the browser lands on /content/<slug>/edit with a "Page
  # published" status. A taken address raises "This address is already in use" (walked with
  # about-us) and marks the field; an address the form will not take is marked invalid with
  # its reason beside it and in a "Fix 1 field to publish the page" note.
  content-create:
    actions:
      enter_title: bound
      enter_slug: bound
      enter_body: bound
      # "Insert image" opens the browser's file chooser (JPEG or PNG, up to 10 MB). The
      # browser tool used while binding did not surface that chooser, so an image landing in
      # the body was not watched here; a run that gets no chooser fails saying so.
      upload_body_image: bound
      publish_page: bound
      confirm_publish: bound
      cancel: bound
    observations:
      field_error: bound
      slug_rule_help: bound
      resulting_public_address: bound
      publish_disabled_until_valid: bound
      publish_confirmation: bound
      published_success: bound
      duplicate_slug_error: bound
      refused_for_non_administrator: bound

  # A page's screen: its facts as terms (Public address, Published, Published by, Last
  # updated, Last updated by — "System", with no link, for a page no person wrote), "Edit
  # page" and "Delete page", and the current wording read-only. "Edit page" opens the form
  # ("Cancel", "Publish changes", confirmed by "Publish your changes?", then a "Changes
  # published" status). "Delete page" asks "Delete “<title>”?" and lands on /content with a
  # "Page removed" status. A page the service needs (walked with about and
  # terms-and-conditions) carries the note "The service needs this page", no "Delete page",
  # and an Address field that takes no change. delete_withheld_for_fixed_page reads
  # "absent" there and "enabled" on an ordinary page. No earlier versions are offered ("The
  # wording it replaces is kept on record, but it cannot be viewed or restored from the
  # service."), so version_history reads empty on a page that opened.
  content-edit:
    actions:
      start_editing: bound
      edit_title: bound
      edit_slug: bound
      edit_body: bound
      upload_body_image: bound
      publish_changes: bound
      confirm_publish_changes: bound
      cancel_editing: bound
      delete_page: bound
      confirm_delete_page: bound
    observations:
      page_address: bound
      published_date: bound
      updated_date: bound
      published_by: bound
      updated_by: bound
      fixed_page_warning: bound
      slug_locked_for_fixed_page: bound
      delete_withheld_for_fixed_page: bound
      field_error: bound
      duplicate_slug_error: bound
      changes_published_success: bound
      deleted_success: bound
      refused_for_non_administrator: bound
      body_being_edited: bound
      version_history: bound
      published_by_link: bound
      updated_by_link: bound

  # A published page: its title, then "Published <date> | Updated <date>", then its body.
  content-view:
    actions:
      # No seeded body carries a link; one written on /content/create (now served to the
      # administrator) is followed by its first link. A body with none reports that.
      follow_body_link: bound
    observations:
      page_address: bound
      page_title: bound
      page_body: bound
      published_date: bound
      updated_date: bound
      readable_when_signed_out: bound
      not_found_for_unknown_address: bound
      body_element_names: bound
      body_script_ran: bound

  # The file address answers now: POST /api/files (multipart name, metadata, file) and GET
  # /api/files/:id (?type=blob for the bytes). Signed out, reading the seeded private file,
  # or an identifier with nothing stored under it, answers 401 ["You do not have permission
  # to perform this action."]; a form with no file part answers 500 "No file uploaded". Each
  # is bound as a request carrying the browser's session.
  file-upload:
    actions:
      upload_file: bound
      upload_file_stating_its_read_access: bound
      upload_file_without_declaring_its_size: bound
      upload_file_with_no_file_part: bound
      upload_file_with_unrecognised_read_access: bound
      upload_file_with_malformed_read_access: bound
    observations:
      stored_file_identifier: bound
      refused_for_size: bound
      size_limit_named_in_refusal: bound
      refused_for_file_name_length: bound
      refused_for_read_access: bound
      refused_when_signed_out: bound
      service_fault: bound

  file-description:
    actions: {}
    observations:
      file_identifier: bound
      file_name: bound
      stored_date: bound
      stored_content_identifier: bound
      refused_when_not_permitted: bound
      refused_for_unknown_file: bound
      not_found_for_administrator: bound

  file-download:
    actions:
      download_file: bound
    observations:
      file_contents: bound
      file_name_on_save: bound
      offered_as_download_not_displayed: bound
      content_type_from_name: bound
      readable_when_signed_out_if_public: bound
      refused_when_not_permitted: bound
      refused_for_unknown_file: bound
      not_found_for_administrator: bound

  file-attachment-control:
    actions:
      # Bound on a Code With Us opportunity's form (?tab=opportunity), signed in as the
      # administrator or the public sector employee who owns it: "Add attachment" opens the
      # file chooser; a chosen file is stored at once and listed "New: <name>, <size>.
      # Uploaded and attached to this opportunity." with its "Download <name>" link, a
      # "Name for <name>" box and "Will be saved as: <name>"; one saved since has a
      # read-only name, a "Download <name>" link to /api/files/<id>?type=blob and
      # "Remove <name>". A row with that link counts as stored, whatever its wording. The Sprint
      # With Us and Team With Us forms answer "Page not found", where every member reports
      # unbound at run time.
      add_attachment: bound
      rename_new_attachment: bound
      remove_new_attachment: bound
      remove_existing_attachment: bound
      download_attachment: bound
    observations:
      attachment_address: bound
      size_limit_stated_before_choosing: bound
      upload_refused_for_size: bound
      new_attachment_row: bound
      existing_attachment_row: bound
      existing_attachment_name_read_only: bound
      original_extension_restored: bound
      file_name_error: bound
      remove_control_hidden_when_not_removable: bound
      # Read on the opportunity's public page, the "Attachments" list under its Description
      # (none listed reads empty).
      attachment_list_on_public_view: bound

  # Bound on one's own profile at /users/me, walked signed in as the administrator and the
  # organization-owner vendor. "Edit profile" opens the form whose "Profile picture
  # (optional)" group holds the rule "A JPEG or PNG image, up to 10 MB. A picture wider or
  # taller than 500 pixels is made smaller to fit, …" and "Choose a profile picture". That
  # button opens no file chooser (click, Enter, Space in a Playwright run; the hidden file
  # field beside it is never even clicked). The control is on the page and does nothing, so
  # choose_image (and every change_avatar) is bound and fails naming that button, rather
  # than reporting the page's own fault as unbound. The readings read only what the
  # page shows and never press "Save changes" (saving is user-profile-self.save_changes): a
  # stored picture is "Your current profile picture" at /api/files/<id>?type=blob, which
  # answered a request carrying no session 200 image/png; refusals are alerts in the group;
  # with nothing there, each reads empty. On an
  # organization screen (not served) every member reports unbound rather than reading the
  # profile's picture in the logo's place.
  file-image-picker:
    actions:
      choose_image: bound
    observations:
      image_address: bound
      current_image: bound
      chosen_image_preview: bound
      only_jpeg_and_png_offered: bound
      rejected_image_error: bound
      image_readable_when_signed_out: bound
      stored_image_width: bound
      stored_image_height: bound

  # Bound on the administrator's /content/<slug>/edit after "Edit page" (walked on the seeded
  # about-us page): the "Formatting for Body" toolbar carries "Insert image", described by
  # "Insert image takes a JPEG or PNG image, up to 10 MB. …". A stored image goes into the
  # body as "![Describe this image](@file/<id>)" with "<name> was inserted at the cursor." in
  # the status; a refused one raises "<name> could not be inserted / … Nothing was added to
  # the body." and leaves the body as it was; the published /content/<slug> draws the image
  # from /api/files/<id>?type=blob. Pressing "Insert image" itself (by mouse or by Enter)
  # opened no file chooser on the running build, while "Bold" beside it worked on the body:
  # the action reports that as a plain failure of the control, not as unbound.
  file-embedded-image:
    actions:
      upload_body_image: bound
    observations:
      image_address: bound
      image_inserted_into_text: bound
      only_jpeg_and_png_offered: bound
      uploading_indicator: bound
      image_rendered_in_published_text: bound
      upload_failure_leaves_text_unchanged: bound

  # The mail catcher's pages are bound against Mailpit's own interface (message list and
  # message by identifier, /api/v1/chaos for the sender fault, /hold/proxies/smtp/toxics for
  # the delay), all read on the catcher that receives this target's mail.
  caught-message:
    actions:
      follow_link_in_body: bound
    observations:
      visible_recipients: bound
      copied_recipients: bound
      sender: bound
      reply_to: bound
      subject: bound
      html_body: bound
      plain_text_body: bound
      logo_address: bound
      links_in_body: bound

  caught-message-list:
    actions: {}
    observations:
      message_identifiers: bound
      message_subjects: bound
      message_visible_recipients: bound
      message_count: bound

  mail-delivery-fault:
    actions:
      refuse_delivery: bound
      restore_delivery: bound
    observations:
      delivery_refused: bound

  # The delay proxy's control API is bound where observables.yaml delivery_delay puts it,
  # ${SDLC_MAIL_API}/hold, the only address the contract gives. This sandbox does not serve
  # it: GET/POST/DELETE on the catcher's /hold/proxies/smtp/toxics, /hold/proxies and
  # /hold/version all answer the catcher's plain "404 page not found", and nothing answers
  # on the proxy's usual control port 8474 or the ports around the catcher (8026-8027,
  # 8474-8477, 18474, 28474; 1025 is the catcher's own SMTP port, 8080 the identity
  # provider). Rechecked on the restarted target: its compose project runs only frontend,
  # backend, identity provider, database and a bare mail catcher (plus one-shot migrate and
  # realm jobs) — no mail-hold proxy service exists in it, and no other listening port on
  # the host belongs to one. A sandbox gap, not the target's: once the proxy is served
  # there the binding works unchanged.
  mail-delivery-delay:
    actions:
      slow_delivery: "unbound: the delay proxy's control API is not served on this sandbox: POST ${SDLC_MAIL_API}/hold/proxies/smtp/toxics answers the mail catcher's plain 404, and no proxy answers on port 8474 or the ports around the catcher (sandbox gap)"
      restore_delivery_speed: "unbound: the delay proxy's control API is not served on this sandbox: DELETE ${SDLC_MAIL_API}/hold/proxies/smtp/toxics/hold reaches only the mail catcher's plain 404, and no proxy answers on port 8474 or the ports around the catcher (sandbox gap)"
    observations:
      delivery_slowed: "unbound: the delay proxy's control API is not served on this sandbox: GET ${SDLC_MAIL_API}/hold/proxies/smtp/toxics answers the mail catcher's plain 404, and no proxy answers on port 8474 or the ports around the catcher (sandbox gap)"

  # The request pages below are bound to the service's own interface, as
  # spec/contract/openapi.yaml describes it, from the browser's session. Every address was
  # asked signed out and answered as a signed-out request is (the reads, the refusals 401
  # {"permissions":[...]} or ["You do not have permission to perform this action."],
  # /api/sessions/current "null", /api/ownedOrganizations []). A request sends only what
  # the test gave it: nothing it leaves out is filled in here.
  # Watching was sent signed out, as users.vendorOne and as users.staffOne, against
  # seed.opportunities.publishedCodeWithUs: a watch answered 201, a second watch 400, a stop
  # 200, a second stop 400, and the opportunity's "subscribed" flag followed each one. This
  # target files every refusal under a single "errors" list (sometimes prefixed
  # "opportunity: "), never under conflict, opportunity, notFound or permissions, and
  # refusal_reason reports that key exactly as the service gives it.
  opportunity-watch-request:
    actions:
      watch_by_request: bound
      stop_watching_by_request: bound
    observations:
      request_accepted: bound
      refusal_status: bound
      refusal_reason: bound
      refusal_messages: bound
      watching: bound
  organization-acting-for-list:
    actions: {}
    observations:
      organizations_offered: bound
      refused_when_not_permitted: bound

  affiliation-invitation-request:
