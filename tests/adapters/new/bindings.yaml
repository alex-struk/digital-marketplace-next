      submit_this_evaluation_alone: bound
      create_evaluation_by_request: bound
    observations:
      stored_scores: bound
      stored_notes: bound
      evaluation_status: bound
      refused_as_unrecognised: bound
      refused_at_submission: bound
      evaluation_created: bound
      creation_refusal_message: bound

  evaluation-individual-request-twu:
    actions:
      save_draft_as_entered: bound
      submit_this_evaluation_alone: bound
      create_evaluation_by_request: bound
    observations:
      stored_scores: bound
      stored_notes: bound
      evaluation_status: bound
      refused_as_unrecognised: bound
      refused_at_submission: bound
      evaluation_created: bound
