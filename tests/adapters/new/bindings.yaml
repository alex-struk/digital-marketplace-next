  # "Sign In": a "Vendor" region with the button "Sign in as a vendor" and a "Public sector
  # employee" region with "Sign in as a public sector employee"; each hands off to the sandbox
  # identity provider's "Sign in to your account" form, which is what pressing it does.
  # /sign-up ("Choose Account Type") is the same with "Sign up as ...".
  user-sign-in:
    actions:
      sign_in_as_vendor: bound
