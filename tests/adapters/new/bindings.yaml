  # Walked signed in as the first vendor, the organization-owner vendor (who wrote a seeded
  # proposal), the vendor whose terms were reset and a first-time vendor: /dashboard is
  # "Dashboard" over "You are signed in as <name>." and nothing else — no proposals, no
  # table, no tab, link or button. The vendor still to complete a profile is sent on to
  # /sign-up/complete instead. The readings reach the dashboard and report what it shows,
  # which is no rows, no status and no message; after the send-on to /sign-up/complete they
  # read empty too, the absent dashboard being what that vendor is shown (R-4.23). The
  # actions find nothing to press.
  proposal-vendor-dashboard:
    actions:
      show_my_proposals: "unbound: signed in as the first vendor and as the organization-owner vendor (who wrote a seeded proposal), /dashboard reads only 'Dashboard' / 'You are signed in as <name>.' and offers no 'My Proposals' tab, link or button (no control at all)"
      show_org_proposals: "unbound: signed in as the first vendor and as the organization-owner vendor (who wrote a seeded proposal), /dashboard reads only 'Dashboard' / 'You are signed in as <name>.' and offers no control for an organization's proposals (no control at all)"
    observations:
      my_proposals_table: bound
      org_proposals_table: bound
      proposal_status: bound
      empty_my_proposals_message: bound
      empty_org_proposals_message: bound

