# What this adapter binds against the running "new" target, and what it does not, as the
# target stands now (every entry below was walked again against it).
#
# The whole marketplace is served at this address. A signed-out visitor is shown the home
# page, /opportunities and each opportunity's public page, /organizations, /sign-in,
# /sign-up, /sign-out, /notice/deactivatedOwnAccount and /notice/authFailure, the published
# pages under /content/:slug, /learn-more/:program and /status; the service answers its
# interface under /api (files included). /proposals answers "Page not found" to everybody,
# signed in or not.
#
# Signing in: "Sign in as a vendor" and "Sign in as a public sector employee" on /sign-in
# hand off to the sandbox identity provider's own form (Username, Password, "Sign In"), and
# signIn() fills it with the persona's username and the sandbox password from the
# environment, then waits for the client to send the person on (a vendor still to complete
# a profile to /sign-up/complete, everyone else to /dashboard). The screens that need a
# session were walked signed in — as vendors (with and without proposals, the one whose
# terms were reset, the one still to complete a profile, a first-time vendor), the public
# sector employee, a first-time public sector employee and the administrator, with the
# seeded records' identifiers, and walked again on the current build (2026-10-03) as the
# administrator, the public sector employee who sits on the seeded panels, the
# organization-owner vendor and a vendor with no proposals. The running build serves a
# signed-in person /dashboard (to staff "Create an opportunity" over "My opportunities", to
# the administrator every opportunity; to a vendor "My proposals" and "My organizations'
# proposals"), their own profile at /users/me or /users/<own id> with its sections, the list
# of accounts and another account's /users/:userId to the administrator, the
# content-management screens to the administrator, /sign-up/complete to a vendor still to
# complete a profile, /organizations, /organizations/create, an organization's screen
# /organizations/:orgId/edit (with its Sprint With Us and Team With Us qualification
# sections) and its terms screens; every program's public opportunity page (with "Watch this
# opportunity", and "Start a proposal" while it takes proposals); to a vendor the three
# programs' proposal forms and their own proposal's screen .../proposals/:proposalId/edit;
# to the administrator and public sector staff the program chooser, the three programs'
# forms and management screens (sections Summary, Opportunity, Addenda, History, Proposals
# and Evaluation panel) and the Code With Us proposal's screen .../proposals/:proposalId.
# Still answered "Page not found", to everybody walked: /proposals, a Sprint With Us or Team
# With Us proposal's screen .../proposals/:proposalId, every program's
# .../proposals/:proposalId/export and .../proposals/export, every program's .../complete
# (these last three served since 2026-10-04: see the pages below), and the evaluation and consensus screens under .../team-questions/ and
# .../resource-questions/. A deactivated vendor's sign-in ends on /notice/authFailure. A
# member about the refusal itself reads it.
#
# Each member's reason is written out in full beside it (no anchors or aliases), so a page's
# members that share a reason repeat it word for word.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      # "95" over "TOTAL OPPORTUNITIES AWARDED", "$14,241,500" over "TOTAL VALUE OF ALL OPPORTUNITIES".
      total_awarded_opportunity_count: bound
      total_awarded_opportunity_value: bound
      readable_when_signed_out: bound

  # Walked again on this build signed in as the administrator and as a public sector
  # employee with no opportunities: /dashboard is "Dashboard", a "Create an opportunity"
  # link to /opportunities/create, and to the administrator "All opportunities" — a table
  # (Title, Program, Status, Last updated, Created by) of every opportunity, each title a
  # link to its management screen; the public sector employee's "My opportunities" reads
  # "You have not created any opportunities yet." with no table.
  opportunity-dashboard:
    actions:
      create_opportunity: bound
      open_opportunity: bound
    observations:
      my_opportunities_table: bound
      opportunity_status: bound
      own_opportunities_only: bound
      all_opportunities_for_administrator: bound
      empty_my_opportunities_message: bound

  # Walked signed in (administrator, public sector employee) and signed out: the
  # "Filter opportunities" search group carries a "Program" chooser (a button "All programs
  # Program" opening a "Program" list: All programs, Code With Us, Sprint With Us, Team With
  # Us), a "Status" chooser of the same kind (All statuses, Draft, Under review, Published,
  # Evaluation, Awarded), a "Remote work accepted only" box and a "Search by title or
  # location" search box; the list narrows as each changes ("Showing N opportunities."). The
  # cards stand under group headings (no unpublished group is shown to a signed-out visitor,
  # so it reads empty), and signed in each card carries a "Watch <title>" box, except a card
  # of the reader's own opportunity; a signed-out visitor's cards carry none.
  opportunity-list:
    actions:
      filter_by_program: bound
      filter_by_status: bound
      filter_remote_only: bound
      search: bound
      toggle_watch: bound
    observations:
      unpublished_group: bound
      open_group: bound
      closed_group: bound
      opportunity_status: bound
      proposal_deadline: bound

  # Signed in as the administrator or a public sector employee: "Create an opportunity", one
  # region per program with "Maximum budget: …" and a "Create a <program> opportunity" link.
  # A vendor is shown "Page not found". Each link leads to that program's form.
  opportunity-program-select:
    actions:
      choose_code_with_us: bound
      choose_sprint_with_us: bound
      choose_team_with_us: bound
    observations:
      program_card: bound
      max_budget: bound

  # Bound signed in as the administrator ("Save draft", "Publish" with its "Publish
  # opportunity" confirmation) and as a public sector employee ("Save draft", "Submit for
  # review"). Every input key goes to its field: title, teaser, location, remoteOk (the
  # "Remote OK: remote work is acceptable" box), remoteDesc, reward, skills (the multi-pick
  # "Skills" chooser), description and the four dates; a key no field takes is reported
  # unbound by name. Anybody who may not create an opportunity (a vendor, a visitor) is
  # answered "Page not found", which the actions report as a refusal, not as unbound.
  opportunity-cwu-create:
    actions:
      save_draft: bound
      submit_for_review: bound
      publish: bound
      add_attachment: bound
    observations:
      field_error: bound

  # The public page as the running build now draws it: terms and definitions (Status,
  # Proposal deadline, Reward, Location, Remote work, Published, Created by, Last changed
  # by), "Opportunity ID: <id>", a "Watch this opportunity" checkbox to anybody signed in,
  # and Description, Skills, Key dates and Addenda sections. A draft answers anybody who may
  # not see it (a vendor, another staff member) "Page not found"; for an opportunity known
  # to exist (seeded, or seen open earlier in the run) every reading is then empty.
  opportunity-cwu-view:
    actions:
      toggle_watch: bound
      # Signed in as a vendor on the seeded published opportunity (deadline in 2030) the page
      # offers the link "Start a proposal" to .../proposals/create; a vendor already holding
      # a proposal there is offered "View your proposal" instead, which is followed, as the
      # old target's binding follows "View Proposal".
      start_proposal: bound
    observations:
      opportunity_identifier: bound
      # The administrator reads the seeded draft of another staff member as "Draft"; a
      # vendor and the other public sector employee are answered "Page not found" and read "".
      status: bound
      published_date: bound
      created_by_name: bound
      last_changed_by_name: bound
      proposal_deadline: bound
      reward: bound
      addenda: bound
      # An awarded opportunity's page names the winner in a "Successful proponent" region (level-2
      # heading over the name, "Northern Pines Digital Ltd." on the seeded awarded one), read
      # likewise on the Sprint With Us and Team With Us pages; a page without one reads empty.
      successful_proponent: bound
      assignment_date: bound
      start_date: bound
      successful_proponent_contact_details: bound
      successful_proponent_score: bound

  # Signed in as the administrator, or a public sector employee for their own opportunity:
  # "Status: <state>", "Opportunity ID: <id>", an "Opportunity actions" group (a draft:
  # Publish to the administrator or Submit for review to its author, and Delete, with no
  # Edit because the draft's form is already editable, so edit_details edits it in place;
  # published: Edit and, to the administrator, Cancel opportunity; awarded: nothing) and the
  # sections Summary (with a "Reporting" region of Views, Watchers and Proposals submitted
  # once published), Opportunity (the form, with Save changes), Addenda (once published: a
  # "New addendum" box and "Add addendum") and History (the entries, then "Add a private
  # note"). Publishing, deleting and cancelling are confirmed in a dialog. Publish and
  # Cancel opportunity are offered only to the administrator, and the Addenda section only
  # once published: for anybody else, or on a draft, the absence (or the screen answering
  # "Page not found") is logged as a refusal and the test's own reading decides.
  opportunity-cwu-edit:
    actions:
      edit_details: bound
      submit_for_review: bound
      publish: bound
      cancel_opportunity: bound
      delete_opportunity: bound
      add_addendum: bound
    observations:
      opportunity_identifier: bound
      created_by_name: bound
      last_changed_by_name: bound
      summary_tab: bound
      opportunity_tab: bound
      addenda_tab: bound
      history_tab: bound
      # The "Proposals" section: before the opportunity closes it withholds every proposal
      # ("Proposals are not shown until the opportunity closes …", no table), which reads as
      # nothing; once closed it lists them (seen as the administrator on the seeded published
      # and lapsed-with-three-proposals opportunities).
      proposals_tab: bound
      reporting_views: bound
      reporting_watchers: bound
      reporting_proposals: bound
      proposal_deadline: bound
      assignment_date: bound
      start_date: bound
      completion_date: bound
      note_control_offered: bound

  # Seen 2026-10-04: each program's .../complete is the "<program> opportunity report"
  # (Opportunity, Addenda, History, and Proposals written out in full), served to the
  # administrator; a vendor is shown "Page not found", which full_report reads as nothing.
  opportunity-cwu-complete:
    actions: {}
    observations:
      full_report: bound

  # Walked signed in as the administrator and as a public sector employee: the form opens,
  # with "Save draft" and "Publish" offered to the administrator and "Save draft" and "Submit
  # for review" to a public sector employee (the action not offered is logged as a refusal).
  # Drafts saved, put forward for review and published from it landed on the new
  # opportunity's management screen. Phases ("Add an inception phase", "Add a prototype
  # phase"), "Add a team question", the scoring weights and the "Evaluation panel" (members
  # chosen, added and removed) were each driven on the form. A refused save stays on the form
  # with "The opportunity was not saved" and the field's reason, read as field_error. A total
  # weight other than 100% raised no message when saved or put forward (only the "Total: N%"
  # status changes), so score_weight_error reads what the form says about weights, empty here.
  opportunity-swu-create:
    actions:
      save_draft: bound
      submit_for_review: bound
      publish: bound
      add_phase: bound
      add_team_question: bound
      set_evaluation_panel: bound
    observations:
      field_error: bound
      score_weight_error: bound
      evaluation_question_fields: bound

  # Read on the seeded awarded and closed Sprint With Us opportunities; the phases are under
  # "Phases of Work" on the Details tab. The running build draws the page's sections as
  # regions under their own headings (Description, Phases, Skills, Key dates, Scope, Addenda)
  # rather than behind tabs: the scope is the "Scope" region, which carries the body of the
  # "sprint-with-us-opportunity-scope" page ("Initial version" on the seed, the same as
  # /content/sprint-with-us-opportunity-scope).
  # Re-walked on the current build signed in as the organization-owner vendor on the seeded
  # open Sprint With Us opportunity (...a025...): "Watching sends you an email whenever this
  # opportunity changes." over the checkbox "Watch this opportunity", and the link "Start a
  # proposal" to .../proposals/create — the Code With Us page's controls, bound the same way.
  # A closed one (...701) draws the checkbox and no "Start a proposal".
  opportunity-swu-view:
    actions:
      toggle_watch: bound
      start_proposal: bound
    observations:
      opportunity_identifier: bound
      status: bound
      published_date: bound
      created_by_name: bound
      last_changed_by_name: bound
      proposal_deadline: bound
      total_max_budget: bound
      phases: bound
      addenda: bound
      successful_proponent: bound
      assignment_date: bound
      scope_section: bound
      page_messages: bound
      successful_proponent_contact_details: bound
      successful_proponent_score: bound

  # Walked as the administrator on the seeded Sprint With Us opportunities published and
  # lapsed (00000000-0000-4000-8000-000000000701 among them), at individual evaluation, at
  # consensus, at the code challenge, at the team scenario, in processing and awarded, and on
  # drafts just saved from /opportunities/sprint-with-us/create (as the administrator and as a
  # public sector employee, each deleted again); as the owning public sector employee on
  # seeded ones; and as a vendor, who is answered "Page not found". The screen's sections are
  # now Summary, Opportunity (the program's form: read-only once published, editable on a
  # draft after "Edit", saved with "Save changes"), Addenda (not on a draft), History,
  # Proposals (added on the current build: the table "Every proposal submitted to this
  # opportunity", Proponent | Status | Submitted, names in plain text; before the deadline
  # only "Proposals are not shown until the opportunity closes") and Evaluation panel. A draft offers its owner "Edit", "Submit for review" and "Delete", and
  # the administrator "Edit", "Publish" ("Publish this opportunity?" / "Publish opportunity")
  # and "Delete" ("Delete this opportunity?" / "Delete opportunity", landing on /dashboard);
  # an incomplete draft put forward is refused with the alert "This opportunity is
  # incomplete". ?tab=evaluation, ?tab=consensus, ?tab=instructions and other section names
  # fall back to the Summary. The dates are read from the Summary's terms, as a calendar day;
  # the team questions from the Opportunity section's form.
  opportunity-swu-edit:
    actions:
      edit_details: bound
      submit_for_review: bound
      publish: bound
      cancel_opportunity: bound
      delete_opportunity: bound
      add_addendum: bound
      edit_evaluation_panel: bound
      finalize_question_consensuses: "unbound: the management screen offers no 'Consensus' section and no control to finalize question consensuses, walked as the administrator on the seeded Sprint With Us opportunities at consensus (one consensus outstanding, every consensus agreed, six proponents) and as their owning public sector employee; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel (the panel locked, 'The evaluation panel can no longer be changed'), its only action is 'Cancel opportunity', and ?tab=consensus falls back to the Summary"
      start_team_scenario: "unbound: the management screen offers no 'Team scenario' section and no control to start the team scenario, walked as the administrator on the seeded Sprint With Us opportunities at the code challenge (with and without a proponent screened in) and at the team scenario; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel and its only action is 'Cancel opportunity'"
    observations:
      opportunity_identifier: bound
      created_by_name: bound
      last_changed_by_name: bound
      summary_tab: bound
      opportunity_tab: bound
      addenda_tab: bound
      history_tab: bound
      # Re-walked on the current build as the administrator: the seeded awarded one
      # (...a020...) lists its two proposals; the seeded open one (...a025...) draws only
      # "Proposals are not shown until the opportunity closes", which reads empty, as on the
      # Code With Us screen.
      proposals_tab: bound
      team_questions_tab: bound
      code_challenge_tab: "unbound: the management screen offers no 'Code challenge' section, walked as the administrator on the seeded Sprint With Us opportunities at the code challenge, at the team scenario, in processing and awarded; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel"
      team_scenario_tab: "unbound: the management screen offers no 'Team scenario' section, walked as the administrator on the seeded Sprint With Us opportunities at the team scenario, in processing and awarded; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel"
      evaluation_panel_tab: bound
      # Since 2026-10-04 the screen draws "Consensus" (to the owner off the panel too),
      # "Instructions" and "Evaluation" (to the panel's members) as sections; each reads as its
      # text, and as nothing to a reader the screen opens for without it.
      consensus_tab: bound
      instructions_tab: bound
      evaluation_tab: bound
      proposal_deadline: bound
      assignment_date: bound
      evaluation_question_fields: bound
      note_control_offered: bound

  opportunity-swu-complete:
    actions: {}
    observations:
      full_report: bound

  # As on opportunity-swu-create, walked as the administrator and as a public sector
  # employee: "Add a resource" (each with its "Service area" chooser and "Target allocation"),
  # "Add a resource question", the three scoring weights and the evaluation panel were driven
  # on the form, and a draft saved from it landed on its management screen.
  opportunity-twu-create:
    actions:
      save_draft: bound
      submit_for_review: bound
      publish: bound
      add_resource: bound
      add_resource_question: bound
      set_evaluation_panel: bound
    observations:
      field_error: bound
      score_weight_error: bound
      evaluation_question_fields: bound

  # Read on the seeded closed Team With Us opportunity: the resources under "Service Areas",
  # the completion date in "Key Dates", the terms under the "Competition Rules" tab or, as the
  # running build draws it, the "Terms and conditions" region.
  opportunity-twu-view:
    actions:
      toggle_watch: bound
      start_proposal: bound
    observations:
      opportunity_identifier: bound
      status: bound
      published_date: bound
      created_by_name: bound
      last_changed_by_name: bound
      proposal_deadline: bound
      max_budget: bound
      resources: bound
      addenda: bound
      successful_proponent: bound
      assignment_date: bound
      start_date: bound
      completion_date: bound
      terms_section: bound
      successful_proponent_contact_details: bound
      successful_proponent_score: bound

  # Walked as the administrator on the seeded Team With Us opportunities published and lapsed
  # (00000000-0000-4000-8000-000000000801), at individual evaluation (with an evaluation already
  # begun), at consensus and at the challenge; as the owning public sector employee on seeded
  # ones and on a draft just saved from /opportunities/team-with-us/create (and deleted again);
  # and as a vendor, who is answered "Page not found". The screen is the Sprint With Us one:
  # sections Summary, Opportunity (the program's form, with "Start date" and "Completion date
  # (optional)" boxes; editable on a draft after "Edit"), Addenda (not on a draft), History
  # (with no note form) and Evaluation panel; a draft offers its owner "Edit", "Submit for
  # review" and "Delete", and "Cancel opportunity" is offered to the administrator from
  # published on. publish: as the administrator, a Team With Us draft saved from
  # /opportunities/team-with-us/create (and deleted again) offers "Edit", "Publish" and "Delete"
  # in its "Opportunity actions"; "Publish" opens a dialog "Publish this opportunity?" with
  # "Cancel" and "Publish opportunity". The Summary is Program, Proposal deadline, Assignment date, Maximum budget,
  # Created by, Last changed by and "Reporting"; the start and completion dates are read from
  # the Opportunity section's form. offered_state_changes reads the actions offered.
  opportunity-twu-edit:
    actions:
      edit_details: bound
      submit_for_review: bound
      publish: bound
      cancel_opportunity: bound
      delete_opportunity: bound
      add_addendum: bound
      edit_evaluation_panel: bound
      finalize_question_consensuses: "unbound: the management screen offers no 'Consensus' section and no control to finalize question consensuses, walked as the administrator on the seeded Team With Us opportunities at consensus (five proponents, every consensus agreed) and as their owning public sector employee; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel (the panel locked, 'The evaluation panel can no longer be changed'), its only action is 'Cancel opportunity', and ?tab=consensus falls back to the Summary"
    observations:
      opportunity_identifier: bound
      created_by_name: bound
      last_changed_by_name: bound
      summary_tab: bound
      opportunity_tab: bound
      addenda_tab: bound
      history_tab: bound
      # Re-walked on the current build as the administrator: the screen now has a "Proposals"
      # section, the table "Every proposal submitted to this opportunity" (Proponent | Status |
      # Submitted, names in plain text) on the seeded Team With Us opportunity at the
      # challenge. Read as the Code With Us one is: a section still withholding proposals
      # before the opportunity closes reads empty.
      proposals_tab: bound
      resource_questions_tab: bound
      challenge_tab: "unbound: the management screen offers no 'Challenge' section, walked as the administrator on the seeded Team With Us opportunity at the challenge; its sections are Summary, Opportunity, Addenda, History, Proposals (a list of proponents, added on the current build) and Evaluation panel"
      evaluation_panel_tab: bound
      # Since 2026-10-04 the screen draws "Consensus" (to the owner off the panel too),
      # "Instructions" and "Evaluation" (to the panel's members) as sections; each reads as its
      # text, and as nothing to a reader the screen opens for without it.
      consensus_tab: bound
      instructions_tab: bound
      evaluation_tab: bound
      offered_state_changes: bound
      proposal_deadline: bound
      assignment_date: bound
      start_date: bound
      completion_date: bound
      evaluation_question_fields: bound

  opportunity-twu-complete:
    actions: {}
    observations:
      full_report: bound

  scheduled-transition-trigger:
    actions:
      run_pending_transitions: bound
    observations:
      service_is_up: bound

  proposal-cwu-create:
    actions:
      choose_proponent_individual: bound
      choose_proponent_organization: bound
      add_attachment: bound
      save_draft: bound
      submit_proposal: bound
      accept_program_terms: bound
      accept_app_terms: bound
      cancel: bound
    observations:
      field_error: bound
      opportunity_summary: bound
      terms_modal: bound
      submit_disabled_until_terms_accepted: bound
      field_errors_by_field: bound

  proposal-cwu-edit:
    actions:
      start_editing: bound
      save_changes: bound
      save_changes_and_submit: bound
      submit_proposal: bound
      withdraw_proposal: bound
      delete_proposal: bound
      add_attachment: bound
      remove_attachment: bound
    observations:
      proposal_identifier: bound
      opportunity_identifier: bound
      proposal_tab: bound
      status: bound
      submitted_at: bound
      score: bound
      rank: bound
      available_actions: bound

  # Walked on the current build as the administrator on the seeded Code With Us proposals
  # submitted on the lapsed opportunity with three proposals (...a003...101), the lapsed ones
  # for scoring, at the final stage and for an award (a submitted one and the withdrawn one),
  # evaluated in processing (...a007...101, 82%) and awarded / not awarded (...a008...);
  # also as the public sector employee (...a007...101) and as the proposal's own vendor
  # (...a003...101). "Code With Us proposal" over the proponent's name (the h1), the terms
  # Opportunity, Status, Submitted and Proposal ID, a "Score" region (the term Score: "82%",
  # or "Not yet scored"), the link "Printable copy" to .../export, and under "Proposal
  # sections" the links Proposal (the regions Proponent, Proposal text, Additional comments,
  # Attachments) and History (the table "Every change of state and every score entered,
  # newest first": Date | Entry | By | Note). The vendor is also offered "Manage this
  # proposal". To staff the current build adds a "Proposal actions" group: "Enter score" and
  # "Disqualify" on a submitted proposal (...a003...101), "Award" and "Disqualify" on an
  # evaluated one (...a007...101); each opens a dialog ("Enter score": "Score (%)(required)"
  # then "Enter score"; "Disqualify this proposal?": "Reason (required)" then "Disqualify
  # proposal"; "Award this proposal?": "Award proposal"). A state or reader not offered the
  # control is the page withholding it, recorded and left; a dialog refusing its input
  # (no reason, a score out of range) stays open with its message and is put away. score reads the
  # term's value as shown ("82%", "Not yet scored"); export_link reads "enabled" for the
  # "Printable copy" link (its address is proposal-cwu-export-one); proponent reads the
  # heading, the name the screen gives the proponent.
  proposal-cwu-view:
    actions:
      enter_score: bound
      award_proposal: bound
      disqualify_proposal: bound
    observations:
      proposal_identifier: bound
      proposal_tab: bound
      history_tab: bound
      proponent: bound
      score: bound
      rank: "unbound: the Code With Us proposal's screen shows no rank or ranking: walked on the current build as the administrator on the seeded opportunity in processing with two evaluated proposals (...a007...101 at 82%, ...a007...102 at 74%) and on the awarded one (...a008...101 at 91%, ...a008...102 at 77%), it carries only the terms Opportunity, Status, Submitted, Proposal ID and Score, and the management screen's Proposals table is Proponent | Status | Submitted, with no rank column"
      export_link: bound

  # Seen 2026-10-04 on every program. .../proposals/:proposalId/export: "Back to the
  # proposal", "Print", then "<program> proposal" over the opportunity's title, the terms
  # Proponent, Status, Submitted and Proposal ID, and the proposal's sections; served to the
  # administrator and to the proposal's own vendor ("Page not found" to another vendor).
  # Proponent reads "Proponent N" to staff while the name is withheld and the organization's
  # name to its own vendor; anonymous_proponent_name returns only a "Proponent N" name.
  # .../proposals/export: "Export all <program> proposals", a "Name proponents anonymously"
  # box (no member of the contract presses it; it is left as found) and "Print", then every
  # submitted proposal; served to the administrator, "Page not found" to vendors, the
  # proposals' author included. A refused reader's exported_proposal reads as nothing.
  proposal-cwu-export-one:
    actions: {}
    observations:
      exported_proposal: bound

  proposal-cwu-export-all:
    actions: {}
    observations:
      exported_proposal: bound

  # Defaults the adapter supplies, which change what is submitted:
  # - submit_proposal, accept_program_terms and accept_app_terms fill every "Response to
  #   question N" box the test left empty with the placeholder text "Entered by the
  #   acceptance adapter so the proposal can be submitted." before going on, so the form is
  #   refused (or not) only for what the test is about.
  # - add_phase_team_member, set_scrum_master and team_member_choices choose the first
