# What this adapter binds against the running "new" target, and what it does not, as the
# target stands now (every entry below was walked again against it).
#
# The whole marketplace is served at this address. A signed-out visitor is shown the home
# page, /opportunities and each opportunity's public page, /organizations, /sign-in,
# /sign-up, /sign-out, /notice/deactivatedOwnAccount and /notice/authFailure, /proposals,
# the published pages under /content/:slug, /learn-more/:program and /status; the service
# answers its interface under /api (files included).
#
# Signing in: "Sign in as a vendor" and "Sign in as a public sector employee" on /sign-in
# hand off to the sandbox identity provider's own form (Username, Password, "Sign In"), and
# signIn() fills it with the persona's username and the sandbox password from the
# environment, then waits for the client to send the person on (a vendor still to complete
# a profile to /sign-up/complete, everyone else to /dashboard). The screens that need a
# session were walked signed in — as vendors (with and without proposals, the one whose
# terms were reset, the one still to complete a profile, a first-time vendor), the public
# sector employee, a first-time public sector employee and the administrator, with the
# seeded records' identifiers. The running build serves a signed-in person /dashboard (to
# staff, "Create an opportunity" over their opportunities' table), their own profile at /users/me or /users/<own id> with its
# Notifications and Legal sections, the content-management screens (/content,
# /content/create, /content/:slug/edit) to the administrator, and /sign-up/complete to a
# vendor still to complete a profile, and to the administrator and public sector staff the
# program chooser, the Code With Us form and a Code With Us opportunity's management screen.
# Every other screen that needs a session (the other opportunity screens, the proposal, organization and evaluation screens, /users, and another account's
# /users/:userId even for the administrator) answers "Page not found", and so, when walked
# signed in, did /opportunities, /organizations and /proposals themselves. A deactivated
# vendor's sign-in ends on /notice/authFailure. A member about the refusal itself reads it.
#
# Each member's reason is written out in full beside it (no anchors or aliases), so a page's
# members that share a reason repeat it word for word.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      # "95" over "TOTAL OPPORTUNITIES AWARDED", "$14,241,500" over "TOTAL VALUE OF ALL OPPORTUNITIES".
      total_awarded_opportunity_count: bound
      total_awarded_opportunity_value: bound
      readable_when_signed_out: bound

  # Walked again on this build signed in as the administrator and as a public sector
  # employee with no opportunities: /dashboard is "Dashboard", a "Create an opportunity"
  # link to /opportunities/create, and to the administrator "All opportunities" — a table
  # (Title, Program, Status, Last updated, Created by) of every opportunity, each title a
  # link to its management screen; the public sector employee's "My opportunities" reads
  # "You have not created any opportunities yet." with no table.
  opportunity-dashboard:
    actions:
      create_opportunity: bound
      open_opportunity: bound
    observations:
      my_opportunities_table: bound
      opportunity_status: bound
      own_opportunities_only: bound
      all_opportunities_for_administrator: bound
      empty_my_opportunities_message: bound

  # Read signed out: a "Filter Opportunities" program chooser, "Remote OK", "Search by Title
  # or Location", and the cards under "Open Opportunities <count>" and a folded "Closed
  # Opportunities" (no unpublished group is shown to a signed-out visitor, so it reads empty).
  opportunity-list:
    actions:
      filter_by_program: bound
      filter_by_status: "unbound: opened /opportunities signed out: it offers the 'Filter Opportunities' program chooser, 'Remote OK' and 'Search by Title or Location', and no status chooser; walked signed in as the administrator and as a vendor, the running build answers /opportunities itself with 'Page not found', so no signed-in reader is offered a status chooser either"
      filter_remote_only: bound
      search: bound
      toggle_watch: "unbound: opened /opportunities signed out; no card carries a watch control — watching is offered only to a signed-in person, and walked signed in (as the administrator, and as a vendor for a vendor's screens, with the seeded records' identifiers) the running build answers it with 'Page not found', as it does every Sprint With Us, Team With Us, proposal, organization and evaluation screen, /opportunities and /organizations included (rechecked signed in as the administrator, a public sector employee and a vendor: besides /dashboard, the account screens and /content, the only opportunity screens it serves are a Code With Us opportunity's public page and, to the administrator and public sector staff only, /opportunities/create, /opportunities/code-with-us/create and a Code With Us opportunity's management screen)"
    observations:
      unpublished_group: bound
      open_group: bound
      closed_group: bound
      opportunity_status: bound
      proposal_deadline: bound

  # Signed in as the administrator or a public sector employee: "Create an opportunity", one
  # region per program with "Maximum budget: …" and a "Create a <program> opportunity" link.
  # A vendor is shown "Page not found". The Sprint With Us and Team With Us links lead to
  # forms the running build answers with "Page not found" (see those pages).
  opportunity-program-select:
    actions:
      choose_code_with_us: bound
      choose_sprint_with_us: bound
      choose_team_with_us: bound
    observations:
      program_card: bound
      max_budget: bound

  # Bound signed in as the administrator ("Save draft", "Publish" with its "Publish
  # opportunity" confirmation) and as a public sector employee ("Save draft", "Submit for
  # review"). Every input key goes to its field: title, teaser, location, remoteOk (the
  # "Remote OK: remote work is acceptable" box), remoteDesc, reward, skills (the multi-pick
  # "Skills" chooser), description and the four dates; a key no field takes is reported
  # unbound by name. Anybody who may not create an opportunity (a vendor, a visitor) is
  # answered "Page not found", which the actions report as a refusal, not as unbound.
  opportunity-cwu-create:
    actions:
      save_draft: bound
      submit_for_review: bound
      publish: bound
      add_attachment: bound
    observations:
      field_error: bound

  # The public page as the running build now draws it: terms and definitions (Status,
  # Proposal deadline, Reward, Location, Remote work, Published, Created by, Last changed
  # by), "Opportunity ID: <id>", a "Watch this opportunity" checkbox to anybody signed in,
  # and Description, Skills, Key dates and Addenda sections. A draft answers anybody who may
  # not see it (a vendor, another staff member) "Page not found"; for an opportunity known
  # to exist (seeded, or seen open earlier in the run) every reading is then empty.
  opportunity-cwu-view:
    actions:
      toggle_watch: bound
      start_proposal: "unbound: walked signed in as a vendor (and as the administrator and a public sector employee) on the seeded published Code With Us opportunity, whose proposal deadline is in 2030: the page's only control is the 'Watch this opportunity' checkbox (and 'Manage this opportunity', to staff), with no way to start a proposal, and /opportunities/code-with-us/:opportunityId/proposals/create answers 'Page not found' to the vendor"
    observations:
      opportunity_identifier: bound
      # The administrator reads the seeded draft of another staff member as "Draft"; a
      # vendor and the other public sector employee are answered "Page not found" and read "".
      status: bound
      published_date: bound
      created_by_name: bound
      last_changed_by_name: bound
      proposal_deadline: bound
      reward: bound
      addenda: bound
      # The seeded awarded opportunity's page names no winner; on a page that opened these read empty.
      successful_proponent: bound
      assignment_date: bound
      start_date: bound
      successful_proponent_contact_details: bound
      successful_proponent_score: bound

  # Signed in as the administrator, or a public sector employee for their own opportunity:
  # "Status: <state>", "Opportunity ID: <id>", an "Opportunity actions" group (a draft:
  # Publish to the administrator or Submit for review to its author, and Delete, with no
  # Edit because the draft's form is already editable, so edit_details edits it in place;
  # published: Edit; awarded: nothing) and the sections Summary, Opportunity (the form,
  # with Save changes), Addenda (once published) and History. Publishing and deleting are
  # confirmed in a dialog. Publish is offered only to the administrator: for anybody else
  # its absence (or the screen answering "Page not found") is reported as a refusal.
  opportunity-cwu-edit:
    actions:
      edit_details: bound
      submit_for_review: bound
      publish: bound
      cancel_opportunity: "unbound: walked as the administrator and as a public sector employee on the seeded draft, published, awarded and with-three-proposals Code With Us opportunities and on ones just saved and published: the opportunity's actions are Edit, Publish or Submit for review and Delete on a draft, only Edit once published, and nothing once awarded — no control cancels an opportunity"
      delete_opportunity: bound
      add_addendum: "unbound: walked as the administrator on the seeded published and with-three-proposals Code With Us opportunities and on one just published: the Addenda section reads only 'No addenda have been added.' with no control to add one, and a draft has no Addenda section"
      add_note: "unbound: walked as the administrator and as a public sector employee on draft, published and awarded Code With Us opportunities: the History section is a table of entries (Date, Entry, By, Note) with no control to add a note"
    observations:
      opportunity_identifier: bound
      created_by_name: bound
      last_changed_by_name: bound
      summary_tab: bound
      opportunity_tab: bound
      addenda_tab: bound
      history_tab: bound
      proposals_tab: "unbound: walked as the administrator on the seeded lapsed Code With Us opportunity with three proposals (and on the published, awarded and draft ones): the sections offered are Summary, Opportunity, Addenda and History only, and ?tab=proposals shows the summary"
      reporting_views: "unbound: looked again as the administrator and as the owning public sector employee on the seeded published, lapsed-with-three-proposals, in-processing and awarded Code With Us opportunities: the Summary shows only Proposal deadline, Reward, Published, Created by and Last changed by, the only sections are Summary, Opportunity, Addenda and History, and the opportunity the screen loads from /api/opportunities/code-with-us/:id carries no view count; a draft's summary says 'Views, watchers and proposals are counted once the opportunity is published.' (read there as nothing). Looked once more as the administrator: ?tab=reporting and ?tab=proposals fall back to the same Summary, the public opportunity page, /dashboard and /opportunities show no count, and /complete answers Page not found on the seeded lapsed, final-stage and in-processing ones. GET /api/counters does answer the views counter with a number, but no screen shows it, so this page observation stays unbound rather than being read from the API. Looked a third time as the administrator after opening the seeded published opportunity's public page (its views counter then read 1): the Summary still showed no Views, and the Sprint With Us manage Summary of its seeded published opportunity carries none either; the count is read through opportunity-counters.view_count instead"
      reporting_watchers: "unbound: looked again as the administrator and as the owning public sector employee on the seeded published, lapsed-with-three-proposals, in-processing and awarded Code With Us opportunities, and on the published one after the administrator ticked 'Watch this opportunity' on its page and came back: the Summary still shows no count of watchers, no section is a report, and the opportunity the screen loads from /api/opportunities/code-with-us/:id carries no watcher count; a draft's summary says 'Views, watchers and proposals are counted once the opportunity is published.' (read there as nothing). Looked once more as the administrator: ?tab=reporting and ?tab=proposals fall back to the same Summary, the public opportunity page, /dashboard and /opportunities show no count, and /complete answers Page not found on the seeded lapsed, final-stage and in-processing ones. GET /api/counters does answer the watchers counter with a number, but no screen shows it, so this page observation stays unbound rather than being read from the API. Looked a third time as the administrator on the seeded published Code With Us and Sprint With Us manage Summaries: neither shows Watchers"
      reporting_proposals: "unbound: walked as the administrator on the seeded lapsed Code With Us opportunity with three proposals and on the published and awarded ones: the summary shows no count of proposals; a draft's summary says 'Views, watchers and proposals are counted once the opportunity is published.' (read there as nothing)"
      proposal_deadline: bound
      assignment_date: bound
      start_date: bound
      completion_date: bound

  opportunity-cwu-complete:
    actions: {}
    observations:
      full_report: "unbound: /opportunities/code-with-us/:opportunityId/complete is offered only to a signed-in person, and walked signed in (as the administrator, and as a vendor for a vendor's screens, with the seeded records' identifiers) the running build answers it with 'Page not found', as it does every Sprint With Us, Team With Us, proposal, organization and evaluation screen, /opportunities and /organizations included (rechecked signed in as the administrator, a public sector employee and a vendor: besides /dashboard, the account screens and /content, the only opportunity screens it serves are a Code With Us opportunity's public page and, to the administrator and public sector staff only, /opportunities/create, /opportunities/code-with-us/create and a Code With Us opportunity's management screen); opened signed out with the seeded published Code With Us opportunity it redirects to /sign-in"

