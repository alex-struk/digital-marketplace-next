    observations:
      field_error: "unbound: signed in as the administrator (and signed out), /opportunities/code-with-us/create shows 'Page not found' on the running build, which serves a signed-in person only /dashboard and their own account screens. At run time the adapter reads the form's alerts and the descriptions of fields marked invalid"

