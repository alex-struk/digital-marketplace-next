      read_page_list_by_request: bound
      read_page_by_request: bound
      create_page_by_request: bound
      change_page_by_request: bound
      rename_page_by_request: bound
      remove_page_by_request: bound
    observations:
      request_accepted: bound
      refusal_status: bound
      refusal_shape: bound

  evaluation-individual-request-swu:
