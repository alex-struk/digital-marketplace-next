  # "Sign In": a "Vendor" region with the button "Sign in as a vendor" and a "Public sector
  # employee" region with "Sign in as a public sector employee"; each hands off to the sandbox
  # identity provider's "Sign in to your account" form, which is what pressing it does.
  # /sign-up ("Choose Account Type") is the same with "Sign up as ...".
  user-sign-in:
    actions:
      sign_in_as_vendor: bound
      sign_in_as_public_sector_employee: bound
      go_to_sign_up: bound
    observations:
      vendor_card: bound
      public_sector_card: bound

  user-sign-up-choose-account:
    actions:
      sign_up_as_vendor: bound
      sign_up_as_public_sector_employee: bound
    observations:
      vendor_card: bound
      public_sector_card: bound

  # Walked signed in through the sandbox identity provider. As the vendor still to agree
  # (test-vendor-17), /sign-up/complete shows "Complete Your Profile": "Sign-in username"
  # (read-only), "Name", "Email address", "Email me when new opportunities are posted", the
  # terms box, and "Complete profile", which stays disabled until the terms box is ticked.
  # A first-time vendor (first-time-vendor) is sent there by the sign-in itself and shown the
  # same form, its "Name" and "Email address" already filled from the identity provider
  # ("Jordan Placeholder", "first.vendor@example.test") and both boxes unticked. A first-time
  # public sector employee, like the administrator, is sent from it to /dashboard and is never
  # shown the form; signed out it sends the browser to
  # /sign-in?redirectOnSuccess=%2Fsign-up%2Fcomplete. When the browser is sent on, every
  # reading below answers empty (the absent form is what those people see, R-4.23) and every
  # action reports unbound naming where the browser was sent. signIn() now waits for the
  # client's own send-on after the provider hands back, so a reading taken straight after
  # signing in is taken on the screen the person actually lands on.
  user-sign-up-complete:
    actions:
      # The 'Choose a profile picture' button is on the form and opens no file chooser; the
      # action presses it and fails naming that button (see file-image-picker).
      change_avatar: bound
      accept_app_terms: bound
      toggle_new_opportunity_notifications: bound
      complete_profile: bound
    observations:
      idp_username_readonly: bound
      name_field: bound
      email_field: bound
      job_title_field: bound
      terms_checkbox: bound
      complete_disabled_until_terms_accepted: bound
      field_error: bound

  # Reached signed in through the header's "Sign out" link (and signed out, by opening
  # /sign-out): "Signed Out" / "You have successfully signed out" / "Sign in again".
  # surface.signOut() takes that link (or opens /sign-out), waits for this screen and stops
  # there; it clears no cookies or storage of its own.
  user-sign-out:
    actions: {}
    observations:
      signed_out_message: bound
      sign_out_failed_message: bound

  # "Account Deactivation Successful" / "Sign-In Failed"; any other notice is "Not Found".
  user-notice:
    actions:
      back_to_home: bound
    observations:
      deactivated_own_account_notice: bound
      sign_in_failed_notice: bound

  # Walked again signed in as the administrator: the header's "Users" link opens /users,
  # "Digital Marketplace Users" — a search box, "Export contact list" and one unpaginated
  # table of every account (Status | Account type | Name | Administrator). A public sector
  # employee is shown "Page not found" there; signed out it redirects to /sign-in.
  user-list:
    actions:
      search_by_name: bound
      open_export_contact_list: bound
      toggle_export_user_type: bound
      toggle_export_field: bound
      export_contact_list: bound
      cancel_export: bound
      open_user_profile: bound
    observations:
      user_row: bound
      status_badge: bound
      account_type: bound
      admin_check: bound
      export_modal: bound
      export_disabled_until_selection: bound

  # Walked signed in again (as the administrator and the organization-owner vendor). One's own
  # /users/<id> draws what /users/me draws: "User Profile" over a "Profile sections" navigation
  # of links (Profile, Capabilities and Organizations for a vendor, Notifications, Legal),
  # "Account type: …", "Status: …" and "Account ID: …", then "Details" with read-only
  # "Sign-in username", "Name", "Email address" boxes ("Job title" too for public sector
  # staff) and an "Edit profile" button, which opens "Edit your details" (the "Profile picture
  # (optional)" group with "Choose a profile picture", the boxes made editable, "Save changes"
  # and "Cancel"); a vendor's also offers "Deactivate account", which opens "Deactivate your
  # account?" with "Cancel" and "Deactivate my account". As the administrator, another
  # account's /users/:userId (the organization owner's, 00000000-0000-4000-8000-000000000202)
  # now opens: the account facts and "Details" with "Sign-in username", "Name" and "Email
  # address" (org.owner@example.test), and no control at all. A vendor still to complete a
  # profile is sent on to /sign-up/complete, which every member reports as such.
  user-profile:
    actions:
      edit_profile: bound
      save_changes: bound
      cancel_editing: bound
      # Pressed on the form 'Edit profile' opens; it fails naming the inert 'Choose a profile
      # picture' button (see file-image-picker).
      change_avatar: bound
      toggle_admin_permission: "unbound: walked signed in as the administrator, its own /users/<id> says 'You have administrator permissions.' with no box, and another account's /users/:userId (the organization owner's) opens with the account facts and 'Details' and no control at all — no administrator box, switch or button"
      deactivate_account: bound
      reactivate_account: "unbound: walked signed in as the administrator, another account's /users/:userId (the organization owner's) opens with the account facts and 'Details' and no control at all, and one's own profile offers only 'Deactivate account' (to a vendor); no reactivate control is drawn anywhere on the profile"
      confirm_activation_change: bound
      cancel_activation_change: bound
    observations:
      user_identifier: bound
      profile_tab: bound
      # The "Capabilities" and "Organizations" links under "Profile sections" go to the
      # sections described under user-profile-capabilities and organization-user-memberships;
      # the administrator's view of another account has no "Profile sections" and reads empty.
      capabilities_tab: bound
      notifications_tab: bound
      legal_tab: bound
      organizations_tab: bound
      status_badge: bound
      account_type: bound
      permissions_label: bound
      admin_checkbox: bound
      idp_username_readonly: bound
      name_field: bound
      email_field: bound
      job_title_field: bound
      field_error: bound
      activation_modal: bound
      # Signed out, a seeded account's /users/:userId and an unknown one both show "Page not found" over
      # "The page you are looking for does not exist." / "Back to home", which this reads whole; a profile
      # that opened reads as nothing.
      not_found_page: bound

  # Walked signed in as the organization-owner vendor at /users/me?tab=capabilities and its own
  # /users/<id>?tab=capabilities: "Capabilities" over "Tick each capability you have. Your
  # choices are saved as you make them, …" and a list named "Capabilities", one item per
  # capability with a box named for it and a "Show description of <name>" button (which turns
  # into "Hide description of <name>" and draws the description under it). Ticking a box saves
  # it at once ("Saved. DevOps Engineering is recorded as a capability you hold.") and it stays
  # ticked after a reload. The administrator's view of another account draws no such list, so
  # the actions report unbound there and the readings read empty.
  user-profile-capabilities:
    actions:
      toggle_capability: bound
      expand_capability_description: bound
    observations:
      capability_row: bound
      capability_checked: bound
      capability_description: bound

  # Walked signed in as the organization-owner vendor and the administrator at their own
  # /users/<id>?tab=notifications, which draws what /users/me?tab=notifications draws (see
  # user-profile-self-notifications); another account's identifier answers "Page not found",
  # except to the administrator, who is shown that account's profile without the section.
  user-profile-notifications:
    actions:
      toggle_new_opportunity_notifications: bound
      confirm_unsubscribe: "unbound: walked signed in as the organization-owner vendor and the administrator, the Notifications section's only control is the 'Email me when new opportunities are posted' box; pressing it while ticked left it ticked, opened no dialog and sent nothing to the service, and /users/me?tab=notifications&unsubscribe draws the same section with no dialog, so there is no unsubscribe dialog to confirm or cancel"
