# What this adapter binds against the running "new" target (build-slice-2-10), and what it
# does not. Every entry was walked on the target: signed out, and signed in through the
# sandbox identity provider as the vendor, public sector staff, the administrator, the
# organization owner, the vendor with notices off, the vendor with terms reset, the vendor
# part-way through completing a profile, the deactivated vendor, and the first-time vendor,
# first-time public sector employee and first-time vendor without an email address.
#
# The target is a partial build. Its screens are /, /sign-in, /sign-up, /sign-up/complete,
# /sign-out, /notice/:noticeId, /content/:slug, /learn-more/:program, /dashboard (a greeting
# only) and one's own profile at /users/me or /users/<own id> with its Profile,
# Notifications and Legal tabs; /status answers "OK". Every other screen the contract names
# answers with the "Page not found" screen whoever is signed in, the administrator included,
# and /admin/email-notification-reference is answered by the service with a JSON 404. Of the
# service's interface only GET /api/sessions/current, GET /api/content/:slug and
# PUT /api/users/:id have handlers; every other request answers 404 "Cannot <METHOD> …".
#
# A reading of a screen that opened and shows nothing of what is asked (a table the
# dashboard does not draw, a dialog that is not open, a job title a vendor's form lacks) is
# bound and reads empty; only a screen that cannot be reached, or a control that is not
# drawn, is unbound.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      # The home page draws no awarded figures on this build; these read empty.
      total_awarded_opportunity_count: bound
      total_awarded_opportunity_value: bound
      readable_when_signed_out: bound

  # /dashboard shows "Dashboard" and "You are signed in as <name>." for every account and
  # nothing else; readings are empty, controls are not drawn.
  opportunity-dashboard:
    actions:
      create_opportunity: "unbound: signed in as public sector staff and as the administrator and opened /dashboard: it shows only 'Dashboard' and 'You are signed in as …', with no control to create an opportunity (and /opportunities/create and /opportunities/code-with-us/create answer 'Page not found')"
      open_opportunity: "unbound: signed in as public sector staff and as the administrator and opened /dashboard: it shows only 'Dashboard' and 'You are signed in as …', with no opportunity links (and every opportunity address answers 'Page not found')"
    observations:
      my_opportunities_table: bound
      opportunity_status: bound
      own_opportunities_only: bound
      all_opportunities_for_administrator: bound
      empty_my_opportunities_message: bound

