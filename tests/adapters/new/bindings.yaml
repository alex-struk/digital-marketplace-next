# What this adapter binds against the running "new" target, and what it does not, as the
# target stands now (every entry below was walked again against it).
#
# The whole marketplace is served at this address. A signed-out visitor is shown the home
# page, /opportunities and each opportunity's public page, /organizations, /sign-in,
# /sign-up, /sign-out, /notice/deactivatedOwnAccount and /notice/authFailure, /proposals,
# the published pages under /content/:slug, /learn-more/:program and /status; the service
# answers its interface under /api (files included).
#
# Signing in: "Sign in as a vendor" and "Sign in as a public sector employee" on /sign-in
# hand off to the sandbox identity provider's own form (Username, Password, "Sign In"), and
# signIn() fills it with the persona's username and the sandbox password from the
# environment, then waits for the client to send the person on (a vendor still to complete
# a profile to /sign-up/complete, everyone else to /dashboard). The screens that need a
# session were walked signed in — as vendors (with and without proposals, the one whose
# terms were reset, the one still to complete a profile, a first-time vendor), the public
# sector employee, a first-time public sector employee and the administrator, with the
# seeded records' identifiers. The running build serves a signed-in person /dashboard (a
# greeting and nothing else), their own profile at /users/me or /users/<own id> with its
# Notifications and Legal sections, and /sign-up/complete to a vendor still to complete a
# profile. Every other screen that needs a session (the opportunity, proposal,
# organization, content-management and evaluation screens, /users, and another account's
# /users/:userId even for the administrator) answers "Page not found", and so, when walked
# signed in, did /opportunities, /organizations and /proposals themselves. A deactivated
# vendor's sign-in ends on /notice/authFailure. A member about the refusal itself reads it.
#
# Each member's reason is written out in full beside it (no anchors or aliases), so a page's
# members that share a reason repeat it word for word.
target: new
pages:
  home:
    actions:
      browse_opportunities: bound
      sign_in: bound
      sign_up: bound
    observations:
      # "95" over "TOTAL OPPORTUNITIES AWARDED", "$14,241,500" over "TOTAL VALUE OF ALL OPPORTUNITIES".
      total_awarded_opportunity_count: bound
      total_awarded_opportunity_value: bound
      readable_when_signed_out: bound

  # Walked signed in as the public sector employee, a first-time public sector employee and
  # the administrator: /dashboard is "Dashboard" over "You are signed in as <name>." and
  # nothing else — no table, no link, no button. The readings reach it and report what is
  # there, which is no rows and no message; the actions find nothing to press.
  opportunity-dashboard:
    actions:
      create_opportunity: "unbound: signed in as the public sector employee and as the administrator, /dashboard reads only 'Dashboard' / 'You are signed in as <name>.' and offers no 'Create Opportunity' link or button (no control at all); /opportunities/create itself answers 'Page not found'"
      open_opportunity: "unbound: signed in as the public sector employee and as the administrator, /dashboard reads only 'Dashboard' / 'You are signed in as <name>.' and carries no opportunity link; every seeded opportunity's page answers 'Page not found' to them"
    observations:
      my_opportunities_table: bound
      opportunity_status: bound
      own_opportunities_only: bound
      all_opportunities_for_administrator: bound
      empty_my_opportunities_message: bound

  # Read signed out: a "Filter Opportunities" program chooser, "Remote OK", "Search by Title
  # or Location", and the cards under "Open Opportunities <count>" and a folded "Closed
  # Opportunities" (no unpublished group is shown to a signed-out visitor, so it reads empty).
  opportunity-list:
    actions:
      filter_by_program: bound
      filter_by_status: "unbound: opened /opportunities signed out: it offers the 'Filter Opportunities' program chooser, 'Remote OK' and 'Search by Title or Location', and no status chooser; walked signed in as the administrator and as a vendor, the running build answers /opportunities itself with 'Page not found', so no signed-in reader is offered a status chooser either"
      filter_remote_only: bound
      search: bound
      toggle_watch: "unbound: opened /opportunities signed out; no card carries a watch control — watching is offered only to a signed-in person, and walked signed in (as the administrator, and as a vendor for a vendor's screens, with the seeded records' identifiers) the running build answers it with 'Page not found', as it does every opportunity, proposal, organization, content-management and evaluation screen, /opportunities and /organizations included: it serves a signed-in person only /dashboard and their own account screens"
    observations:
      unpublished_group: bound
      open_group: bound
      closed_group: bound
      opportunity_status: bound
      proposal_deadline: bound

  opportunity-program-select:
    actions:
      choose_code_with_us: "unbound: /opportunities/create is offered only to signed-in public sector staff, and walked signed in (as the administrator, and as a vendor for a vendor's screens, with the seeded records' identifiers) the running build answers it with 'Page not found', as it does every opportunity, proposal, organization, content-management and evaluation screen, /opportunities and /organizations included: it serves a signed-in person only /dashboard and their own account screens; opened signed out it redirects to /sign-in"
      choose_sprint_with_us: "unbound: /opportunities/create is offered only to signed-in public sector staff, and walked signed in (as the administrator, and as a vendor for a vendor's screens, with the seeded records' identifiers) the running build answers it with 'Page not found', as it does every opportunity, proposal, organization, content-management and evaluation screen, /opportunities and /organizations included: it serves a signed-in person only /dashboard and their own account screens; opened signed out it redirects to /sign-in"
