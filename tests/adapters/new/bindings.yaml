  # Walked signed in. As the administrator, /users/00000000-0000-4000-8000-000000000101 (its
  # own identifier) opens the profile, while the first vendor's
  # /users/00000000-0000-4000-8000-000000000201 and every other account's answer "Page not
  # found"; as the organization-owner vendor its own /users/00000000-0000-4000-8000-000000000202
  # opens and the first vendor's does not. The profile is "User Profile" over a "Profile
  # sections" navigation of links (Profile, Capabilities and Organizations for a vendor,
  # Notifications, Legal), "Account type: …", "Status: …" (the value beside its label) and
  # "Account ID: …", then "Details": "No profile picture has been added.", and read-only
  # "Sign-in username", "Name", "Email address" boxes ("Job title" too for public sector
  # staff), and for public sector staff "Permissions" over "You have administrator
  # permissions." or "You do not have administrator permissions.". It offers no edit, save,
  # cancel, picture, deactivate, reactivate or administrator control and opens no dialog, so
  # the readings of those (admin_checkbox, field_error, activation_modal) reach it and read
