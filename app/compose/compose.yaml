# Everything the application needs to run on one machine: the application itself, its
# database, a sandbox identity provider, a mail catcher, and the seed.
#
# For a builder's machine only. Nothing here is referred to by a deploy workflow (the stack
# profile), and no address here belongs to any environment but this one.
#
# The identity provider's accounts sign in with the password SDLC_SANDBOX_PASSWORD holds. It
# is read from the environment and written into no file in this repository.
#
#   SDLC_SANDBOX_PASSWORD=... docker compose -f app/compose/compose.yaml up --build
#   SDLC_SANDBOX_PASSWORD=... docker compose -f app/compose/compose.yaml up seed
#
# The application answers on http://localhost:4300 (the frontend listens on 3000 inside its
# container; only the host port is fixed).

name: digital-marketplace

x-database-url: &database-url
  DATABASE_URL: postgresql://marketplace:marketplace@database:5432/digital_marketplace

services:
  # The single-page app, and the web server that forwards /api, /status and /admin to the
  # service, so a browser sees one origin (decision record 0001).
  frontend:
    build:
      context: ../..
      dockerfile: app/frontend/Dockerfile
    environment:
      BACKEND_ORIGIN: backend:3001
      # Where the browser signs in (served to the app as /app-config.json). A public client:
      # there is no secret anywhere in the browser (decision record 0004).
      OIDC_ISSUER: http://localhost:8080/realms/digital-marketplace
      OIDC_CLIENT_ID: digital-marketplace-app
    ports:
      - "4300:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile
    environment:
      <<: *database-url
      PORT: "3001"
      NODE_ENV: production
      PUBLIC_ORIGIN: http://localhost:4300
      # Tokens name the realm as the browser reached it; the service reads the realm's
      # signing keys over the compose network (decision record 0011).
      OIDC_ISSUER: http://localhost:8080/realms/digital-marketplace
      OIDC_JWKS_URI: http://idp:8080/realms/digital-marketplace/protocol/openid-connect/certs
      OIDC_CLIENT_ID: digital-marketplace-app
      # The mail path (R-6.1 to R-6.5): one sender, messages marked as coming from a test
      # environment, and sent through the hold proxy to the catcher. Setting
      # SDLC_DISABLE_NOTIFICATIONS=1 when starting switches every message off.
      MAILER_FROM: Digital Marketplace <donotreply@example.test>
      SHOW_TEST_INDICATOR: "1"
      DISABLE_NOTIFICATIONS: ${SDLC_DISABLE_NOTIFICATIONS:-}
      SMTP_HOST: mail-hold
      SMTP_PORT: "1025"
    expose:
      - "3001"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The schema's history, run before the service starts. In a sandbox namespace this same
  # image is the backend's init container (decision record 0001, departure 1).
  migrate:
    build:
      context: ../..
      dockerfile: app/migrations/Dockerfile
    environment:
      <<: *database-url
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # Puts the data back to the state tests/seed/manifest.yaml describes: it wipes whatever is
  # there, runs the whole migration history, and applies tests/seed/*.sql in order. Running
  # it twice leaves the same data.
  #
  # It is asked for by name — `docker compose up seed` — and so does not run with the rest.
  seed:
    build:
      context: ../..
      dockerfile: app/migrations/Dockerfile
    command: ["npm", "run", "seed"]
    environment:
      <<: *database-url
      SEED_DIR: /srv/seed
    volumes:
      - ../../tests/seed:/srv/seed:ro
    depends_on:
      database:
        condition: service_healthy
    profiles: ["seed"]
    restart: "no"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: digital_marketplace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d digital_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  # Renders the realm with the password the environment holds, into a volume. The password
  # reaches no file in this repository. See app/compose/idp/README.md.
  idp-realm:
    image: node:22-alpine
    environment:
      SDLC_SANDBOX_PASSWORD: ${SDLC_SANDBOX_PASSWORD:-}
    volumes:
      - ./idp/realm-template.json:/template/realm.json:ro
      - ./idp/render-realm.mjs:/render-realm.mjs:ro
      - idp-import:/import
    command: ["node", "/render-realm.mjs"]
    restart: "no"

  idp:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SDLC_SANDBOX_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - idp-import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      idp-realm:
        condition: service_completed_successfully
    restart: unless-stopped

  # Every message the service sends arrives here and goes no further. Read it at
  # http://localhost:8025. Its fault injection ("chaos") is on, so a test can make it
  # refuse delivery (spec/contract/observables.yaml, email.delivery_fault).
  mail:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_ENABLE_CHAOS: "true"
    expose:
      - "8025"
    ports:
      - "1025:1025"
    restart: unless-stopped

  # A pass-through proxy between the service and the catcher's SMTP port, so a test can
  # make the mail server slow to answer (observables.yaml, email.delivery_delay). With no
  # toxic in force it changes nothing.
  mail-hold:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./mail/toxiproxy.json:/config/toxiproxy.json:ro
    expose:
      - "1025"
      - "8474"
    depends_on:
      mail:
        condition: service_started
    restart: unless-stopped

  # The catcher's API at http://localhost:8025, with the hold proxy's own API beside it
  # under /hold, as the acceptance suite addresses them.
  mail-api:
    image: caddy:2-alpine
    volumes:
      - ./mail/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8025:8025"
    depends_on:
      mail:
        condition: service_started
      mail-hold:
        condition: service_started
    restart: unless-stopped

volumes:
  database:
  idp-import:
